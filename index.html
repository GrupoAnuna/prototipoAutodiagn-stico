ón y sensibilización comunitaria","d":"El indicador evalúa el compromiso de la empresa con la participación y el desarrollo de la comunidad, específicamente a través de la Inversión Social Privada (ISP) en proyectos de educación y sensibilización, buscando fortalecer el capital social y las capacidades locales.","l":["No se desarrollan acciones educativas con la comunidad.","La empresa impulsa programas educativos o ambientales junto a instituciones locales.","La empresa diseña y ejecuta programas de formación comunitaria que fortalecen capacidades y conocimiento.","La empresa consolida alianzas para promover educación ambiental, tecnológica o social a largo plazo en su comunidad."],"a":["Gestionar la firma del acuerdo de colaboración simple con la institución local para normar los compromisos mutuos, recursos asignados y objetivos de las jornadas educativas, e instrumentar de manera operativa el registro de las actividades (agenda, participantes) para garantizar el control presupuestario de la ISP, documentar las horas de voluntariado y asegurar la trazabilidad del alcance comunitario logrado.","Coordinar la elaboración y aprobación del Documento de Diseño del Programa de Formación Comunitaria para establecer con claridad el temario, la metodología de enseñanza y las metas de desarrollo alineadas con el entorno, e instrumentar de manera operativa el registro de la evaluación de efectividad de la formación para medir rigurosamente el incremento de conocimientos, auditar el volumen de graduados y garantizar la mejora continua del impacto social y educativo generado.","Gestionar la formalización del Convenio de Alianza Estratégica Multisectorial para educación con el fin de institucionalizar el respaldo técnico y financiero de los actores clave, e instrumentar de manera operativa el Informe Anual de Impacto del programa educativo para auditar públicamente los resultados sistémicos y transparentar el valor real transferido a la comunidad.","Extender el alcance de los programas de formación técnica y ambiental hacia las comunidades de influencia de los contratistas principales y proveedores (Tier 2) para homogeneizar el desarrollo de capacidades en el territorio, e institucionalizar una plataforma digital de conocimiento abierto en alianza con universidades de primer nivel, compartiendo de manera transparente las metodologías de aprendizaje, los indicadores de efectividad y los modelos pedagógicos replicables para elevar el estándar de la inversión social educativa en toda la industria."],"s":"ODS 4, ODS 11, Sistema B, UE ESRS S3"},{"id":"comunidad-10","sub":"","t":"Monitoreo y mejora del desempeño social","d":"El indicador evalúa el nivel de Rendición de Cuentas (Accountability) y la implementación de un ciclo de mejora continua en la gestión de las acciones sociales y el desarrollo comunitario, asegurando que los recursos destinados generen un Impacto Social medible.","l":["No se miden los resultados de las acciones sociales.","La empresa analiza los resultados y aplica ajustes para mejorar el impacto social.","La empresa consolida un sistema de monitoreo con metas y evaluación anual del desempeño social.","La empresa integra los resultados sociales a su gestión estratégica, comunicando avances y aprendizajes de manera transparente."],"a":["Instrumentar de manera operativa el registro de Indicadores de Alcance y Resultado por proyecto para asegurar la recopilación estandarizada de métricas de cumplimiento y evaluar con precisión el desempeño de cada acción social, y coordinar la elaboración del informe de ajustes aplicados a la metodología con el fin de documentar de forma estructurada los motivos de las desviaciones operativas y las acciones correctivas adoptadas, consolidando una bitácora de lecciones aprendidas que mejore continuamente la eficiencia de los programas.","Oficializar y aprobar el Manual del Sistema de Monitoreo del Desempeño Social para estandarizar los criterios de recolección de datos, las responsabilidades de auditoría y la integración del ciclo PDCA con los procesos de calidad corporativos, y coordinar la elaboración del Informe Anual de Evaluación con el progreso de las metas con el fin de consolidar una rendición de cuentas técnica sobre el impacto a largo plazo de las iniciativas, facilitando la toma de decisiones estratégicas por parte de la alta dirección.","Formalizar el Acta de la dirección que evalúa el desempeño social en la revisión estratégica para vincular los aprendizajes comunitarios a los objetivos del negocio, y gestionar la publicación del Informe Anual de Impacto Social (con transparencia en aprendizajes y desafíos), verificado externamente para asegurar un ejercicio genuino de transparencia.","Extender los estándares y herramientas de medición de impacto a los contratistas y proveedores clave para homogeneizar la calidad del monitoreo en la cadena de suministro, e institucionalizar un canal interactivo de datos abiertos que difunda de manera transparente las metodologías, resultados y lecciones aprendidas para inspirar a todo el sector empresarial."],"s":"ODS 8, ODS 11, ODS 17, Sistema B, UE ESRS S3, ISO 26000"}]},{"id":"gobernanza","name":"Gobernanza","dim":"Gobernanza","foco":"Ética, transparencia, gestión de riesgos, diversidad y rendición de cuentas.","ind":[{"id":"gobernanza-1","sub":"","t":"Estructura de gobierno y roles de sostenibilidad","d":"El indicador evalúa la existencia de una estructura de gobernanza sólida que asegure la Integración Estratégica de la sostenibilidad, la transparencia en la toma de decisiones y la rendición de cuentas al más alto nivel jerárquico.","l":["No existen roles ni estructuras que consideren la sostenibilidad en la toma de decisiones.","La empresa integra la sostenibilidad en la agenda directiva o en un comité específico.","La empresa asigna roles formales y responsabilidades de sostenibilidad en todos los niveles de gobierno.","La empresa consolida una estructura de gobernanza con funciones ESG claramente definidas, indicadores y revisión periódica del desempeño."],"a":["Implementar de manera operativa el registro de las Actas de Reunión de la Dirección para asegurar el seguimiento constante de la agenda ASG, y formalizar el nombramiento formal del director sponsor para institucionalizar el liderazgo estratégico de la sostenibilidad.","Actualizar el organigrama formal incorporando las nuevas figuras de liderazgo y comités de sostenibilidad, y oficializar el Manual de Funciones para definir con precisión las responsabilidades y los indicadores de desempeño asignados a cada puesto clave.","Oficializar el Reglamento Interno de la Estructura de Gobernanza ESG para estandarizar las facultades, funciones y KPIs del comité líder, y formalizar las Actas de revisión periódica de la Dirección para documentar la supervisión continua y el ajuste estratégico del desempeño de sostenibilidad.","Extender los criterios éticos, de gobernanza y cumplimiento ESG a proveedores y socios comerciales clave, e institucionalizar canales abiertos de rendición de cuentas con grupos de interés externos para coliderar el impacto ético en el sector."],"s":"ODS 8, ODS 16, Sistema B, UE ESRS G1"},{"id":"gobernanza-2","sub":"","t":"Código de ética y comité de ética","d":"El indicador evalúa la implementación de mecanismos de Autorregulación de la Conducta, como el Código de Ética, lo cual es fundamental para asegurar el comportamiento ético y el combate a la corrupción, conforme a los principios de Paz, Justicia e Instituciones Sólidas.","l":["No existen códigos de ética ni políticas de cumplimiento.","La empresa cuenta con un código de ética difundido a colaboradores y proveedores.","La empresa aplica políticas de cumplimiento con canales de denuncia y control de prácticas.","La empresa consolida una cultura ética sólida, con capacitaciones, auditorías y revisión continua de riesgos."],"a":["Formalizar la aprobación del Código de Ética/Conducta para estandarizar las pautas de comportamiento corporativo, e implementar los mecanismos de difusión y acuse de recibo para asegurar el compromiso vinculante de todos los colaboradores y proveedores estratégicos.","Oficializar las Políticas de Cumplimiento (Anticorrupción, Antifraude) para blindar los procesos críticos de compras y ventas, e instrumentar de manera operativa el Reglamento del Canal de Denuncia para asegurar un protocolo de confidencialidad estricto y seguro para todos los colaboradores.","Ejecutar el Informe Anual de Auditoría de Cumplimiento para verificar de forma interna o externa la efectividad del sistema ético, y oficializar la Política de Revisión Continua de Riesgos de Fraude y Corrupción para institucionalizar la mitigación proactiva de riesgos y la rendición de cuentas de la Dirección.","Extender las políticas de cumplimiento y los lineamientos del Código de Ética a todos los proveedores y socios de la cadena de suministro, e institucionalizar alianzas estratégicas con la sociedad civil u organismos del sector para coliderar la promoción de la integridad y la transparencia."],"s":"ODS 16, Sistema B, UE ESRS G1"},{"id":"gobernanza-3","sub":"","t":"Transparencia y rendición de cuentas","d":"El indicador evalúa la adhesión de la empresa al principio de accountability , es decir, la obligación de informar y responsabilizarse de los impactos que produce, garantizando la transparencia y precisión de la información difundida.","l":["No se publica información sobre la gestión de la empresa.","La empresa publica datos clave de desempeño y resultados relevantes a sus partes interesadas.","La empresa implementa mecanismos de rendición de cuentas con validación interna y externa.","La empresa mantiene una política de transparencia integral, con reportes auditados y accesibles al público."],"a":["Consolidar el registro de datos clave publicados para documentar públicamente métricas fundamentales de la gestión (como consumo energético o capacitación), y oficializar la política de comunicación externa básica para estandarizar los canales de transparencia y designar un vocero institucional que atienda consultas específicas.","Oficializar el Manual del Mecanismo de Rendición de Cuentas para estandarizar los procesos de los comités de gobernanza y auditoría, y publicar el Informe Anual de Sostenibilidad respaldado por una declaración de validación que asegure la consistencia de los datos ante los grupos de interés.","Publicar la Política de Transparencia Integral para institucionalizar el acceso universal a la información corporativa a través de múltiples formatos, y gestionar la obtención del Certificado de Auditoría Externa del Reporte de Sostenibilidad para validar con independencia y la máxima fiabilidad los datos financieros y de sostenibilidad.","Extender las exigencias de reporte, transparencia y control ASG a proveedores y socios de la cadena de suministro, e institucionalizar alianzas con organismos sectoriales o de la sociedad civil para coliderar iniciativas de rendición de cuentas abierta y datos públicos."],"s":"ODS 12, ODS 16, Sistema B, UE ESRS G1"},{"id":"gobernanza-4","sub":"","t":"Derechos humanos y prácticas éticas","d":"El indicador se orienta a evaluar el compromiso de la empresa con el respeto de los Derechos Humanos en toda su esfera de influencia, incluyendo sus operaciones y su cadena de valor, lo cual es fundamental para una gestión que evite la complicidad en situaciones de riesgo y promueva un comportamiento ético.","l":["No se consideran los derechos humanos en las operaciones.","La empresa comunica su compromiso ético a empleados, proveedores y aliados estratégicos.","La empresa aplica políticas de derechos humanos con mecanismos de prevención, denuncia y respuesta.","La empresa gestiona los derechos humanos de forma proactiva, con auditorías, capacitación y monitoreo en toda su cadena de valor."],"a":["Redactar y oficializar el Documento del Código de Ética/Conducta para unificar las pautas de integridad del negocio, e instrumentar de manera operativa el registro de la comunicación formal a los stakeholders clave para asegurar la trazabilidad del proceso de inducción, la alineación cultural de los equipos y la aceptación explícita de estos compromisos por parte de la cadena de valor.","Formalizar y aprobar la Política de Derechos Humanos (que integre con claridad los mecanismos institucionales de prevención y respuesta) y estructurar de manera operativa el Reglamento del Mecanismo de Denuncia para normar la gobernanza de la línea ética.","Coordinar la ejecución del Informe de Auditoría Externa de Derechos Humanos para validar de forma independiente el cumplimiento ético en los nodos críticos, e instrumentar la Matriz de Trazabilidad Social de Proveedores para asegurar el monitoreo continuo y el control del desempeño social en toda la cadena de suministro.","Extender la exigencia de las políticas de debida diligencia y auditorías éticas a los subcontratistas críticos para mitigar riesgos en los nodos más profundos de la cadena de valor, e institucionalizar un panel digital de datos abiertos sobre el desempeño social de la empresa, compartiendo de manera transparente las metodologías de resolución de quejas y lecciones aprendidas para elevar los estándares éticos de toda la industria."],"s":"ODS 5, ODS 8, ODS 10, Sistema B, UE ESRS G1"},{"id":"gobernanza-5","sub":"","t":"Lucha contra la corrupción y soborno","d":"El indicador evalúa el compromiso de la empresa con las Prácticas Anticorrupción, siendo esencial para el comportamiento ético de la organización y la Paz, Justicia e Instituciones Sólidas (ODS 16), ya que la corrupción socava la eficacia y la reputación de la empresa.","l":["No hay controles específicos para prevenir la corrupción.","La empresa comunica sus compromisos éticos y brinda capacitación en integridad.","La empresa implementa controles y canales de denuncia para prevenir actos de corrupción.","La empresa consolida un programa de integridad con auditorías independientes y monitoreo continuo de cumplimiento."],"a":["Oficializar la Política Anticorrupción formal (aprobada) para establecer institucionalmente las pautas éticas de tolerancia cero frente a conductas delictivas en las operaciones y la cadena de valor, e implementar de manera operativa el registro de la capacitación en integridad con firmas de los participantes para asegurar el entrenamiento mandatorio y auditable de todo el personal.","Implementar y difundir el Reglamento del Canal de Denuncia (con protocolo de protección) para garantizar un entorno seguro, anónimo y confiable para el reporte de irregularidades, y estructurar de manera operativa el Informe de Mapeo de Riesgos de Corrupción para diagnosticar con precisión las áreas más vulnerables de la organización y aplicar salvaguardas preventivas.","Gestionar la obtención del Certificado o Informe de Auditoría Independiente del Programa de Integridad para convalidar con máxima rigurosidad externa la efectividad de los controles y la línea ética, y formalizar las Actas de revisión de la Dirección sobre el desempeño ético para evaluar periódicamente los indicadores del sistema, mitigar riesgos emergentes y asegurar la mejora continua.","Extender el uso de plataformas digitales de gestión, los requisitos de trazabilidad y las metodologías de optimización administrativa a los proveedores clave de la cadena de suministro, e institucionalizar alianzas estratégicas con firmas tecnológicas o expertos en innovación digital para co-diseñar herramientas de gobernanza ágil y anticipar las demandas de transparencia del entorno."],"s":"ODS 16, Sistema B, UE ESRS G1, ISO 37001"},{"id":"gobernanza-6","sub":"","t":"Cumplimiento normativo y regulatorio","d":"El indicador evalúa el compromiso de la empresa con la legalidad y el marco regulatorio, siendo fundamental para la Gestión de Riesgos y la demostración de una conducta ética que asegura el respeto por el estado de derecho.","l":["No hay mecanismos para asegurar el cumplimiento de leyes y normativas.","La empresa actualiza periódicamente su marco regulatorio y capacita a su personal en normativas clave.","La empresa implementa procedimientos documentados de cumplimiento normativo.","La empresa gestiona un sistema formal de cumplimiento, con auditorías externas y mejora continua."],"a":["Diseñar y estructurar la Matriz de Requisitos Legales para centralizar, monitorear y actualizar la legislación vigente aplicable al negocio, e implementar de manera operativa los registros de asistencia a las capacitaciones sobre normativas clave para asegurar el entrenamiento continuo del personal estratégico en la prevención de riesgos legales.","Oficializar el Manual de Procedimientos Documentados de Cumplimiento Normativo para estandarizar las metodologías de control y las responsabilidades operativas en las áreas de mayor riesgo de la empresa, y estructurar los informes de las auditorías internas realizadas para documentar las evaluaciones periódicas de efectividad y garantizar la aplicación de acciones correctivas oportunas.","Gestionar la obtención del Certificado o Informe de Auditoría Externa de Cumplimiento para validar de forma independiente y con rigurosidad las obligaciones regulatorias de la empresa, y estructurar el Plan de Mejora Continua del sistema de Compliance para asegurar la resiliencia operativa y la mitigación proactiva de riesgos mediante la vinculación de incentivos ejecutivos.","Extender las matrices de requisitos legales y los protocolos de cumplimiento normativo (laboral, fiscal, ambiental y sectorial) a todos los proveedores y socios estratégicos de la cadena de suministro, e institucionalizar alianzas con cámaras gremiales, expertos o autoridades regulatorias para co-diseñar esquemas sectoriales de actualización normativa proactiva y mitigación de riesgos legales comunes."],"s":"ODS 8, ODS 16, Sistema B, UE ESRS G1, ISO 37301"},{"id":"gobernanza-7","sub":"","t":"Gestión de riesgos corporativos","d":"El indicador evalúa la implementación de un sistema integral de gestión de riesgos, el cual es esencial para asegurar la resiliencia y continuidad del negocio, y para la Integración Estratégica de la sostenibilidad, identificando riesgos y oportunidades ESG como elementos clave en la planificación.","l":["No se identifican ni gestionan riesgos estratégicos o de cumplimiento.","La empresa implementa mecanismos para monitorear y mitigar riesgos financieros y operativos.","La empresa gestiona los riesgos estratégicos, reputacionales y ESG dentro de un sistema integral.","La empresa revisa y actualiza periódicamente su matriz de riesgos, asegurando la resiliencia y continuidad del negocio."],"a":["Diseñar y formalizar el Manual del Procedimiento de Monitoreo de Riesgos Operativos para estandarizar el reporte y análisis de incidentes, e instrumentar de manera operativa la Matriz de Riesgos Financieros y Operacionales para evaluar, mitigar y dar seguimiento proactivo a los riesgos clave del negocio.","Diseñar e instrumentar de manera operativa la Matriz Integral de Riesgos (que incluye riesgos ESG) para consolidar el mapeo de amenazas tradicionales y de sostenibilidad, y formalizar las Actas del Comité de Gobernanza para documentar la revisión trimestral, el seguimiento y la mitigación proactiva de estos riesgos.","Estructurar el Informe de Revisión Anual de la Matriz de Riesgos para asegurar la actualización dinámica de las amenazas corporativas y fundamentar las decisiones estratégicas de la Alta Dirección, y oficializar el Plan de Continuidad del Negocio (PCN) formalmente aprobado para institucionalizar la resiliencia operativa ante contingencias ambientales o sociales de alto impacto.","Extender las matrices de riesgo, los protocolos de mitigación y los planes de continuidad del negocio (PCN) a los proveedores clave y socios comerciales de la cadena de suministro, e institucionalizar alianzas estratégicas con expertos, gremios u organismos tecnológicos para co-diseñar soluciones de resiliencia y adaptación climática ante riesgos emergentes."],"s":"ODS 8, ODS 12, Sistema B, UE ESRS G1, ISO 31000"},{"id":"gobernanza-8","sub":"","t":"Diversidad en los órganos de decisión","d":"El indicador evalúa la Integración de la Diversidad en los órganos de gobierno, como el Directorio o el Consejo Consultivo, lo cual es fundamental para asegurar la equidad, la transparencia y una toma de decisiones que refleje la complejidad de la sociedad.","l":["No se consideran criterios de diversidad en la composición de la dirección.","La empresa impulsa la representación equilibrada de género y perfiles en roles de liderazgo.","La empresa implementa políticas de diversidad e inclusión en sus órganos de decisión.","La empresa consolida la diversidad como parte estructural de su gobernanza, reportando avances y resultados públicamente."],"a":["Diseñar la Matriz de Composición del Liderazgo para diagnosticar brechas por género y edad, y formalizar el Acta de la Dirección que institucionaliza el compromiso corporativo con la inclusión y la mitigación de sesgos.","Oficializar la Política Formal de Diversidad e Inclusión para Órganos de Decisión para estandarizar los criterios de selección inclusivos, y actualizar el Reglamento del Consejo que incorpora los criterios de diversidad para institucionalizar la equidad en la alta dirección.","Oficializar la Política Formal de Diversidad e Inclusión para Órganos de Decisión para estandarizar los criterios de selección inclusivos, y actualizar el Reglamento del Consejo que incorpora los criterios de diversidad para institucionalizar la equidad en la alta dirección.","ublicar la Matriz de Composición de la Dirección para transparentar las métricas de representación actuales, y estructurar el Informe de Desempeño de Gobernanza para evidenciar el progreso real hacia la equidad ante el público general."],"s":"ODS 5, ODS 10, Sistema B, UE ESRS G1"},{"id":"gobernanza-9","sub":"","t":"Relación con grupos de interés y toma de decisiones","d":"El indicador se centra en la Gestión de Partes Interesadas y la Transparencia, evaluando el grado en que la empresa establece un diálogo activo que influya en la toma de decisiones estratégicas, un requisito clave para la corresponsabilidad y la mejora continua de su conducta.","l":["No se consulta a partes interesadas en las decisiones relevantes.","La empresa incorpora la opinión de grupos de interés en decisiones específicas o proyectos relevantes.","La empresa establece procesos formales de diálogo y consulta periódica con sus partes interesadas.","La empresa consolida la participación de sus grupos de interés en la toma de decisiones estratégicas, garantizando transparencia y corresponsabilidad."],"a":["Diseñar e instrumentar de manera operativa el registro de la metodología de consulta aplicada al proyecto para estandarizar los mecanismos de escucha y captación de expectativas (como encuestas o focus groups), y formalizar las actas de la reunión de la Dirección donde se demuestra la consideración de las opiniones para asegurar la trazabilidad e integración del feedback externo en las decisiones de alto impacto.","Oficializar el Manual del Proceso Formal de Diálogo y Consulta para estandarizar las metodologías de vinculación y los mecanismos de respuesta de la organización, y estructurar de manera operativa el Informe de Consulta Periódica documentado para transparentar ante los grupos de interés las expectativas identificadas y las acciones estratégicas derivadas de este ejercicio de escucha activa.","Aprobar el Reglamento del Comité Consultivo (con participación externa) para institucionalizar la voz de los aliados en la gobernanza, y estructurar el Informe Anual de Gobernanza para detallar con transparencia la influencia real de las consultas en la estrategia corporativa.","Extender los procesos de consulta periódica y los canales de retroalimentación transparente a los proveedores y socios comerciales de la cadena de suministro para asegurar una gobernanza inclusiva, e institucionalizar alianzas intersectoriales de largo plazo con comunidades, academia u organismos civiles para co-diseñar soluciones de impacto colectivo que respondan a las expectativas de los grupos de interés."],"s":"ODS 16, ODS 17, Sistema B, UE ESRS G1"},{"id":"gobernanza-10","sub":"","t":"Innovación y mejora de la gobernanza","d":"El indicador evalúa la capacidad de la empresa para aplicar la innovación y la mejora continua en sus estructuras y procesos de gobierno corporativo, asegurando la resiliencia y la Integración Estratégica de la sostenibilidad en la toma de decisiones.","l":["No se revisan ni actualizan las prácticas de gestión y gobierno.","La empresa incorpora herramientas digitales o metodologías para optimizar su gobernanza.","La empresa aplica procesos de mejora continua en su gestión institucional y toma de decisiones.","La empresa promueve la innovación en la gobernanza mediante evaluación de desempeño, transparencia digital y participación colaborativa."],"a":["Instrumentar el registro de la implementación de la nueva herramienta digital para la gestión institucional para automatizar y modernizar los procesos de supervisión del negocio, y oficializar el procedimiento de documentación optimizado para asegurar el control, la trazabilidad y el resguardo de la información clave de la gobernanza.","Oficializar el Manual del Proceso de Mejora Continua Institucional para estandarizar los ciclos de retroalimentación de los comités y la revisión de estatutos, e instrumentar de manera operativa el registro de las actualizaciones implementadas en los reglamentos internos para garantizar la trazabilidad de las mejores prácticas adoptadas y la evolución del gobierno corporativo.","Estructurar el Informe de Evaluación Anual del Desempeño de la Gobernanza para auditar y perfeccionar las prácticas de liderazgo interno de manera participativa con los comités clave, e instrumentar la publicación de la información de gobernanza en formato digital accesible para consolidar la transparencia institucional y la rendición de cuentas ante todos los grupos de interés.","Extender los criterios de evaluación de desempeño institucional, los compromisos éticos y las políticas de transparencia digital a los principales proveedores y socios de la cadena de suministro, e institucionalizar alianzas estratégicas con redes de liderazgo sostenible, universidades u organismos de gobernanza global para co-diseñar estructuras corporativas resilientes que aceleren el impacto social y ambiental."],"s":"ODS 9, ODS 16, Sistema B, UE ESRS G1"},{"id":"gobernanza-11","sub":"","t":"Relaciones laborales y libertad sindical","d":"El indicador evalúa el compromiso formal de la organización con el respeto a la libertad de asociación y el derecho a la negociación colectiva, garantizando canales institucionales y proactivos de diálogo con sindicatos o representantes de los trabajadores para la mejora continua de las condiciones laborales.","l":["La empresa no reconoce formalmente a sindicatos ni cuenta con canales de diálogo institucionalizados con representantes de los trabajadores.","La empresa respeta la libertad de asociación exigida por ley, pero el diálogo con sindicatos o delegados es puramente reactivo ante conflictos.","Existen canales formales y reuniones periódicas con los representantes sindicales, documentando acuerdos y trabajando proactivamente en mejoras laborales.","La relación sindical es estratégica y colaborativa; los representantes integran comités internos y se desarrollan iniciativas conjuntas que superan los convenios básicos."],"a":["Redactar una política corporativa explícita de respeto a la libertad de asociación. Identificar y mapear a los delegados o entidades sindicales correspondientes al rubro del negocio.","Formalizar una mesa de diálogo con reuniones periódicas fijas con los representantes sindicales. Documentar mediante minutas todos los requerimientos y compromisos asumidos en las reuniones.","Integrar a los delegados sindicales en comités internos clave (ej. Comité de Salud y Seguridad Ocupacional). Diseñar e implementar beneficios laborales que superen las exigencias del convenio colectivo de base.","Desarrollar programas a largo plazo de bienestar y capacitación financiados o gestionados junto al sindicato. Auditar anualmente la calidad de la relación sindical y la percepción de representatividad por parte del staff."],"s":"ODS 8, ODS 16, Sistema B, UE ESRS S1, ISO 26000"},{"id":"gobernanza-12","sub":"","t":"Gestión de la información y seguridad de datos","d":"El indicador evalúa el compromiso de la empresa con la seguridad de la información y la protección de datos de todas sus partes interesadas, lo cual es fundamental para el Gerenciamiento de Riesgos y la demostración de una conducta ética y transparente en la era digital.","l":["No se gestionan los riesgos relacionados con la información.","La empresa implementa políticas y controles básicos de ciberseguridad.","La empresa aplica estándares internacionales de seguridad de datos, con monitoreo y respuesta ante incidentes.","La empresa opera un sistema integral de gestión de información, con certificaciones y mejora continua en ciberseguridad y privacidad."],"a":["Diseñar y oficializar el Documento de Políticas de Seguridad de la Información para estandarizar los lineamientos técnicos de protección de datos y el uso seguro de activos, e implementar de manera operativa el registro de la capacitación en ciberseguridad para asegurar y documentar el entrenamiento obligatorio de los colaboradores frente a los riesgos cibernéticos.","Diseñar y oficializar el Plan de Respuesta a Incidentes (PRI) documentado para estandarizar los protocolos de mitigación, comunicación y recuperación ante brechas de seguridad, e instrumentar de manera operativa los registros de los simulacros de respuesta a incidentes para evaluar periódicamente la efectividad de las defensas y garantizar la preparación técnica del equipo.","Gestionar y mantener el Certificado ISO/IEC 27001 vigente para convalidar con independencia y rigor internacional las defensas digitales de la organización, y estructurar las Actas de revisión por la Dirección que evalúa el desempeño del SGSI para institucionalizar la gobernanza sobre los riesgos de ciberseguridad e integrarlos formalmente en la planificación estratégica corporativa.","Extender los requisitos de seguridad de la información, las evaluaciones de vulnerabilidad y las políticas de privacidad de datos a todos los proveedores y socios comerciales de la cadena de suministro, e institucionalizar alianzas estratégicas con organismos de ciberseguridad, centros de respuesta a incidentes (CSIRT) o expertos tecnológicos para co-diseñar soluciones de protección avanzada y promover una cultura de confianza colectiva."],"s":"ODS 9, ODS 16, Sistema B, UE ESRS G1, ISO 27001"}]},{"id":"cliente","name":"Experiencia con el cliente","dim":"Gobernanza","foco":"Calidad, transparencia, innovación centrada en el usuario, comunicación responsable.","ind":[{"id":"cliente-1","sub":"","t":"Enfoque en el cliente y escucha activa","d":"El indicador evalúa el compromiso de la empresa con la calidad de la atención y la escucha activa del consumidor, lo cual es fundamental para el perfeccionamiento continuo de los productos y servicios, un aspecto clave de la dimensión social del consumo.","l":["No se realizan acciones para conocer la opinión de los clientes.","La empresa recopila y analiza comentarios o sugerencias de clientes a través de diferentes canales.","La empresa cuenta con mecanismos estructurados de escucha activa (encuestas, entrevistas, métricas de servicio).","La empresa gestiona la experiencia del cliente de forma integral, integrando la voz del usuario en la innovación y mejora continua."],"a":["Implementar el registro de comentarios y quejas clasificados para asegurar la correcta categorización y centralización del feedback recibido, y coordinar la elaboración del informe simple de análisis de feedback enfocado en las 5 principales quejas o sugerencias del mes para activar soluciones rápidas y visibilizar las prioridades del cliente ante el equipo.","Oficializar el Manual de Procedimiento de Escucha Activa para estandarizar la metodología de las encuestas y garantizar la consistencia en la captura de datos, e instrumentar de manera operativa el Tablero de Control con el seguimiento de las métricas de servicio (NPS, CSAT) para monitorear la satisfacción en tiempo real y guiar la toma de decisiones basada en evidencia.","Sistematizar la documentación que demuestra la integración del feedback en los procesos de I+D para asegurar que la voz del cliente guíe el desarrollo de nuevos productos, y coordinar la publicación del Informe Anual de Experiencia del Cliente (con análisis de resultados) para transparentar el impacto real de la retroalimentación en la optimización del servicio.","Extender las métricas y estándares de calidad de servicio hacia los distribuidores y socios comerciales clave para homogeneizar la experiencia del usuario final, e institucionalizar laboratorios de innovación abierta con clientes y aliados del ecosistema para co diseñar soluciones comerciales con impacto positivo y sostenible."],"s":"ODS 8, ODS 9, Sistema B, UE ESRS S4, ISO 9001"},{"id":"cliente-2","sub":"","t":"Calidad de productos y servicios","d":"El indicador evalúa la implementación de sistemas para asegurar la calidad, confiabilidad y seguridad de los productos y servicios ofrecidos, lo cual es fundamental para el respeto de los derechos del consumidor y la generación de valor económico.","l":["No se gestionan estándares de calidad ni se documentan procesos.","La empresa monitorea la calidad mediante controles regulares y retroalimentación del cliente.","La empresa gestiona la calidad bajo procesos documentados con objetivos y responsables definidos.","La empresa mantiene un sistema de gestión de calidad certificado o equivalente, basado en mejora continua y satisfacción del cliente."],"a":["Instrumentar de manera operativa el registro de Controles de Calidad aplicados para garantizar el cumplimiento de los estándares en el proceso productivo, y coordinar la elaboración del informe de No Conformidades (con causa y corrección simple) con periodicidad semanal para corregir desvíos rápidamente y optimizar el rendimiento en planta.","oficializar el Manual de Calidad interno y el Tablero de Control con los KPIs de calidad para estandarizar las operaciones y monitorear el rendimiento en tiempo real, e instrumentar de manera operativa el seguimiento de los Planes de Acción Correctivos y Preventivos (ACPs) para garantizar la mitigación efectiva y el cierre de las no conformidades detectadas.","Gestionar la obtención y vigencia del Certificado ISO 9001 para validar internacionalmente los estándares de la organización, y coordinar la ejecución de los Informes de Auditoría Interna/Externa del SGC para evaluar de manera sistemática la efectividad del sistema, resolver desvíos y asegurar la máxima satisfacción del cliente.","Extender las exigencias de homologación y estándares de calidad (basados en ISO 9001) a los proveedores críticos de la cadena de valor para asegurar la excelencia en el origen de los insumos, e institucionalizar comités de co-innovación con aliados estratégicos para el ecodiseño y la optimización de procesos que minimicen los defectos y maximicen la eficiencia del producto."],"s":"ODS 8, ODS 12, Sistema B, UE ESRS S4, ISO 9001"},{"id":"cliente-3","sub":"","t":"Seguridad, salud e inocuidad del producto/servicio","d":"El indicador evalúa el cumplimiento de normativas y la aplicación de los más altos estándares de calidad para garantizar la seguridad física, la salud y la inocuidad de los productos entregados al cliente final.","l":["La empresa cumple con los requisitos legales mínimos obligatorios, pero no cuenta con procesos preventivos formales ni certificaciones de seguridad o inocuidad del producto.","Existen controles internos de calidad con protocolos documentados (ej. Buenas Prácticas de Manufactura) para prevenir y mitigar riesgos a la salud del consumidor.","La empresa cuenta con certificaciones reconocidas (ej. HACCP, normas de seguridad de producto) y realiza auditorías periódicas de inocuidad y seguridad en su línea de producción.","Se aplican los estándares internacionales más exigentes, integrando tecnología para la trazabilidad total del producto y la mejora continua preventiva para maximizar la protección del cliente."],"a":["Identificar y documentar todas las normativas legales obligatorias de salud e inocuidad aplicables al rubro. Establecer controles básicos de seguridad antes del empaquetado o entrega del producto.","Documentar manuales internos de Buenas Prácticas de Manufactura (BPM) o seguridad del producto. Capacitar periódicamente al personal operativo en el manejo seguro e inocuo de los materiales.","Certificar los procesos de seguridad bajo normativas internacionales reconocidas en la industria (como HACCP o ISO 22000). Realizar auditorías internas y externas para verificar el cumplimiento estricto del protocolo de seguridad.","Implementar tecnologías de trazabilidad (ej. códigos QR) para transparentar el origen y seguridad del producto al cliente final. Integrar al consumidor en programas de comunicación sobre el uso seguro, almacenamiento y descarte saludable de los productos."],"s":"ODS 3, ODS 12, Sistema B, UE ESRS S4, ISO 22000"},{"id":"cliente-4","sub":"","t":"Comunicación transparente y veraz","d":"El indicador evalúa el cumplimiento de la empresa con la dimensión social del consumo, asegurando que la comunicación comercial y la publicidad sean éticas, transparentes y veraces, evitando contenidos engañosos o ambiguos que induzcan a error.","l":["La información al cliente es incompleta o poco clara.","La empresa garantiza que toda la información al cliente sea precisa, actualizada y comprensible.","La empresa revisa y valida periódicamente los mensajes comerciales para evitar ambigüedades o declaraciones no comprobables.","La empresa promueve una comunicación transparente y responsable, basada en evidencia verificable y alineada a estándares internacionales."],"a":["Implementar el procedimiento de revisión y validación de la información al cliente para asegurar la precisión y actualización de los datos comerciales antes de su difusión, y coordinar el registro de las auditorías internas sobre la precisión de los datos para identificar y corregir proactivamente inconsistencias en los puntos de contacto.","Oficializar el Manual de Validación de Mensajes Comerciales (con criterios anti-ambigüedad) para establecer los filtros éticos obligatorios en el diseño de campañas, e instrumentar de manera operativa el registro de las validaciones periódicas realizadas para auditar el cumplimiento de los mensajes y garantizar que cada afirmación de sostenibilidad esté debidamente documentada.","Gestionar la publicación del Informe Anual de la Política de Comunicación Responsable para transparentar el compromiso ético ante los stakeholders, y coordinar la obtención del certificado o registro de la auditoría sobre el cumplimiento de los principios de transparencia para validar externamente la rigurosidad y veracidad de las campañas comerciales.","Extender los criterios y filtros del Manual de Validación de Mensajes Comerciales a las agencias de publicidad externas y socios comerciales para garantizar una narrativa unificada y libre de greenwashing, e impulsar iniciativas multisectoriales de educación al consumidor en alianza con ONGs y academia para elevar el estándar de transparencia en todo el mercado."],"s":"ODS 12, ODS 16, Sistema B, UE ESRS S4"},{"id":"cliente-5","sub":"","t":"Diseño sostenible y accesible de productos/servicios","d":"El indicador evalúa el compromiso de la empresa con la innovación centrada en el usuario y el diseño responsable, buscando que los productos y servicios sean seguros, tengan un impacto ambiental optimizado y garanticen la accesibilidad y la usabilidad para todos los segmentos de la población, incluyendo aquellos en desventaja social.","l":["No se consideran criterios de sostenibilidad o accesibilidad.","La empresa analiza el ciclo de vida de sus productos e implementa mejoras en materiales o procesos.","La empresa aplica metodologías de ecodiseño o diseño centrado en el usuario para optimizar impacto y usabilidad.","La empresa integra la sostenibilidad y accesibilidad como principios permanentes de innovación, medidos por desempeño y satisfacción."],"a":["Instrumentar de manera operativa el Informe del ACV simplificado para mapear con precisión la huella ambiental e identificar los puntos críticos del producto, y consolidar el registro de las primeras mejoras implementadas en materiales con el fin de documentar los avances iniciales en reducción de peso o eficiencia energética en la producción.","Oficializar el Manual de Metodología de Ecodiseño para estandarizar los criterios de sostenibilidad, desmontabilidad y accesibilidad desde las etapas iniciales de desarrollo, e instrumentar de manera operativa el registro de pruebas de usabilidad y accesibilidad con grupos en desventaja para validar empíricamente que los productos y servicios eliminen barreras y respondan a un diseño verdaderamente inclusivo.","Gestionar la elaboración del Informe Anual de Medición de Desempeño del Diseño para consolidar de forma transparente las métricas de impacto operativo y usabilidad inclusiva, y coordinar la obtención del Certificado o Evaluación Externa de la accesibilidad o diseño sostenible con el fin de avalar internacionalmente la responsabilidad y calidad de las innovaciones desarrolladas.","Extender las directrices de ecodiseño y abastecimiento sostenible a los proveedores de la cadena de suministro para mitigar el impacto ambiental desde el origen de los materiales, e institucionalizar laboratorios de co-creación con aliados estratégicos y académicos para el desarrollo continuo de soluciones innovadoras y de accesibilidad universal"],"s":"ODS 9, ODS 10, ODS 12, Sistema B, UE ESRS S4"},{"id":"cliente-6","sub":"","t":"Privacidad y protección de datos del cliente","d":"El indicador evalúa el compromiso de la empresa con la seguridad de la información y el respeto a la privacidad de los datos de los clientes, lo cual es fundamental para el respeto de los derechos del consumidor y la construcción de la confianza.","l":["No existen políticas ni medidas para proteger los datos de los clientes.","La empresa aplica políticas y procedimientos básicos para la protección de datos personales.","La empresa mantiene protocolos de seguridad y respuesta ante incidentes, conforme a la normativa vigente.","La empresa gestiona la privacidad bajo estándares internacionales, con auditorías, capacitación y mejora continua."],"a":["Publicar formalmente la Política de Privacidad y Protección de Datos para asegurar el cumplimiento normativo y la transparencia ante los usuarios, e instrumentar el Registro del Inventario de Datos Personales para clasificar, mapear y controlar de manera segura los flujos de información crítica dentro de la organización.","Oficializar el Plan de Respuesta a Incidentes (PRI) documentado para asignar roles claros y establecer los procedimientos de contingencia ante incidentes de datos, e instrumentar de manera operativa el registro de los simulacros de respuesta para evaluar la efectividad real de los protocolos técnicos y mitigar vulnerabilidades de forma oportuna.","Gestionar la obtención y vigencia del Certificado ISO 27001 o, en su defecto, coordinar la emisión del Informe de Auditoría Externa de Seguridad de la Información para respaldar de manera oficial la integridad de los activos de datos, instrumentando a su vez auditorías independientes periódicas y programas de concientización interna para mantener actualizados los escudos técnicos y de comportamiento en la organización.","Extender las exigencias de cumplimiento normativo y estándares de seguridad informática (alineados con ISO 27001) a los proveedores, distribuidores y terceros que integran la cadena de suministro para mitigar de extremo a extremo los riesgos de brechas en la red corporativa, e institucionalizar comités de innovación abierta en alianza con centros tecnológicos y expertos en derechos digitales para co diseñar soluciones avanzadas de privacidad desde el diseño (privacy by design)."],"s":"ODS 9, ODS 16, Sistema B, UE ESRS S4, ISO 27001"},{"id":"cliente-7","sub":"","t":"Atención postventa y gestión de reclamos","d":"El indicador evalúa la existencia de un servicio de Atención al Consumidor (SAC) o mecanismos de postventa, cuya función es recibir, registrar y solucionar las demandas y los reclamos de los clientes de manera ética y eficiente, lo cual es fundamental para la confiabilidad del producto.","l":["No hay procesos formales de atención postventa o reclamos.","La empresa gestiona los reclamos mediante un procedimiento formal con registro y seguimiento.","La empresa analiza los reclamos para identificar causas y oportunidades de mejora.","La empresa gestiona la postventa de forma integral, con indicadores de satisfacción, resolución y tiempos de respuesta."],"a":["Oficializar el Manual del Procedimiento de Gestión de Reclamos para estandarizar los protocolos de resolución y garantizar la consistencia en el trato al usuario, e instrumentar de manera operativa el Registro de Reclamos a través de una herramienta digital que permita monitorear el estado de cada caso (pendiente, en curso, resuelto) y asegurar la trazabilidad completa del proceso de solución.","Instrumentar de manera operativa el Informe de Análisis de Causas Raíz de Reclamos para diagnosticar el origen real de las fallas comerciales u operativas, y consolidar el registro de los Planes de Acción Correctiva y Preventiva (ACPs) para asegurar que las áreas responsables ejecuten y cierran con éxito las modificaciones estructurales que eviten la recurrencia de los problemas.","Instrumentar de manera operativa el Tablero de Control con el seguimiento continuo de los KPIs de postventa para monitorear en tiempo real la eficiencia del equipo y optimizar los tiempos de resolución, y coordinar la elaboración del Informe Anual de Satisfacción post-reclamo con el fin de auditar la percepción del usuario, transparentar el desempeño ante los stakeholders y asegurar la mejora continua del servicio.","Extender las políticas, herramientas de registro y estándares de calidad del servicio postventa a los socios comerciales y terceros que interactúan con el cliente final para garantizar una experiencia de atención homogénea, justa y excelente en toda la red, e institucionalizar comités de co-innovación basados en la analítica avanzada de reclamos para rediseñar productos o servicios de manera preventiva junto a aliados clave del mercado."],"s":"ODS 8, ODS 12, ODS 16, Sistema B, UE ESRS S4, ISO 9001, ISO 10002"},{"id":"cliente-8","sub":"","t":"Medición de satisfacción (NPS) y lealtad","d":"El indicador evalúa la Gestión de la Experiencia del Cliente a través de la medición sistemática de la satisfacción y la lealtad, lo cual es un insumo estratégico para la innovación y la mejora continua de la calidad de los productos y servicios.","l":["No se mide la satisfacción de los clientes.","La empresa mide la satisfacción del cliente mediante encuestas o herramientas específicas.","La empresa analiza los resultados y define planes de acción para mejorar la experiencia del cliente.","La empresa gestiona la satisfacción y lealtad de forma continua, integrándose a sus indicadores estratégicos y de desempeño."],"a":["Oficializar el Manual de Aplicación de la Métrica (NPS o CSAT) para definir formalmente los canales, preguntas y metodologías de recolección en cada punto de interacción, e instrumentar de manera operativa el registro de las primeras mediciones realizadas con el fin de establecer la línea base de satisfacción y transformar los comentarios del cliente en insumos directos para la toma de decisiones del negocio.","Instrumentar de manera operativa el Informe de Análisis Causal de la Satisfacción para mapear y diagnosticar los factores que impactan negativamente en la experiencia del usuario, y consolidar el registro de los Planes de Acción Correctiva y Preventiva (ACPs) derivados con el fin de asegurar que los equipos responsables ejecuten modificaciones definitivas que eliminen las fricciones del servicio o producto.","Instrumentar de manera operativa el Tablero de Control Estratégico con los KPIs de CX para unificar el monitoreo de la satisfacción y las tasas de retención con los macro objetivos del negocio, y estructurar el Acta de revisión por la dirección de los indicadores de lealtad con el fin de formalizar el análisis periódico del comité ejecutivo, garantizando que la voz del cliente guíe las decisiones de inversión y la mejora continua de la estrategia de sostenibilidad.","Extender las métricas, herramientas de evaluación y políticas de experiencia del cliente a los socios estratégicos y canales de distribución externos para asegurar un viaje del usuario (customer journey) homogéneo, ético y de alta satisfacción en todo el ecosistema de la marca, e institucionalizar laboratorios de co-creación e innovación abierta en alianza con defensores del consumidor y expertos del sector para anticipar necesidades del mercado y elevar el estándar de servicio de la industria."],"s":"ODS 8, ODS 9, Sistema B, UE ESRS S4, ISO 9001"},{"id":"cliente-9","sub":"","t":"Accesibilidad e inclusión del cliente","d":"El indicador evalúa el compromiso de la empresa con la igualdad de trato y la inclusión, asegurando que sus productos, servicios y canales de atención sean accesibles y consideren las necesidades de clientes con diversas capacidades o que pertenezcan a segmentos en desventaja social.","l":["No se consideran las necesidades de clientes diversos o con discapacidad.","La empresa adapta sus instalaciones, productos o canales para mejorar la accesibilidad de personas con diferentes capacidades.","La empresa aplica políticas de inclusión del cliente, asegurando igualdad de acceso y atención personalizada.","La empresa consolida un modelo de atención inclusivo, con estándares de accesibilidad auditados y comunicación adaptada a diversos públicos."],"a":["Instrumentar de manera operativa el Informe de Auditoría de Accesibilidad para mapear con precisión las limitaciones de infraestructura y del entorno digital de la organización, y consolidar el registro de las adaptaciones físicas/digitales realizadas con el fin de documentar la remoción de barreras y garantizar un acceso equitativo, autónomo y digno para todos los usuarios.","Oficializar la Política de Inclusión del Cliente formal para institucionalizar el compromiso corporativo con la equidad, la diversidad y la no discriminación en todos los niveles del negocio, e instrumentar de manera operativa el Manual de Protocolos de Atención Personalizada con el fin de estandarizar las pautas de interacción, capacitar al personal de atención directa y garantizar respuestas comerciales empáticas y técnicamente adaptadas a las necesidades de cada perfil.","Gestionar de manera estratégica la obtención del Certificado o Informe de Auditoría Externa de Accesibilidad para avalar de forma independiente la eliminación de barreras de entorno, web y de trato, y coordinar de forma periódica la publicación de los indicadores de satisfacción de clientes diversos con el fin de transparentar las métricas de inclusión, rendir cuentas ante el mercado e integrar activamente el feedback de los usuarios en la mejora continua del modelo.","Extender los protocolos de atención inclusiva y las exigencias de accesibilidad física y digital a los socios comerciales, distribuidores y proveedores de la cadena de suministro para asegurar una experiencia de usuario homogénea y sin discriminación, e institucionalizar laboratorios de co-creación permanente con organizaciones de la sociedad civil para el diseño proactivo de productos y servicios universalmente accesibles."],"s":"ODS 5, ODS 10, ODS 11, Sistema B, UE ESRS S4"},{"id":"cliente-10","sub":"","t":"Educación y sensibilización del consumidor","d":"El indicador evalúa el compromiso de la empresa con la educación para el consumo consciente y la sensibilización de sus clientes, lo cual forma parte de la Responsabilidad Social y Sustentabilidad (RS&S) y busca que la empresa ejerza una influencia positiva sobre la sociedad.","l":["No se brinda información ni formación a los clientes.","La empresa desarrolla materiales educativos o campañas sobre sostenibilidad vinculadas a sus productos o servicios.","La empresa implementa programas de sensibilización o formación dirigidos a clientes y usuarios.","La empresa promueve una comunidad de consumidores informados, impulsando prácticas responsables y de bajo impacto."],"a":["Instrumentar de manera operativa el registro de publicaciones y materiales educativos difundidos para documentar y dar seguimiento al alcance de las campañas de concientización a través de los canales institucionales, y consolidar el informe del diagnóstico de brechas de conocimiento del consumidor con el fin de mapear con precisión las necesidades informativas del cliente y orientar el diseño de herramientas pedagógicas de alto impacto (como la implementación de códigos QR de sostenibilidad).","Oficializar el Manual del Programa de Sensibilización para estandarizar las temáticas prioritarias y las metodologías pedagógicas (desarrolladas preferentemente en co-creación con expertos u ONGs), e instrumentar de manera operativa el registro de los indicadores de alcance y feedback con el fin de monitorear la tasa de participación, evaluar la efectividad real de los contenidos y asegurar la mejora continua del proceso de transferencia de conocimiento.","Instrumentar de manera operativa el Informe Anual de Medición del Impacto en el Comportamiento del Consumidor para evaluar con métricas concretas la evolución de los hábitos ambientales de los usuarios, y gestionar la publicación de la estrategia de educación a la comunidad para transparentar los logros ante los stakeholders, impulsando en paralelo programas de reconocimiento e incentivos dirigidos a los clientes que demuestren las conductas más responsables.","Extender los programas de concientización, guías de uso eficiente y criterios de economía circular a los socios de la cadena de suministro (proveedores y distribuidores) para asegurar un mensaje unificado en todo el ciclo de vida del producto, e institucionalizar alianzas estratégicas de co-innovación junto a organizaciones de la sociedad civil y expertos para desarrollar nuevas soluciones pedagógicas que empoderen al consumidor y fortalezcan la rendición transparente de cuentas."],"s":"ODS 4, ODS 12, ODS 13, Sistema B, UE ESRS S4"},{"id":"cliente-11","sub":"","t":"Innovación orientada al usuario","d":"El indicador evalúa el grado en que la empresa utiliza la innovación para el desarrollo de productos y servicios a través de la co-creación y el diálogo con los clientes, un proceso fundamental para el perfeccionamiento continuo y la satisfacción del usuario.","l":["No se promueven prácticas de innovación centradas en el cliente.","La empresa involucra a los clientes en procesos de mejora o co-creación.","La empresa aplica metodologías de innovación centradas en el usuario, con métricas de impacto.","La empresa gestiona la innovación como parte de su estrategia, generando soluciones sostenibles y experiencias diferenciales para el cliente."],"a":["Implementar el registro de la participación de clientes en pruebas piloto para formalizar los paneles de retroalimentación, y elaborar el informe de feedback de usabilidad recopilado para guiar las optimizaciones del equipo de I+D.","Oficializar el Manual de Aplicación de Metodologías de Innovación Centrada en el Usuario para estandarizar los procesos de diseño ágil con clientes, e instrumentar de manera operativa el registro de las métricas de impacto (como la tasa de adopción) para evaluar el éxito real de las soluciones desarrolladas.","Incorporar la innovación orientada al usuario dentro del Plan Estratégico de la organización, y estructurar el Informe Anual de Innovación para evidenciar los resultados económicos y sociales derivados de la voz del cliente.","Extender las metodologías de co-creación y pruebas piloto a socios comerciales y proveedores clave, e institucionalizar alianzas de innovación abierta con centros tecnológicos o universidades para co-diseñar soluciones sostenibles de vanguardia."],"s":"ODS 8, ODS 9, Sistema B, UE ESRS S4"}]}];

async function hash(pw, salt) {
  const data = new TextEncoder().encode(salt + ':' + pw);
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const c of data) h = ((h << 5) + h + c) | 0; return 'x' + (h >>> 0).toString(16);
}

/* ---------- Scoring (corregido) ----------
   · Cada indicador vale 0–3 (Nivel 1 a Nivel 4).
   · El puntaje global se calcula sobre los 88 indicadores, no solo sobre
     los respondidos; un diagnóstico solo se considera oficial al completarse.
   · Todos los indicadores de todos los ejes entran en el cálculo. */
function score(c) {
  const a = c.answers || {};
  const per = EJES.map(e => {
    let sum = 0, ans = 0;
    e.ind.forEach(i => { const v = a[i.id]; if (v === 0 || v === 1 || v === 2 || v === 3) { sum += v; ans++; } });
    return {id: e.id, sum, ans, total: e.ind.length, complete: ans === e.ind.length, pct: ans ? sum / (ans * 3) * 100 : 0};
  });
  const sum = per.reduce((s, p) => s + p.sum, 0), ans = per.reduce((s, p) => s + p.ans, 0);
  const dist = [0, 0, 0, 0]; Object.values(a).forEach(v => { if (dist[v] !== undefined) dist[v]++; });
  return {per, sum, ans, total: TOTAL, dist, complete: ans === TOTAL, progress: ans / TOTAL * 100, pct: sum / (TOTAL * 3) * 100, provisional: ans ? sum / (ans * 3) * 100 : 0};
}
const shown = s => s.complete ? s.pct : s.provisional;
function finals(cid) { return DB.cycles(cid).filter(c => c.status === 'finalizado'); }
function baseCycle(company) {
  const f = finals(company.id); if (!f.length) return null;
  return f.find(c => c.year === Number(company.baseYear)) || f[0];
}
function pickCycle(cid, preferFinal = true) {
  const all = DB.cycles(cid); if (!all.length) return null;
  if (preferFinal) { const f = all.filter(c => c.status === 'finalizado'); if (f.length) return f[f.length - 1]; }
  return all[all.length - 1];
}

/* ---------- Plan helpers ---------- */
function planItems(c) {
  return IND.filter(i => c.answers[i.id] !== undefined).map(i => {
    const s = c.answers[i.id];
    return {ind: i, score: s, action: i.a[s], plan: (c.plan && c.plan[i.id]) || {}};
  });
}
/* Cronograma automático
   1. Orden: eje 1 a 7 y, dentro de cada eje, indicador 1 a n (orden de la planilla).
   2. Cada eje arranca EJE_GAP meses después del anterior.
   3. Dentro del eje, cada acción empieza cuando la anterior va por la mitad.
   4. Duración según punto de partida (DUR). Las prácticas en Nivel 4 se sostienen
      durante todo el horizonte y no ocupan lugar en la secuencia.
   5. Si la secuencia excede los 48 meses, se comprime el ritmo de inicio
      (no las duraciones) manteniendo el orden. */
function sequencePlan(c) {
  const items = planItems(c), seq = [], maint = [];
  EJES.forEach((e, ei) => {
    let cur = ei * EJE_GAP;
    items.filter(it => it.ind.eje === e.id).forEach(it => {
      if (it.score === 3) { maint.push(it); return; }
      const d = DUR[it.score]; seq.push({it, s: cur, d}); cur += Math.ceil(d / 2);
    });
  });
  let f = 1;
  const fits = k => seq.every(x => Math.floor(x.s * k) + x.d - 1 <= 47);
  while (f > 0.2 && !fits(f)) f -= 0.01;
  seq.forEach(x => { x.s2 = Math.floor(x.s * f); x.e2 = Math.min(47, x.s2 + x.d - 1); });
  return {seq, maint};
}
function autoSchedule(c, mode = 'empty') {
  if (mode === true) mode = 'empty'; if (mode === false) mode = 'all';
  const y0 = c.year + 1; c.plan = c.plan || {};
  const {seq, maint} = sequencePlan(c); let n = 0;
  const apply = (it, s, e) => {
    const p = c.plan[it.ind.id] || (c.plan[it.ind.id] = {});
    if (mode === 'empty' && p.start && p.end) return;
    p.start = mFromIdx(s, y0); p.end = mFromIdx(e, y0);
    p.area = p.area || AREAS[it.ind.eje]; p.status = p.status || 'pendiente'; n++;
  };
  seq.forEach(x => apply(x.it, x.s2, x.e2));
  maint.forEach(it => apply(it, 0, 47));
  return n;
}

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function genAnswers(seed, level, bias, coverage = 1) {
  const fixed = rng(seed), yearly = rng(seed * 7 + Math.round(level * 100));
  const a = {};
  IND.forEach((i, idx) => {
    const n = (fixed() - 0.5) * 2.1 + (yearly() - 0.5) * 0.6;
    const v = Math.max(0, Math.min(3, Math.round(level + (bias[i.eje] || 0) + n)));
    if (idx / TOTAL < coverage) a[i.id] = v;
  });
  return a;
}

function radar(series, {size = 420, label = 'Gráfico radar de madurez por eje'} = {}) {
  const n = EJES.length, cx = size / 2, cy = size / 2, R = size * 0.36;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100]; };
  const poly = vals => vals.map((v, i) => pt(i, Math.max(2, v)).map(x => x.toFixed(1)).join(',')).join(' ');
  let g = '';
  [25, 50, 75, 100].forEach(v => { g += `<polygon class="ring" points="${poly(EJES.map(() => v))}"/>`; });
  EJES.forEach((e, i) => { const [x, y] = pt(i, 100); g += `<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; });
  [25, 50, 75].forEach(v => { const [x, y] = pt(0, v); g += `<text class="tick" x="${x + 4}" y="${y + 3}">${v}</text>`; });
  series.forEach(s => {
    g += `<polygon points="${poly(s.values)}" style="fill:${s.fill};fill-opacity:${s.op ?? .7};stroke:${s.stroke};stroke-width:2;stroke-linejoin:round;mix-blend-mode:multiply${s.dash ? ';stroke-dasharray:5 4' : ''}"/>`;
    s.values.forEach((v, i) => { const [x, y] = pt(i, Math.max(2, v)); g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${s.stroke}"><title>${esc(EJES[i].name)}: ${r0(v)}%</title></circle>`; });
  });
  EJES.forEach((e, i) => {
    const [x, y] = pt(i, 122); const anchor = Math.abs(x - cx) < 8 ? 'middle' : x > cx ? 'start' : 'end';
    const words = e.short.split(' '); const lines = words.length > 2 ? [words.slice(0, 2).join(' '), words.slice(2).join(' ')] : [e.short];
    g += `<text x="${x.toFixed(1)}" y="${(y + 4 - (lines.length - 1) * 7).toFixed(1)}" text-anchor="${anchor}">${lines.map((l, j) => `<tspan x="${x.toFixed(1)}" dy="${j ? 14 : 0}">${esc(l)}</tspan>`).join('')}</text>`;
  });
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.fill};border:2px ${s.dash ? 'dashed' : 'solid'} ${s.stroke}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<svg class="radar" viewBox="-70 -10 ${size + 140} ${size + 20}" role="img" aria-label="${esc(label)}">${g}</svg>${legend}`;
}

function lineChart(points) {
  const W = 680, H = 280, L = 44, Rr = 24, T = 20, B = 40;
  const iw = W - L - Rr, ih = H - T - B;
  const P = 44; const x = i => L + (points.length === 1 ? iw / 2 : P + i * (iw - 2 * P) / (points.length - 1));
  const y = v => T + ih - v / 100 * ih;
  let g = '';
  const tints = ['rgba(255,0,152,.05)', 'rgba(51,204,255,.07)', 'rgba(51,204,153,.08)', 'rgba(51,102,102,.08)'];

  [0, 25, 50, 75, 100].forEach(v => { g += `<line x1="${L}" x2="${L + iw}" y1="${y(v)}" y2="${y(v)}" stroke="#E0E4E2"/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.pct).toFixed(1)}`).join(' ');

}

/* =====================================================================
   Router & shell
   ===================================================================== */
const app = $('#app');
let CTX = {};
let AFTER = [];

/* Router interno: la ruta vive en ROUTE y se sincroniza con la URL solo si el
   navegador lo permite (en vistas previas embebidas la navegación está bloqueada). */
let ROUTE = (() => { try { return location.hash || '#/'; } catch (e) { return '#/'; } })();
function syncUrl(h, replace) {
  try { if (replace) history.replaceState(null, '', h); else if (location.hash !== h) history.pushState(null, '', h); } catch (e) {}
}
function go(h, replace = false) { ROUTE = h || '#/'; syncUrl(ROUTE, replace); render(); }
function redirect(h) { go(h, true); }
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); go(a.getAttribute('href'));
});
window.addEventListener('popstate', () => { try { ROUTE = location.hash || '#/'; } catch (e) {} render(); });
window.addEventListener('hashchange', () => { try { if (location.hash !== ROUTE) { ROUTE = location.hash || '#/'; render(); } } catch (e) {} });

/* Formularios: no dependen del evento submit (bloqueado en algunas vistas embebidas). */
function bindForm(form, fn) {
  let busy = false;
  const run = async e => { if (e) e.preventDefault(); if (busy) return; busy = true; try { await fn(new FormData(form), form); } finally { busy = false; } };
  form.addEventListener('submit', run);
  $$('button:not([type]),button[type="submit"]', form).forEach(btn => btn.addEventListener('click', run));
  $$('input', form).forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.type !== 'checkbox') run(e); }));
  return run;
}

let PREV_PATH = null;
function render() {
  AFTER = [];
  const s = Session.get();
  const user = s && DB.user(s.userId);
  if (!user) { Session.clear(); app.innerHTML = viewLogin(); bindLogin(); return; }
  const [path, query] = (ROUTE.slice(1) || '/').split('?');
  const parts = path.split('/').filter(Boolean);
  CTX = {user, s, q: new URLSearchParams(query || ''), parts, keepScroll: PREV_PATH === path};
  PREV_PATH = path;

  if (user.role === 'admin') {
    if (parts[0] === 'admin' && parts[1] === 'ver' && parts[2]) { s.view = parts[2]; Session.set(s); redirect('#/inicio'); return; }
    if (!parts.length || parts[0] === 'admin') {
      if (s.view) { s.view = null; Session.set(s); }
      return shell(viewAdmin(), 'admin');
    }
    if (!s.view || !DB.company(s.view)) { redirect('#/admin'); return; }
  } else if (parts[0] === 'admin' || !parts.length) { redirect('#/inicio'); return; }

  const cid = user.role === 'admin' ? s.view : user.companyId;
  CTX.company = DB.company(cid);
  if (!CTX.company) { Session.clear(); render(); return; }

  const route = parts[0];
  const own = id => { const c = DB.cycle(id); return c && c.companyId === cid ? c : null; };
  let html;
  switch (route) {
    case 'inicio': html = viewHome(); break;
    case 'diagnosticos': html = viewCycles(); break;
    case 'diagnostico': { const c = own(parts[1]); if (!c) return go('#/diagnosticos'); html = viewQuestionnaire(c, Math.min(EJES.length - 1, Math.max(0, Number(parts[2]) || 0)), parts[3]); break; }
    case 'resultados': { const c = parts[1] ? own(parts[1]) : pickCycle(cid); html = c ? viewResults(c) : viewNoData('resultados'); break; }
    case 'plan': { const c = parts[1] ? own(parts[1]) : pickCycle(cid); html = c ? viewPlan(c) : viewNoData('plan'); break; }
    case 'evolucion': html = viewEvolution(); break;
    case 'empresa': html = viewCompany(); break;
    default: return go('#/inicio');
  }
  shell(html, route);
}

function navLink(href, icon, label, key, active) {
  return `<a href="${href}" ${key === active ? 'aria-current="page"' : ''}>${ICON[icon]}<span>${label}</span></a>`;
}

function shell(content, active) {

      <div class="page">
        <div class="print-only"><span><b>${esc(CTX.company?.name || 'Panel de la consultora')}</b><br><span class="muted">Autodiagnóstico de Sostenibilidad · ${new Date().toLocaleDateString('es-AR')}</span></span><img src="${LOGOS.pbDark}" alt="Aero Regenerativo"></div>

      </div>

  $('#logout').onclick = () => { Session.clear(); go('#/', true); };

/* ---------- Dialog helper ---------- */
function openDialog(html, onSubmit) {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form class="dlg" novalidate>${html}</form>`;
  const form = $('form', dlg);
  $$('[data-close]', dlg).forEach(b => b.onclick = () => dlg.close());
  bindForm(form, async fd => { const ok = await onSubmit(fd, form); if (ok !== false && dlg.open) dlg.close(); });
  dlg.showModal();
  const first = $('input,select,textarea', dlg); if (first) first.focus();
}
function confirmDialog(title, text, label, fn, danger = true) {
  openDialog(`<h2>${esc(title)}</h2><p class="dlg-sub" style="margin-top:0">${esc(text)}</p>

function companySummary(co) {
  const all = DB.cycles(co.id), f = all.filter(c => c.status === 'finalizado');
  const last = f[f.length - 1] || null, base = baseCycle(co), open = all.find(c => c.status !== 'finalizado');
  const ls = last ? score(last) : null, bs = base ? score(base) : null;
  return {all, last, base, open, ls, bs, delta: ls && bs && last !== base ? ls.pct - bs.pct : null};
}
function viewAdmin() {

async function saveCompany(fd, co, u) {
  const err = $('#coErr');
  const name = fd.get('name').trim(), email = fd.get('email').trim().toLowerCase(), pw = fd.get('pw'), uname = fd.get('uname').trim();
  if (!name || !email || !uname) { err.textContent = 'Completá la razón social, el contacto y el correo.'; return false; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'El correo no tiene un formato válido.'; return false; }
  const other = DB.userByEmail(email); if (other && (!u || other.id !== u.id)) { err.textContent = 'Ese correo ya está en uso por otro usuario.'; return false; }
  if ((!co || pw) && String(pw).length < 6) { err.textContent = 'La contraseña debe tener al menos 6 caracteres.'; return false; }
  if (!co) { co = {id: uid(), created: new Date().toISOString().slice(0, 10), baseYear: null}; DB.d.companies.push(co); }
  Object.assign(co, {name, sector: fd.get('sector').trim(), size: fd.get('size'), city: fd.get('city').trim()});
  if (!u) { u = {id: uid(), role: 'empresa', companyId: co.id, salt: uid()}; DB.d.users.push(u); }
  u.email = email; u.name = uname;
  if (pw) { u.salt = uid(); u.pass = await hash(pw, u.salt); }
  DB.persist(); toast('Empresa guardada'); render();
}
function bindAdmin() {

  $$('[data-del]').forEach(b => b.onclick = () => { const co = DB.company(b.dataset.del);
    confirmDialog('Eliminar empresa', `Se eliminarán ${co.name}, sus usuarios y todos sus diagnósticos. Esta acción no se puede deshacer.`, 'Eliminar empresa', () => { DB.removeCompany(co.id); toast('Empresa eliminada'); render(); }); });
  $('#exportBtn').onclick = () => {

function scoreHero(c, s, base, prev) {
  const p = shown(s), bi = bandIdx(p), b = BANDS[bi];
  const bs = base && base.id !== c.id ? score(base) : null;
  const ps = prev && prev.id !== c.id ? score(prev) : null;
  const crit = Object.values(c.answers).filter(v => v === 0).length;
  return `
    <div class="hero-score">
      <span class="lbl">Puntaje global ${c.year}${s.complete ? '' : ' · provisorio'}</span>
      <div class="big">${r0(p)}<small>%</small></div>
      <div>
        <div class="scale" aria-hidden="true">${BANDS.map((x, i) => `<span class="${i <= bi ? 'on' : ''}"></span>`).join('')}</div>
        <div class="scale-l" aria-hidden="true"><span>0</span><span>25</span><span>50</span><span>75</span></div>
      </div>
      <div class="band">${b.name}</div>
      <p class="msg">${esc(b.msg)}</p>
      <div class="hero-stats">
        <div><b>${bs ? deltaHTML(s.pct - bs.pct).replace('delta ', 'delta lg ') : '—'}</b><span>Vs. año base ${bs ? base.year : ''}</span></div>
        <div><b>${ps ? deltaHTML(s.pct - ps.pct).replace('delta ', 'delta lg ') : '—'}</b><span>Vs. año anterior</span></div>
        <div><b>${crit}</b><span>Prácticas por implementar</span></div>
      </div>
    </div>`;
}
function radarSeries(c, base) {
  const s = score(c), ser = [];
  if (base && base.id !== c.id) ser.push({name: `Año base ${base.year}`, values: score(base).per.map(p => p.pct), fill: '#336666', stroke: '#336666', op: .55, dash: true});
  ser.push({name: `${c.year}`, values: s.per.map(p => p.pct), fill: '#99FF66', stroke: '#33CC99', op: .8});
  return ser;
}
