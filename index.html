sis de plataformas de mercado, adquirir créditos equivalentes a una porción de las emisiones de Alcance 1 y 2 priorizando proyectos con co-beneficios sociales (ODS 3 y ODS 8), y lanzar un piloto de neutralización enfocado en un producto o evento corporativo específico.","Publicar la Política de Neutralidad de Carbono, compensar la totalidad de las emisiones residuales anuales mediante créditos de alta calidad y detallar públicamente la estrategia climática integral dentro del Reporte de Sostenibilidad.","Mantener la excelencia en la jerarquía de mitigación (reducción antes que compensación), co-crear soluciones innovadoras con aliados sectoriales y escalar las mejores prácticas ambientales a toda la cadena de valor."],"s":"ODS 13, Sistema B, UE ESRS E1"},{"id":"ambiente-18","sub":"Acción Climática","t":"Regeneración y biodiversidad","d":"El indicador se centra en la existencia de programas de Educación y Concientización Ambiental y cómo la empresa fomenta una cultura interna que respalda la Acción Climática, siendo esencial para que los empleados se comprometan con la mejora continua y la reducción del impacto ambiental.","l":["La empresa no identifica los impactos de sus actividades sobre la biodiversidad ni define zonas prioritarias de acción ambiental.","La empresa implementa prácticas de conservación, revegetación o restauración en sus instalaciones o entorno directo.","La empresa desarrolla programas de regeneración o conservación de ecosistemas en alianza con entidades locales, científicas o ambientales.","La empresa ejecuta programas de regeneración integral y protección de la biodiversidad, con seguimiento técnico, metas de restauración y reportes públicos de resultados."],"a":["Mapear los impactos directos de la operación en el entorno, ejecutar una práctica de restauración local (revegetación nativa o instalación de cajas nido), capacitar al equipo en biodiversidad y resguardar el registro fotográfico junto con el listado de especies implantadas.","Firmar una alianza formal con un socio científico o ambiental, realizar una evaluación técnica para definir metas cuantitativas de restauración, priorizar proyectos con capacidad de captura de carbono y resguardar el convenio de colaboración junto al informe técnico de metas.","Ejecutar evaluaciones técnicas periódicas de Impacto Neto Positivo, publicar los resultados de los programas de restauración en el Reporte de Sostenibilidad, integrar la pérdida de biodiversidad en la gestión de riesgos corporativa e incorporar criterios de protección ambiental en la política de compras.","Optimizar los programas de regeneración biológica mediante la mejora continua, profundizar la innovación ecológica junto a aliados estratégicos y escalar las directrices de conservación a toda la cadena de valor."],"s":"ODS 13, ODS 15, Sistema B, UE ESRS E4"},{"id":"ambiente-19","sub":"Acción Climática","t":"Capacitación y cultura sobre cambio climático","d":"El indicador evalúa el compromiso de la empresa con la protección y restauración de los hábitats naturales, un aspecto crucial para la conservación de la biodiversidad y la mitigación de la degradación ambiental que va más allá de la gestión interna.","l":["El personal no recibe formación sobre cambio climático.","La empresa incorpora capacitaciones básicas sobre cambio climático y sostenibilidad para áreas clave de su operación.","La empresa desarrolla un programa de capacitación anual diferenciado por roles, que incluye temáticas de eficiencia energética, mitigación y adaptación.","La empresa consolida una cultura climática organizacional, integrando la sostenibilidad en sus valores, incentivos y procesos de aprendizaje continuo."],"a":["Identificar las áreas operativas de mayor impacto, dictar la capacitación introductoria sobre cambio climático y ODS 13, difundir mensajes de concientización a través de medios internos, y resguardar las listas de asistencia junto al material didáctico.","Diseñar el Programa de Capacitación Anual estructurado por roles (Dirección, Operación e I+D), integrar las temáticas de sostenibilidad en los procesos de inducción y evaluación de desempeño, constituir un Comité Verde inter-áreas y resguardar el documento formal del programa junto a las evidencias de su aplicación.","Incorporar formalmente los objetivos de sostenibilidad y acción climática dentro de la matriz de competencias y el sistema de incentivos de la evaluación de desempeño del personal.","Co-diseñar un programa de innovación sostenible junto a aliados estratégicos y proveedores críticos para extender las prácticas de mitigación climática a toda la cadena de suministro."],"s":"ODS 4, ODS 13, Sistema B, ISO 14001:2026"},{"id":"ambiente-20","sub":"Acción Climática","t":"Reporte y comunicación de resultados climáticos","d":"El indicador evalúa la transparencia y rendición de cuentas en materia climática, enfocándose en la difusión de información sobre el desempeño ambiental de la empresa y la coherencia de su comunicación con los principios de Responsabilidad Social y Sustentabilidad (RS&S).","l":["No se comunican avances ni resultados ambientales.","La empresa comunica a su equipo interno y principales socios los avances ambientales mediante boletines, reuniones o informes simples.","La empresa elabora un reporte anual de desempeño climático con indicadores, metas y resultados verificables.","La empresa pública de forma transparente su desempeño climático y energético, validado externamente y alineado a estándares internacionales de reporte."],"a":["Establecer un mecanismo regular de comunicación que incluya el envío de un boletín mensual de sostenibilidad interna y un informe de desempeño ambiental básico dirigido a los socios clave.","Elaborar y publicar el Reporte Anual de Desempeño Climático en formato digital, oficializando en paralelo la política interna que define su periodicidad y contenido técnico.","Someter el inventario de GEI y el reporte de sostenibilidad a una auditoría independiente para obtener el Certificado de Verificación Externa bajo los estándares GRI y TCFD.","Desplegar una plataforma digital pública para co-reportar indicadores ambientales clave de manera conjunta con los proveedores críticos de la cadena de suministro."],"s":"ODS 12, ODS 13, Sistema B, UE ESRS E1, ISO 14001:2026"},{"id":"ambiente-21","sub":"Economía Circular","t":"Comunicación ambiental responsable","d":"El indicador evalúa la transparencia y la ética en la comunicación de la empresa sobre su desempeño ambiental, lo cual es esencial para construir credibilidad y evitar el uso de información ambigua o no verificada (greenwashing).","l":["No se comunica el desempeño ambiental ni los avances en circularidad.","La empresa pública resultados ambientales relevantes en canales internos o externos.","La empresa asegura la transparencia de sus mensajes, evitando declaraciones ambiguas o no comprobables.","La empresa reporta públicamente sus avances ambientales bajo estándares reconocidos y auditorías externas."],"a":["Oficializar la designación del responsable de la comunicación ambiental de la empresa e implementar un registro operativo de las publicaciones externas que sirva como archivo de control de los resultados ambientales difundidos, asegurando que cada mensaje esté respaldado por datos internos validados.","Diseñar e institucionalizar el Procedimiento de revisión y validación de comunicaciones ambientales para estandarizar el flujo de aprobación de los mensajes institucionales, e implementar un registro de control operativo que evidencie de manera sistemática la corrección o eliminación de declaraciones ambiguas detectadas antes de su difusión.","Diseñar y publicar el Reporte de Sostenibilidad anual alineado a estándares internacionales (GRI o UE ESRS), y gestionar de manera paralela la auditoría con una entidad independiente para obtener el Certificado de Verificación Externa que valide rigurosamente la precisión de los datos e indicadores reportados.","Diseñar e implementar un portal digital permanente de datos abiertos (Open Data Hub) que ponga a disposición del público las métricas de la huella material, hídrica y energética de la empresa en tiempo real, desplegando en paralelo un programa sectorial de transferencia de conocimiento para capacitar a proveedores y aliados de la región en la comunicación ambiental ética y la mitigación colectiva del greenwashing."],"s":"ODS 12, Sistema B, UE ESRS E5, ISO 14001:2026"}]},{"id":"colaboradores","name":"Colaboradores","dim":"Social","foco":"Bienestar, condiciones laborales, desarrollo, diversidad y liderazgo.","ind":[{"id":"colaboradores-1","sub":"","t":"Condiciones laborales y cumplimiento normativo","d":"El indicador evalúa el compromiso de la empresa con el Trabajo Decente y el respeto de los derechos laborales fundamentales, asegurando que las condiciones de trabajo y la relación contractual superen los mínimos legales requeridos.","l":["No se controlan las condiciones laborales ni se asegura el cumplimiento de la legislación.","La empresa monitorea periódicamente las condiciones laborales y realiza auditorías internas.","La empresa promueve condiciones laborales que superan los estándares legales, incluyendo bienestar y desarrollo.","La empresa garantiza entornos laborales seguros, equitativos y con políticas de mejora continua certificadas o auditadas externamente."],"a":["Diseñar e institucionalizar el Cronograma de Auditorías Internas de Cumplimiento Legal Laboral para estructurar las revisiones periódicas, e implementar el desarrollo sistemático de los informes de monitoreo de la jornada de trabajo y salarios para documentar y auditar de manera rigurosa el cumplimiento de las condiciones contractuales y operativas de los colaboradores.","Estructurar y oficializar el Plan de Beneficios y Bienestar Documentado para formalizar los incentivos y programas que exceden el marco normativo vigente, e instrumentar la aplicación periódica del diagnóstico interno para consolidar el informe de la Encuesta de Clima y Satisfacción Laboral, utilizándolo como insumo crítico en la toma de decisiones estratégicas de la dirección.","Redactar y oficializar la Política de Mejora Continua de las condiciones laborales para alinear de forma vinculante los hallazgos de control con la estrategia corporativa, y coordinar los procesos de auditoría externa con organismos de acreditación internacionales para emitir y mantener el Certificado o Informe de Auditoría Externa (ISO 45001) o las correspondientes validaciones de clima organizacional.","Diseñar e implementar un programa corporativo de transferencia metodológica y auditoría en trabajo decente destinado a estandarizar y elevar las condiciones de seguridad, salud y bienestar de los proveedores clave en la cadena de suministro, desplegando en paralelo un panel digital transparente para compartir las métricas de clima, equidad salarial e impacto laboral positivo con los grupos de interés."],"s":"ODS 8, Sistema B, UE ESRS S1"},{"id":"colaboradores-2","sub":"","t":"Bienestar y conciliación laboral-familiar","d":"El indicador evalúa el compromiso de la empresa con la calidad de vida, el bienestar físico y mental de sus empleados, buscando establecer un equilibrio entre el trabajo y la vida familiar, lo cual es un aspecto central de la Responsabilidad Social y Sustentabilidad (RS&S).","l":["No existen acciones orientadas al bienestar del personal.","La empresa ofrece beneficios que contribuyen al bienestar físico y emocional del personal.","La empresa desarrolla programas de bienestar que fomentan la conciliación personal-laboral y la satisfacción integral.","La empresa integra el bienestar en su cultura, midiendo resultados e incorporando la voz de los colaboradores en su diseño."],"a":["Diseñar y formalizar el Plan de Beneficios Básico documentado que establezca de manera clara las prestaciones, alcances y convenios de soporte disponibles para los colaboradores, e instrumentar la aplicación del diagnóstico interno para consolidar el informe inicial de la encuesta de satisfacción del personal, asegurando la asignación de un responsable de Recursos Humanos para la gestión y monitoreo continuo del uso de estas herramientas.","Diseñar y formalizar el Manual de Programas de Bienestar para establecer de manera clara y vinculante las directrices de flexibilidad laboral y licencias extendidas de la empresa, y desarrollar e instrumentar un Tablero de Control analítico para realizar el seguimiento mensual de los KPIs de satisfacción y nivel de uso de los beneficios, garantizando la mejora continua del ecosistema interno.","Institucionalizar e integrar de manera sistemática la documentación de la participación activa de los colaboradores en el diseño de los programas mediante registros formales de los Comités de Bienestar y minutas de co-creación, y estructurar de manera complementaria el Acta de revisión de la dirección que evalúa el impacto del bienestar en la productividad, el ausentismo y la retención, asegurando un ciclo anual de auditoría y rendición de cuentas ante la alta gerencia para optimizar la toma de decisiones estratégicas.","Diseñar e implementar un programa corporativo de transferencia metodológica en conciliación y calidad de vida destinado a capacitar y co-crear estrategias de bienestar con los proveedores clave de la cadena de suministro, desplegando en paralelo un panel digital interactivo que comparta de forma abierta y transparente las mejores prácticas y los indicadores de impacto del bienestar sobre la sostenibilidad del negocio y el desarrollo humano."],"s":"ODS 3, ODS 8, Sistema B, UE ESRS S1"},{"id":"colaboradores-3","sub":"","t":"Satisfacción y clima laboral","d":"El indicador evalúa la calidad de vida, el bienestar y el ambiente de trabajo dentro de la empresa, a través de la medición de la satisfacción y el clima laboral del personal, factores clave para la productividad y el Trabajo Decente.","l":["No se evalúa la satisfacción ni el clima laboral.","La empresa analiza los resultados de clima y define acciones de mejora.","La empresa integra la evaluación de clima laboral en su sistema de gestión, comunicando resultados.","La empresa promueve un entorno de trabajo basado en la confianza, la colaboración y el desarrollo, con seguimiento permanente de indicadores."],"a":["onsolidar el Informe de Resultados de la Encuesta de Clima Laboral tras la aplicación del diagnóstico interno y formalizar el listado de Acciones de Mejora derivadas del análisis para garantizar el seguimiento y la resolución de las brechas detectadas.","Diseñar e incorporar el procedimiento documentado de la Encuesta de Clima al Sistema de Gestión Integrado y estructurar el Tablero de Control con el seguimiento de los KPIs del clima para visibilizar en tiempo real la evolución de los indicadores y el avance de los planes de mejora encomendados.","Coordinar la emisión del Informe de Auditoría Interna sobre la gestión del clima para validar la transparencia y efectividad de las acciones, y estructurar la documentación que acredite la existencia de espacios de co-creación para políticas de bienestar de los empleados.","Impulsar la transferencia de buenas prácticas de bienestar y medición de clima hacia los proveedores clave de la cadena de suministro, y habilitar un panel digital transparente que visibilice de forma consolidada los índices de satisfacción, confianza y la evolución de los entornos de trabajo saludables en todo el ecosistema de valor."],"s":"ODS 8, Sistema B, UE ESRS S1"},{"id":"colaboradores-4","sub":"","t":"Evaluación del desempeño y feedback","d":"El indicador mide la existencia de procesos para la evaluación sistemática y objetiva del desempeño de los empleados, lo cual es fundamental para el desarrollo de carrera y la transparencia en la gestión de las personas, siendo la base para la promoción y el incremento salarial.","l":["No existen evaluaciones ni retroalimentación formal.","La empresa aplica evaluaciones formales de desempeño con comunicación de resultados.","La empresa implementa procesos estructurados de evaluación y retroalimentación con metas claras y desarrollo profesional.","La empresa gestiona el desempeño de manera continua, integrando feedback 360°, reconocimiento e incentivos vinculados al propósito y los valores."],"a":["Desarrollar el Manual del Proceso de Evaluación de Desempeño y recopilar las fichas de evaluación firmadas por los colaboradores como constancia de la retroalimentación realizada.","Vincular los resultados de desempeño a los Planes de Desarrollo Individual (PDI) e instrumentar el registro de las metas SMART asignadas a cada colabo","Formalizar el Manual del Sistema de Gestión de Desempeño Continuo (con esquema 360°) y aprobar la Política de Incentivos vinculada al propósito y las metas de sostenibilidad corporativa.","Extender los criterios de evaluación de desempeño sostenible a los proveedores clave de la cadena de suministro y habilitar un panel digital con las métricas consolidadas de equidad, promociones internas y cumplimiento de metas ESG."],"s":"ODS 8, Sistema B, UE ESRS S1"},{"id":"colaboradores-5","sub":"","t":"Incorporación responsable","d":"El indicador evalúa la existencia de políticas y procedimientos éticos y transparentes en los procesos de reclutamiento y selección, asegurando el respeto a la diversidad y la no discriminación desde el inicio de la relación laboral.","l":["No existen políticas o criterios formales para la contratación de personal.","La empresa aplica procesos de selección justos, basados en competencias y sin discriminación.","La empresa cuenta con políticas formales de contratación responsable, comunicadas y alineadas a su código de ética.","La empresa promueve procesos inclusivos de incorporación, garantizando igualdad de oportunidades y diversidad en todos los niveles."],"a":["Formalizar e institucionalizar los Procedimientos de Reclutamiento y Selección estandarizados bajo el enfoque de competencias, e implementar el programa de capacitación en no discriminación y sesgos inconscientes para el equipo interno, asegurando el archivo sistemático de los registros de asistencia correspondientes.","Redactar y oficializar la Política de Contratación Responsable bajo la firma de la alta dirección, e implementar un protocolo de registro auditable que evidencie la comunicación proactiva de este documento tanto a los colaboradores internos como a los postulantes en los canales de atracción de talento.","Redactar y formalizar el documento de Metas de Diversidad y Equidad institucionales, e instrumentar la Matriz de Monitoreo de la Diversidad Laboral con datos desagregados por género, edad y otras variables clave, estructurando así la rendición de cuentas anual ante la dirección y asegurando el seguimiento de los programas de acompañamiento.","Diseñar e institucionalizar un programa corporativo de mentoría y transferencia de buenas prácticas en DEI destinado a fortalecer las capacidades de los proveedores clave en su cadena de suministro, implementando en paralelo un panel digital público de rendición de cuentas que reporte de manera transparente los avances en equidad de género, inclusión sociolaboral y brecha salarial cero."],"s":"ODS 5, ODS 8, Sistema B, UE ESRS S1"},{"id":"colaboradores-6","sub":"","t":"Salud y seguridad ocupacional","d":"El indicador evalúa el compromiso de la empresa con el bienestar, la salud y la seguridad de sus empleados, buscando establecer patrones de excelencia en las condiciones de trabajo, lo cual se alinea con los principios fundamentales del trabajo decente.","l":["No hay medidas preventivas ni registro de accidentes laborales.","La empresa ejecuta capacitaciones periódicas en prevención de riesgos y control de accidentes.","La empresa gestiona la salud y seguridad laboral mediante programas preventivos, indicadores y seguimiento.","La empresa consolida una cultura preventiva con participación activa de los trabajadores, auditorías internas y mejora continua."],"a":["Desarrollar e instrumentar el registro formal de accidentes/incidentes para asegurar la trazabilidad y el análisis de causa-raíz de los desvíos en seguridad, y estructurar el cronograma anual de formación operativa, archivando de manera sistemática los listados de asistentes a las capacitaciones de prevención de riesgos como evidencia auditable del control interno.","Formalizar y estructurar el Programa Preventivo de Salud y Seguridad documentado que valide el enfoque proactivo de la organización, y desarrollar e instrumentar un Tablero de Control operativo para el seguimiento mensual y sistemático de los indicadores de frecuencia, gravedad de accidentes y cumplimiento de inspecciones, consolidando la trazabilidad de los datos para la mejora continua.","Coordinar los procesos de auditoría externa con una entidad certificadora acreditada para obtener y mantener el Certificado de Auditoría Externa (ISO 45001), y estructurar el sistema de registro operativo para consolidar la documentación que acredite la participación activa del Comité Mixto de Seguridad, integrando estos insumos en la elaboración y publicación del informe anual de desempeño frente a los stakeholders.","Diseñar e implementar un programa corporativo de homologación, transferencia metodológica y auditoría en SST destinado a estandarizar y elevar los niveles de seguridad de los proveedores y contratistas clave en la cadena de suministro, desplegando en paralelo un sistema de análisis predictivo de riesgos laborales y un panel digital transparente para compartir las métricas de accidentabilidad cero y buenas prácticas con la comunidad industrial."],"s":"ODS 3, ODS 8, Sistema B, UE ESRS S1, ISO 45001"},{"id":"colaboradores-7","sub":"","t":"Desarrollo y capacitación del personal","d":"El indicador evalúa el compromiso de la empresa para invertir en capacitación continua y desarrollo profesional de sus empleados, buscando fortalecer sus competencias y aumentar su potencial de empleabilidad, un aspecto clave del Trabajo Decente y la Educación de Calidad.","l":["No se brindan oportunidades de formación.","La empresa planifica capacitaciones periódicas en función de necesidades y objetivos estratégicos.","La empresa establece planes de desarrollo individual y programas de formación continua por áreas.","La empresa gestiona el aprendizaje organizacional con enfoque estratégico, medición de impacto y alianzas educativas."],"a":["Elaborar el Diagnóstico de Necesidades de Capacitación (DNC) y ejecutar el Plan Anual de Capacitación, asegurando el registro estandarizado de las horas de formación por empleado.","Implementar el Manual de PDI para los colaboradores y formalizar el registro de la evaluación de la efectividad de las capacitaciones mediante pruebas de conocimiento o impacto en el desempeño.","Suscribir los convenios formales con instituciones educativas de nivel superior y emitir el Acta de la dirección que evalúa el impacto de la capacitación en la productividad y el rendimiento estratégico del negocio.","Diseñar un programa de transferencia de conocimiento para proveedores de la cadena de suministro y habilitar un panel público con las métricas de impacto de la formación y el desarrollo del talento."],"s":"ODS 4, ODS 8, Sistema B, UE ESRS S1"},{"id":"colaboradores-8","sub":"","t":"Comunicación interna y participación","d":"El indicador evalúa la existencia de canales y mecanismos de comunicación interna y gestión participativa, lo cual es fundamental para el diálogo social y para que el conjunto de colaboradores participe en la búsqueda de soluciones y la mejora continua de la empresa.","l":["No hay canales de comunicación internos establecidos.","La empresa promueve espacios de diálogo y escucha activa entre equipos y líderes.","La empresa establece canales participativos para la toma de decisiones y la mejora continua.","La empresa fomenta una cultura de comunicación abierta, colaborativa y transparente, fortaleciendo el sentido de pertenencia."],"a":["Implementar el Acta o Registro de las Reuniones de Diálogo para asegurar el seguimiento de las inquietudes planteadas, y procesar la medición interna para emitir el informe de resultados de la encuesta de clima inicial.","Desarrollar el Manual de Procedimientos de los Comités Participativos y estructurar los registros de los proyectos de mejora implementados por iniciativa de los colaboradores para instrumentar y dar trazabilidad a sus soluciones.","Elaborar el Informe de Medición de Tasa de Participación en los canales formales e incorporar en la política de promoción las competencias de liderazgo específicas para fomentar la comunicación abierta.","Extender los canales de consulta y diálogo participativo a los proveedores clave de la cadena de suministro y habilitar un panel digital transparente con los niveles de participación y resolución de propuestas del ecosistema corporativo."],"s":"ODS 8, Sistema B, UE ESRS S1"},{"id":"colaboradores-9","sub":"","t":"Protocolos de prevención de acoso y violencia laboral","d":"El indicador evalúa la existencia y efectividad de políticas formales, protocolos de actuación y canales confidenciales de denuncia destinados a prevenir, gestionar y erradicar situaciones de acoso, abuso o violencia en el ámbito laboral, garantizando un entorno seguro y de contención para toda la plantilla.","l":["La empresa no cuenta con políticas ni protocolos formales para prevenir o abordar casos de acoso, abuso o violencia laboral.","Existen lineamientos básicos o pautas informales de convivencia, pero no hay un protocolo formalizado ni canales de denuncia confidenciales.","La empresa cuenta con una política formal, un protocolo de actuación documentado y un canal de denuncia confidencial habilitado para todo el personal.","El protocolo se aplica y audita rigurosamente, se capacita periódicamente al 100% de la plantilla, y existe un comité o rol imparcial que investiga los casos."],"a":["Redactar un documento institucional de \"Tolerancia Cero\" frente al acoso y la violencia. Comunicar formalmente estas pautas de respeto a toda la plantilla.","Diseñar y formalizar un protocolo de actuación específico frente a casos de acoso laboral y sexual. Habilitar un buzón o canal de denuncia interno que garantice la confidencialidad.","Constituir un comité de ética o designar personal imparcial para investigar las denuncias. Capacitar a todos los colaboradores y líderes sobre cómo utilizar el protocolo y el canal de denuncias.","Auditar anualmente la efectividad del canal de denuncias y los tiempos de resolución. Implementar encuestas anónimas periódicas para medir la percepción de seguridad psicológica y prevenir riesgos de forma proactiva."],"s":"ODS 5, ODS 8, ODS 16, Sistema B, UE ESRS S1"},{"id":"colaboradores-10","sub":"","t":"Igualdad, diversidad e inclusión","d":"El indicador mide la existencia y aplicación efectiva de políticas para la promoción de la equidad de género, racial y de otros segmentos en desventaja, reconociendo la obligación ética de la empresa de combatir todas las formas de discriminación y valorar la riqueza de la diversidad en el ambiente laboral.","l":["No se consideran principios de igualdad o inclusión en la gestión del personal.","La empresa incorpora acciones específicas para prevenir discriminación y fomentar la equidad.","La empresa cuenta con políticas de diversidad e inclusión, con metas y seguimiento de resultados.","La empresa consolida una cultura inclusiva con representación diversa en la gestión y monitoreo público de indicadores de equidad."],"a":["Aprobar y difundir el Código de Conducta con cláusula antidiscriminación, y documentar los registros de asistencia a las capacitaciones sobre sesgos para líderes y personal de Recursos Humanos.","Formalizar la Política de Diversidad e Inclusión con metas cuantitativas de representación y consolidar el informe de monitoreo de la brecha salarial anual para su revisión por la dirección.","Publicar el Reporte Anual de Indicadores de Equidad e incorporar formalmente los KPIs de diversidad en la política de remuneración de la alta dirección.","Extender las políticas de diversidad e inclusión a los proveedores de la cadena de suministro y habilitar un panel público con las métricas consolidadas de equidad e impacto social."],"s":"ODS 5, ODS 10, Sistema B, UE ESRS S1"},{"id":"colaboradores-11","sub":"","t":"Remuneración equitativa y reconocimiento","d":"El indicador evalúa la implementación de políticas de remuneración y beneficios que buscan la equidad y la transparencia, valorando las competencias y el potencial de los empleados, un pilar esencial del Trabajo Decente y la gestión socialmente responsable.","l":["No existe política salarial ni criterios de equidad.","La empresa revisa periódicamente la equidad interna y la correspondencia entre remuneración y desempeño.","La empresa aplica políticas de reconocimiento, incentivos y beneficios no monetarios alineados a los valores institucionales.","La empresa gestiona la compensación y el reconocimiento de manera integral, garantizando equidad, transparencia y motivación sostenida."],"a":["Elaborar el informe de brecha salarial por género (análisis de equidad interna) y formalizar la política de ajuste salarial vinculada al desempeño.","Aprobar la Política de Incentivos y Reconocimiento No Monetario e instrumentar el registro de la asignación de dichos beneficios para garantizar la transparencia del proceso.","Elaborar el informe anual de compensación integral y equidad y formalizar el acta de revisión de la dirección sobre el sistema de compensación estratégica.","Promover la adopción de criterios de trabajo digno y equidad salarial entre los proveedores clave de la cadena de suministro y habilitar un panel interactivo y transparente que visibilice el cumplimiento de la brecha salarial cero y la vinculación de incentivos a metas ESG."],"s":"ODS 5, ODS 8, Sistema B, UE ESRS S1"},{"id":"colaboradores-12","sub":"","t":"Liderazgo y gestión del talento","d":"El indicador evalúa el enfoque de la empresa en la inversión estratégica en capital humano, específicamente en el desarrollo de habilidades de liderazgo y la planificación de la sucesión, elementos que aseguran la continuidad y la gestión ética del negocio a largo plazo.","l":["No hay desarrollo de habilidades de liderazgo ni planificación de sucesión.","La empresa brinda formación a mandos medios para fortalecer su gestión de equipos.","La empresa implementa programas de liderazgo alineados al propósito y la cultura organizacional.","La empresa consolida una estrategia integral de gestión del talento que impulsa el crecimiento, la sucesión y el liderazgo sostenible."],"a":["Diseñar e instrumentar el Plan de Formación para Mandos Medios (con su correspondiente propuesta temática) y estructurar el registro de la evaluación de resultados de la capacitación para medir su impacto real en el desempeño del personal.","Diseñar e instrumentar el Programa de Liderazgo Formal alineado al propósito corporativo y formalizar el registro de la identificación de talentos de alto potencial para blindar las líneas de sucesión clave en el negocio.","Desarrollar e implementar el Manual de la Estrategia Integral de Gestión del Talento (que incorpore los planes de sucesión y el desarrollo de líderes) y formalizar el Acta de revisión de la dirección sobre el impacto de la gestión del talento en la continuidad del negocio.","Extender los lineamientos de liderazgo ético y desarrollo de capacidades a los socios clave de la cadena de suministro y habilitar un panel digital centralizado que monitoree en tiempo real la salud de los planes de sucesión, los índices de promoción interna y la retención de talento crítico."],"s":"ODS 8, Sistema B, UE ESRS S1"},{"id":"colaboradores-13","sub":"","t":"Innovación y trabajo colaborativo","d":"El indicador evalúa el grado de Gestión Participativa y la cultura interna de la empresa para fomentar la innovación y la colaboración entre sus empleados, elementos que contribuyen al desarrollo profesional y a la mejora continua de los procesos.","l":["No existen prácticas que fomenten la colaboración o la innovación.","La empresa crea espacios de innovación colaborativa entre áreas y proyectos.","La empresa gestiona procesos formales de innovación participativa con herramientas de gestión y evaluación.","La empresa consolida una cultura de innovación y colaboración continua, reconocida como ventaja competitiva y parte de su identidad."],"a":["Consolidar el registro de las ideas presentadas en los espacios colaborativos y estructurar el cronograma de los eventos de innovación realizados para formalizar, calendarizar y dar trazabilidad a las iniciativas de co-creación interna.","Desarrollar y aprobar el Manual del Proceso de Innovación Participativa (que integre los criterios de evaluación) y consolidar el registro de la asignación de presupuesto a los proyectos seleccionados para garantizar el fondeo, pilotaje y trazabilidad de las iniciativas aprobadas.","Desarrollar el Informe de Medición de Impacto y Retorno de la Innovación Participativa y formalizar la política de incentivos que vincula directamente las ideas a la compensación para recompensar el aporte estratégico de los colaboradores.","Extender los programas de co-creación y desafíos de innovación abierta hacia los proveedores y socios clave de la cadena de suministro, y habilitar un repositorio público que comparta de manera transparente las soluciones de triple impacto desarrolladas de forma colaborativa para inspirar al sector."],"s":"ODS 8, ODS 9, Sistema B, UE ESRS S1"}]},{"id":"cadena","name":"Cadena de suministro","dim":"Gobernanza","foco":"Compras responsables, proveedores, trazabilidad e innovación compartida.","ind":[{"id":"cadena-1","sub":"","t":"Política de compras responsables","d":"El indicador evalúa la existencia y aplicación de un marco formal que extienda los principios de Responsabilidad Social y Sustentabilidad (RS&S) a las decisiones de adquisición, buscando asegurar que el comportamiento de los proveedores esté alineado a sus principios éticos.","l":["No existen políticas o criterios de sostenibilidad en las compras.","La empresa incorpora criterios ambientales, sociales y éticos en su proceso de compra.","La empresa formaliza una política de compras responsables con lineamientos claros y comunicación interna.","La empresa aplica su política de compras responsables de manera sistemática, midiendo su impacto y comunicando resultados."],"a":["Implementar la Matriz de Evaluación de Proveedores que incluye criterios ESG para formalizar los nuevos estándares de selección, e instrumentar el registro de la primera evaluación de proveedores bajo estos nuevos criterios, comenzando además a incorporar cláusulas éticas de cumplimiento obligatorio en los nuevos contratos comerciales.","Coordinar la aprobación formal del Documento de la Política de Compras Responsables por parte de la alta dirección para validar los nuevos estándares socioambientales de abastecimiento, e instrumentar el registro de la comunicación interna de la misma para garantizar la alineación de los equipos de compras, complementando el proceso con la publicación de un resumen ejecutivo en el sitio web para informar de forma transparente a los proveedores.","Implementar la matriz de seguimiento y auditoría de proveedores críticos para verificar en terreno el cumplimiento socioambiental, y coordinar la elaboración y revisión anual por parte de la alta dirección del Informe Anual de Desempeño Social de la Cadena de Suministro, consolidando así la transparencia y la rendición de cuentas.","Extender los criterios de debida diligencia y sostenibilidad a toda la red de valor profunda para asegurar la trazabilidad ética de punta a punta, e institucionalizar laboratorios de co-innovación con proveedores y expertos sectoriales para desarrollar materiales, procesos o servicios de bajo impacto ambiental y alto valor social."],"s":"ODS 8, ODS 12, Sistema B, UE ESRS S2, ISO 20400"},{"id":"cadena-2","sub":"","t":"Evaluación de proveedores y declaraciones juradas","d":"El indicador evalúa el grado de diligencia debida de la empresa en la gestión de su cadena de suministro, asegurando que los socios comerciales clave cumplan con los principios de Responsabilidad Social y Sustentabilidad (RS&S), lo cual mitiga riesgos y promueve valor compartido.","l":["No se evalúan proveedores ni se aplican criterios de sostenibilidad.","La empresa incluye criterios de sostenibilidad en la evaluación de nuevos proveedores.","La empresa aplica evaluaciones periódicas que integran desempeño económico, ambiental y social.","La empresa mantiene un sistema de homologación y evaluación integral de proveedores, con seguimiento y mejora continua."],"a":["Implementar la Matriz de Criterios de Selección de Proveedores (que incluye factores ESG) para formalizar los requisitos socioambientales de ingreso, y gestionar el registro de la primera aplicación de esta matriz a nuevos socios para documentar la transición hacia un ecosistema de abastecimiento responsable.","Formalizar el Manual de Evaluación Periódica de Proveedores (que integra lo económico, social y ambiental) para estandarizar las métricas de control continuo, e instrumentar el registro de las evaluaciones realizadas a los socios clave para documentar el desempeño real, auditar los avances y establecer planes de acción de mejora conjunta en la cadena de suministro.","Oficializar el Manual del Sistema de Homologación Integral para estandarizar los criterios de monitoreo continuo y elegibilidad comercial basados en sostenibilidad, e instrumentar el registro de la mejora continua de los proveedores (acciones correctivas y preventivas) para auditar técnicamente el cierre de brechas y asegurar la evolución socioambiental de los socios estratégicos.","Extender las capacidades de homologación y los estándares ESG hacia los proveedores indirectos (Tier 2 y Tier 3) para asegurar una red de valor íntegra y libre de riesgos ocultos, e institucionalizar espacios de co-innovación sostenible junto a aliados y proveedores clave para co-diseñar soluciones, transparentar métricas y multiplicar el valor social generado en el mercado."],"s":"ODS 8, ODS 12, Sistema B, UE ESRS S2, ISO 9001, ISO 20400"},{"id":"cadena-3","sub":"","t":"Cumplimiento ético y legal en la cadena de suministro","d":"El indicador evalúa el compromiso ético y legal de la empresa, y de su cadena de valor, respecto a los derechos laborales y las prácticas justas de operación, lo cual mitiga riesgos y asegura que el comportamiento de los proveedores esté alineado a sus principios de Responsabilidad Social y Sustentabilidad.","l":["No existen controles sobre el cumplimiento legal o ético de los proveedores.","La empresa verifica el cumplimiento legal básico mediante documentación y registros.","La empresa exige y monitorea el cumplimiento ético, laboral y ambiental en los principales proveedores.","La empresa garantiza la integridad en su cadena mediante un código de conducta, auditorías y programas de mejora continua."],"a":["Formalizar el procedimiento documentado de verificación legal para fijar las pautas de auditoría interna y los requisitos documentales obligatorios en las contrataciones, e instrumentar el registro de la documentación de cumplimiento de los proveedores mediante un archivo digital centralizado que asegure la trazabilidad y vigencia de los respaldos legales del ecosistema comercial.","Gestionar la firma del documento de adhesión formal del proveedor al Código de Ética para establecer un marco de responsabilidad legal y moral vinculante en la cadena de suministro, e instrumentar de manera operativa la Matriz de Monitoreo de Desempeño Social con resultados de las autoevaluaciones para centralizar las métricas éticas, detectar desvíos de manera preventiva y priorizar las auditorías en terreno.","Oficializar el Código de Conducta de Proveedores formal (con mecanismo de denuncia) para institucionalizar un canal seguro de alertas y fijar los estándares éticos obligatorios, e instrumentar la revisión de los informes de las Auditorías Éticas/Laborales de terceros para evaluar de forma independiente a los socios clave y ejecutar programas de mejora continua que corrijan de manera efectiva las brechas detectadas.","Extender la auditoría ética y los protocolos de debida diligencia en derechos humanos a toda la red de suministro profunda (Tier 2 y Tier 3) para asegurar la trazabilidad ética de punta a punta, e institucionalizar una plataforma sectorial compartida con aliados clave para co-diseñar soluciones que mitiguen riesgos laborales sistémicos en el mercado."],"s":"ODS 8, ODS 16, Sistema B, UE ESRS S2, ISO 37001"},{"id":"cadena-4","sub":"","t":"Compras locales y de impacto positivo","d":"El indicador evalúa el rol de la empresa como agente de desarrollo socioeconómico local, utilizando su poder de compra para incentivar a pequeñas y microempresas de su entorno, y fortalecer el tejido productivo regional, lo cual es parte de la gestión responsable del impacto territorial.","l":["No se priorizan compras locales ni se conoce el origen de los insumos.","La empresa da preferencia a proveedores locales siempre que cumplan con criterios técnicos y de sostenibilidad.","La empresa implementa programas de compras locales y de impacto social positivo, con metas de cobertura.","La empresa consolida una estrategia de abastecimiento responsable que fomenta el desarrollo económico y social del territorio."],"a":["Institucionalizar el procedimiento de compras que incluye la cláusula de preferencia para dar prioridad a la contratación regional en igualdad de condiciones comerciales, e instrumentar de manera operativa el registro del mapeo de proveedores locales para consolidar una base de datos ágil y confiable de socios estratégicos viables en la provincia.","Formalizar el Documento del Programa de Compras de Impacto Positivo (con metas de cobertura) para oficializar las cuotas de abastecimiento sostenible y las directrices corporativas de inclusión, e instrumentar el registro de la matriz de seguimiento de dichas metas para auditar de forma continua el volumen de compra asignado a los proveedores de impacto y asegurar el cumplimiento de los objetivos territoriales.","Formalizar la Política Estratégica de Abastecimiento Responsable (que detalla el fomento al desarrollo territorial) para institucionalizar el compromiso corporativo con el crecimiento de la región, y coordinar la elaboración del Informe Anual de Medición del Impacto Económico Local generado por las compras para transparentar los resultados de la gestión hacia los stakeholders e impulsar programas de mentoring que escalen las operaciones de los proveedores de impacto.","Diseñar laboratorios de desarrollo y co-innovación para proveedores locales junto a cámaras comerciales y universidades para potenciar la competitividad de las Mipymes regionales, e institucionalizar un panel transparente de datos abiertos sobre el derrame socioeconómico territorial para inspirar e integrar a todo el ecosistema productivo."],"s":"ODS 8, ODS 10, ODS 16, Sistema B, UE ESRS S2"},{"id":"cadena-5","sub":"","t":"Colaboración y desarrollo de proveedores","d":"El indicador evalúa la existencia de una relación de asociación estratégica con los proveedores, buscando la innovación compartida y el desarrollo técnico y gerencial de la cadena de suministro para elevar el desempeño en sostenibilidad.","l":["No se mantienen vínculos más allá de la compra-venta tradicional.","La empresa ofrece asistencia técnica o capacitaciones básicas para fortalecer sus capacidades.","La empresa desarrolla programas de formación, innovación y mejora junto a proveedores estratégicos.","La empresa consolida alianzas de largo plazo con proveedores, impulsando innovación compartida y desempeño sostenible."],"a":["Instrumentar el registro de asistencia a las capacitaciones y elaborar el informe de las horas de asistencia técnica brindadas para medir la participación y el impacto inicial del soporte, complementando la estrategia con la creación de un boletín informativo periódico enfocado en brindar tips de cumplimiento legal y sostenibilidad para los socios comerciales.","Formalizar el Documento del Programa de Desarrollo de Proveedores (con objetivos de I+D) para estructurar las iniciativas conjuntas y las metas de innovación circular, e instrumentar de manera operativa los registros de los KPIs que demuestran la mejora en el desempeño para auditar técnicamente la evolución en la calidad, la reducción de errores y el impacto real de las inversiones compartidas.","Formalizar el Convenio de Alianza Estratégica de Largo Plazo con cláusulas de innovación compartida para institucionalizar los proyectos de co-diseño y cooperación tecnológica mutua, y coordinar la publicación del Informe Anual de la Cadena de Suministro para visibilizar de manera transparente ante los stakeholders el impacto de las alianzas estratégicas y el desempeño integral del ecosistema.","Institucionalizar una plataforma de innovación abierta y co-inversión sostenible para resolver retos de triple impacto complejos junto a los proveedores más maduros, y diseñar un programa de mentoría en cascada donde estos socios estratégicos transfieran capacidades técnicas y sostenibles a los subproveedores (Tier 2 y Tier 3), expandiendo la resiliencia y el valor del ecosistema productivo."],"s":"ODS 12, ODS 13, Sistema B, UE ESRS S2, ISO 14001:2026"},{"id":"cadena-6","sub":"","t":"Compras y contratación circular","d":"El indicador evalúa la integración de criterios de Economía Circular y sostenibilidad en los procesos de adquisición y contratación de la empresa, lo cual es esencial para reducir el impacto ambiental de la cadena de valor y promover el desarrollo sustentable en el mercado.","l":["Las compras no consideran criterios de circularidad.","La empresa selecciona proveedores con prácticas circulares y condiciones verificables.","La empresa prioriza compras de materiales reciclados o con certificaciones ambientales.","La empresa establece alianzas con proveedores para desarrollar productos y servicios circulares de manera conjunta."],"a":["Modificar y formalizar la Matriz de Evaluación de Proveedores para integrar los nuevos criterios ambientales y de circularidad, ejecutando las primeras evaluaciones de la cadena de suministro y asegurando la incorporación de la cláusula de cumplimiento legal ambiental en los nuevos acuerdos comerciales.","Redactar y oficializar el Documento de Política de Compras Sostenibles integrando los objetivos cuantitativos de adquisición, e implementar un sistema de control operativo para recopilar, validar y archivar de manera sistemática los certificados de sostenibilidad de los materiales adquiridos.","Instrumentar y oficializar el Convenio de Alianza Estratégica para I+D Circular con los proveedores clave seleccionados, e implementar el diseño y estructura del informe de seguimiento para monitorear de forma continua la evolución, los hitos y los resultados de los proyectos de desarrollo conjunto.","Diseñar e institucionalizar un programa de aceleración y desarrollo circular para la cadena de valor, implementando en paralelo un panel digital público de rendición de cuentas que reporte de manera transparente la trazabilidad de los insumos, el cumplimiento de certificaciones internacionales y el impacto socioambiental consolidado de todos los proveedores."],"s":"ODS 12, Sistema B, UE ESRS E5, ISO 14001:2026"},{"id":"cadena-7","sub":"","t":"Transparencia y trazabilidad de la cadena","d":"El indicador evalúa el grado de monitoreo y apertura informativa de la empresa respecto a su cadena de suministro, un requisito esencial de la Responsabilidad Social y la Sustentabilidad (RS&S) para asegurar la integridad, mitigar riesgos y promover la transparencia en toda la red.","l":["No se registran ni publican datos sobre la cadena de suministro.","La empresa recopila información sobre el desempeño social y ambiental de su cadena.","La empresa mapea su cadena de suministro y gestiona riesgos asociados a cada eslabón.","La empresa asegura la trazabilidad completa de su cadena, publica información relevante y promueve la transparencia en toda la red."],"a":["Desarrollar e institucionalizar el mapeo de proveedores de primer nivel (Tier 1) para identificar con claridad los eslabones críticos del abastecimiento, e instrumentar de manera operativa el registro de la información ESG recopilada mediante el envío y consolidación de cuestionarios estandarizados, asegurando que los nuevos contratos comerciales incorporen la cláusula de transparencia para garantizar el acceso a los datos socioambientales analizados.","Elaborar y estructurar el mapa de la cadena de suministro (incluyendo Tier 2) para garantizar la visibilidad de extremo a extremo sobre la procedencia de los insumos, e instrumentar la matriz de gestión de riesgos asociados a cada eslabón crítico para ponderar y registrar vulnerabilidades socioambientales (como el riesgo de trabajo forzoso), facilitando el reporte interno y la toma de decisiones preventivas en el abastecimiento.","Coordinar y difundir el Informe Anual de Trazabilidad y Riesgos de la Cadena (publicado) para transparentar ante el mercado el origen de los insumos y las acciones de mitigación implementadas, e instrumentar la obtención de la certificación o informe de auditoría externa de la trazabilidad para avalar técnicamente el control de punta a punta de la red de valor y consolidar la confianza de las partes interesadas.","Evolucionar la trazabilidad de la cadena hacia un modelo de análisis de ciclo de vida completo (de la cuna a la tumba) que conecte los datos ESG directamente con el consumidor final para fomentar el consumo responsable, e impulsar la creación de un ecosistema sectorial de datos abiertos que estandarice la transparencia y permita mitigar de forma colectiva los riesgos ambientales y sociales más complejos del mercado."],"s":"ODS 8, ODS 12, Sistema B, UE ESRS S2"},{"id":"cadena-8","sub":"","t":"Derechos humanos y condiciones laborales en proveedores","d":"El indicador evalúa el compromiso de la empresa para extender los principios del Trabajo Decente y la ética a lo largo de su cadena de suministro, asegurando que sus proveedores respeten las condiciones laborales, la seguridad social y la no discriminación.","l":["No se considera el cumplimiento laboral de los proveedores.","La empresa verifica el cumplimiento de condiciones laborales básicas mediante documentación o visitas.","La empresa audita o evalúa proveedores críticos en materia laboral y de seguridad.","La empresa promueve estándares laborales avanzados y programas de mejora conjunta en toda su cadena de valor."],"a":["Formalizar el procedimiento documentado de verificación laboral para estandarizar las pautas de control y auditoría interna sobre los derechos de los trabajadores, e instrumentar de manera operativa el registro de la documentación (ej., certificados de seguridad social) recopilada de los proveedores clave para centralizar y validar la vigencia de los respaldos legales, asegurando la inclusión de la cláusula de trabajo decente en todos los nuevos acuerdos comerciales.","Formalizar el Manual de Auditoría de Proveedores Críticos (con temario social y de seguridad) para estandarizar los protocolos técnicos de inspección en terreno, los alcances éticos y los criterios de equidad exigidos, e instrumentar el seguimiento de los informes de las auditorías realizadas para registrar los hallazgos, activar planes de remediación ante desvíos detectados y asegurar la mejora continua del ecosistema de proveedores.","Elaborar y coordinar la publicación del Informe Anual de Desempeño Social de la Cadena (con KPIs de cumplimiento laboral) para transparentar la evolución de la equidad y el impacto de los estándares avanzados ante los stakeholders, e instrumentar de manera operativa la documentación de los programas de mejora conjunta con proveedores para guiar el cierre técnico de brechas, el codiseño de beneficios y el despliegue del canal de denuncias accesible para toda la fuerza laboral externa.","Diseñar un programa de mentoría sectorial y alianzas con expertos en derechos humanos para transferir capacidades avanzadas de equidad, diversidad y salario digno hacia los proveedores indirectos (Tier 2 y Tier 3), e institucionalizar auditorías participativas y canales de escucha activa co-gestionados con la fuerza laboral externa para consolidar una gobernanza social transparente y de vanguardia en toda la red productiva."],"s":"ODS 12, ODS 16, Sistema B, UE ESRS S2"},{"id":"cadena-9","sub":"","t":"Gestión ambiental en proveedores","d":"El indicador evalúa el nivel de diligencia debida y la capacidad de la empresa para impulsar la gestión ambiental en su cadena de suministro, un requisito esencial de la Responsabilidad Social Empresaria (RS&S) para reducir el impacto ambiental de toda la red.","l":["No se incluyen requisitos ambientales en los contratos o evaluaciones.","La empresa solicita certificaciones o evidencias del cumplimiento ambiental de sus proveedores.","La empresa evalúa el desempeño ambiental y ofrece apoyo técnico para su mejora.","La empresa establece objetivos ambientales comunes con sus proveedores y monitorea el desempeño ambiental de la cadena completa."],"a":["Formalizar el procedimiento de revisión documental de cumplimiento legal para estandarizar los criterios de control interno y validar sistemáticamente la vigencia de las autorizaciones de los socios comerciales, e instrumentar de manera operativa el registro de las certificaciones o licencias ambientales recopiladas para centralizar la evidencia técnica de la cadena, asegurando que los nuevos contratos comerciales obliguen al proveedor a reportar inmediatamente cualquier incidente hídrico o ecológico.","Implementar de manera operativa la Matriz de Evaluación de Desempeño Ambiental de proveedores para auditar y ponderar periódicamente el impacto ecológico real de los socios comerciales, e instrumentar el informe de apoyo técnico o capacitación brindada para la mejora ambiental para registrar las horas de acompañamiento técnico, estructurar los diagnósticos de eficiencia en proveedores de alto consumo y documentar la reconversión sostenible de la cadena.","Formalizar el Convenio de Objetivos Ambientales Comunes firmado con proveedores clave para institucionalizar los compromisos obligatorios de descarbonización y circularidad en el abastecimiento, e instrumentar operativamente la elaboración y difusión del Informe Anual de Monitoreo Ambiental de la cadena para reportar con transparencia los resultados de desempeño y la medición de la huella de carbono (Alcance 3), apalancando estos datos en las decisiones comerciales de la organización.","Co-diseñar ecosistemas de simbiosis industrial y laboratorios de descarbonización acelerada junto a proveedores clave para valorizar residuos cruzados y neutralizar de raíz las emisiones de Alcance 3, e institucionalizar un fondo de coinversión verde que financie la transición energética y la reconversión tecnológica de las Mipymes más críticas de la red de suministro."],"s":"ODS 8, ODS 12, Sistema B, UE ESRS S2"},{"id":"cadena-10","sub":"","t":"Innovación compartida en la cadena de valor","d":"El indicador evalúa el grado de colaboración e interacción de la empresa con sus socios y proveedores para fomentar la innovación y el desarrollo tecnológico, elementos cruciales para mejorar el desempeño en sostenibilidad y aumentar la competitividad de la cadena.","l":["No se promueve la innovación con proveedores o socios.","La empresa impulsa proyectos colaborativos orientados a la eficiencia o la innovación de procesos.","La empresa desarrolla proyectos de innovación sostenible con proveedores y aliados estratégicos.","La empresa consolida ecosistemas de innovación abierta con enfoque de sostenibilidad, generando beneficios mutuos y medibles."],"a":["Formalizar el Acta de inicio del proyecto piloto de eficiencia (con objetivo y métricas) para institucionalizar el alcance, las metas de reducción de residuos y los indicadores de éxito acordados con los proveedores clave, e instrumentar el registro del presupuesto asignado para garantizar y auditar el respaldo financiero o el soporte técnico requerido en la ejecución física de las pruebas piloto, apalancando estas acciones con el despliegue de talleres conjuntos para resolver desafíos operativos comunes.","Formalizar el Convenio de Co-creación (con cláusulas de PI) para blindar legalmente el intercambio de conocimientos avanzados y establecer los términos de confidencialidad con los socios estratégicos, e instrumentar de manera operativa la matriz de seguimiento de KPIs de impacto de la innovación para evaluar sistemáticamente la rentabilidad económica y el beneficio ecológico real de los desarrollos conjuntos.","Formalizar el Manual de Operación del Ecosistema de Innovación Abierta para estandarizar las reglas de gobernanza, la propiedad intelectual compartida y la interacción digital entre los diversos stakeholders, e instrumentar la elaboración del Informe Anual de Medición de Beneficios Mutuos y Sistémicos (proyectado públicamente como un Informe de Innovación Compartida) para transparentar ante el mercado el impacto socioambiental y económico generado, consolidando el liderazgo de la organización y atrayendo nuevos aliados estratégicos.","Institucionalizar un modelo de financiamiento o fondo de inversión de impacto (Corporate Venture Capital sustentable) enfocado en escalar comercial e industrialmente las innovaciones más maduras desarrolladas dentro del hub, y diseñar un programa global de transferencia tecnológica abierta que democratice los nuevos materiales y soluciones logísticas eficientes co-creadas, multiplicando la resiliencia operativa y el impacto positivo en todo el ecosistema productivo."],"s":"ODS 9, ODS 17, Sistema B, UE ESRS S2"},{"id":"cadena-11","sub":"","t":"Logística sostenible y distribución eficiente","d":"El indicador evalúa el grado de integración de la sostenibilidad en las actividades de transporte, logística y distribución, buscando reducir los impactos ambientales y sociales negativos asociados a la movilidad de productos y materias primas.","l":["No se gestionan impactos ambientales o sociales en la logística.","La empresa aplica acciones de optimización de rutas, cargas y consumo energético.","La empresa implementa políticas de logística sostenible y selecciona proveedores de transporte responsables.","La empresa gestiona integralmente la logística bajo criterios de eficiencia energética, reducción de emisiones y mejora continua."],"a":["Instrumentar de manera operativa el registro de KPIs de consumo de combustible por unidad para consolidar la línea base analítica y detectar ineficiencias en ruta, y formalizar el informe de optimización de rutas y cargas implementadas para documentar el impacto de la consolidación de envíos y el uso del software de ruteo. Asimismo, se debe coordinar el despliegue del programa de capacitación en conducción eficiente y mantenimiento preventivo, integrando formalmente los criterios de actualización de flota en las matrices de evaluación de proveedores de transporte.","Formalizar el Documento de la Política de Logística Sostenible para institucionalizar las directrices ambientales y socio-laborales que regulan la distribución, e instrumentar la matriz de evaluación periódica de proveedores de transporte para auditar sistemáticamente el desempeño energético de los transportistas clave. De manera complementaria, asegurar la integración de estos requisitos en las cláusulas contractuales y coordinar la ejecución del proyecto piloto con vehículos eléctricos o a gas en rutas cortas para evaluar su viabilidad operativa.","Desarrollar y estructurar la documentación del SGI que integra los KPIs ambientales y sociales en la logística para unificar bajo la norma ISO 9001 el control del consumo energético y las variables de bienestar laboral de los conductores, e instrumentar la elaboración del Informe Anual de Desempeño Logístico Sostenible para publicar con transparencia la Huella de Carbono de la Logística (Alcance 3). En paralelo, desplegar las herramientas tecnológicas de rastreo en tiempo real y formalizar acuerdos de distribución compartida con aliados estratégicos para optimizar el uso de la capacidad logística instalada.","Diseñar e implementar una estrategia a largo plazo para la reconversión y transición de la flota (propia y tercerizada) hacia tecnologías de cero emisiones (como vehículos eléctricos pesados o hidrógeno verde), e institucionalizar una red de logística colaborativa e inversa interempresarial que elimine por completo los trayectos de retorno en vacío (\"kilómetros muertos\"), apalancando el uso de centros de distribución inteligentes operados con energía 100% renovable."],"s":"ODS 9, ODS 12, ODS 13, Sistema B, UE ESRS E1, ISO 14001:2026"}]},{"id":"comunidad","name":"Comunidad","dim":"Social","foco":"Impacto territorial, derechos humanos, alianzas y participación social.","ind":[{"id":"comunidad-1","sub":"","t":"Relación con la comunidad local","d":"El indicador evalúa el compromiso de la empresa con la participación y el desarrollo de la comunidad, buscando establecer una interacción dinámica y transparente con los grupos locales y sus representantes, un elemento clave para el fortalecimiento de la sociedad civil.","l":["No existen vínculos ni diálogo con la comunidad del entorno.","La empresa participa en actividades comunitarias y mantiene canales de comunicación con actores locales.","La empresa gestiona de forma estructurada sus relaciones comunitarias, atendiendo inquietudes y promoviendo la participación mutua.","La empresa mantiene alianzas duraderas con la comunidad, integrando sus aportes en la planificación y desarrollo de proyectos sostenibles."],"a":["Confeccionar el registro formal del Mapeo de Actores Comunitarios y estructurar el listado de las primeras interacciones registradas para garantizar la trazabilidad, la transparencia y el seguimiento de los canales de diálogo establecidos.","Desarrollar e implementar el Manual del Proceso de Gestión de Inquietudes Comunitarias y estructurar de manera operativa la matriz de seguimiento y respuesta a las inquietudes registradas para asegurar la trazabilidad, atención oportuna y resolución efectiva de los requerimientos del entorno.","Formalizar el Convenio de Alianza Estratégica Comunitaria y estructurar el informe de resultados de los proyectos de desarrollo sostenible co-creados para validar el impacto positivo y la continuidad de las iniciativas conjuntas.","Promover que los contratistas y proveedores clave adopten políticas alineadas de desarrollo local y contratación comunitaria, y habilitar un portal público e interactivo de impacto territorial que visibilice, de forma transparente, el avance de los proyectos co-creados, la resolución de inquietudes y el retorno social de la inversión en el entorno."],"s":"ODS 11, ODS 17, Sistema B, UE ESRS S3, ISO 26000"},{"id":"comunidad-2","sub":"","t":"Evaluación del impacto social","d":"El indicador evalúa la capacidad de la empresa para conocer, entender y gestionar los impactos que sus actividades provocan en el entorno territorial, buscando mitigar los efectos negativos y potenciar los positivos, lo cual es un eje central de la gestión socialmente responsable.","l":["No se evalúan los impactos sociales de la empresa.","La empresa evalúa de manera general los impactos positivos y negativos sobre la comunidad.","La empresa realiza diagnósticos o estudios de impacto social con indicadores y planes de mejora.","La empresa evalúa y monitorea sistemáticamente su desempeño social, integrando los resultados en la gestión estratégica y reportes públicos."],"a":["Elaborar la Matriz Cualitativa de Impactos Sociales e instrumentar el registro de las primeras consultas realizadas a la comunidad para garantizar la trazabilidad de la percepción local y dar un seguimiento estructurado a los efectos de la operación.","Desarrollar y consolidar el Informe del Diagnóstico o Estudio de Impacto Social (EIS) a partir de métricas cuantitativas y estructurar los Planes de Acción y Mitigación formalmente aprobados para asegurar la asignación de recursos y la ejecución efectiva de las medidas correctivas en la comunidad.","Elaborar de manera estructurada el Informe Anual de Monitoreo de Desempeño Social para medir la efectividad temporal de los KPIs de mitigación y coordinar la publicación de los resultados en el Reporte de Sostenibilidad institucional, garantizando una rendición de cuentas transparente y auditable frente a los grupos de interés.","Extender los lineamientos y metodologías de evaluación de impacto social a los subcontratistas y proveedores críticos que operan en el territorio, y consolidar una plataforma digital de datos abiertos que comparta con transparencia el monitoreo del desempeño social de la empresa, impulsando iniciativas conjuntas con aliados para maximizar la creación de valor compartido."],"s":"ODS 11, ODS 12, Sistema B, UE ESRS S3, ISO 26000"},{"id":"comunidad-3","sub":"","t":"Voluntariado corporativo","d":"El indicador se orienta a evaluar el nivel de involucramiento de los empleados en acciones sociales y ambientales, formalizando la práctica del trabajo voluntario como un mecanismo de Acción Social que fortalece la cultura y el compromiso de la empresa con la comunidad.","l":["No existen acciones de voluntariado.","La empresa organiza jornadas de voluntariado con objetivos definidos y registro de participantes.","La empresa desarrolla un programa de voluntariado corporativo con metas, seguimiento y alianzas locales.","La empresa integra el voluntariado a su estrategia de sostenibilidad, reconociendo y comunicando su impacto social y ambiental."],"a":["Diseñar e instrumentar el registro de participantes y horas de voluntariado para dar trazabilidad al esfuerzo del capital humano, y consolidar el informe simple de feedback de la jornada para capturar la percepción interna y optimizar el impacto de las próximas iniciativas sociales.","Desarrollar y aprobar el Manual del Prototipo del Programa de Voluntariado Corporativo (que integre los objetivos cuantificables y los convenios con aliados sociales o ambientales) y estructurar de forma operativa el registro continuo de las horas de voluntariado para dar seguimiento y trazabilidad al impacto del capital humano.","Coordinar la emisión del Informe Anual de Impacto del Voluntariado para consolidar los resultados y el impacto social y ambiental debidamente cuantificados, y formalizar la política de reconocimiento vinculada al voluntariado para incentivar, valorar y dar visibilidad al compromiso del capital humano más activo.","Promover programas conjuntos de voluntariado de competencias integrando a los proveedores y contratistas clave de la cadena de suministro, y consolidar un repositorio digital de acceso público que comparta de manera transparente las metodologías de impacto social desarrolladas y las lecciones aprendidas para inspirar a otras organizaciones del ecosistema."],"s":"ODS 11, ODS 17, Sistema B, UE ESRS S3"},{"id":"comunidad-4","sub":"","t":"Inversión social estratégica","d":"El indicador evalúa la Inversión Social Privada (ISP) de la empresa, es decir, el uso planificado, monitoreado y voluntario de recursos en proyectos sociales de interés público, buscando que el financiamiento de la acción social se estructure con la idea de maximizar sus impactos a largo plazo.","l":["No se destinan recursos a iniciativas sociales.","La empresa selecciona iniciativas sociales alineadas a su propósito y contexto territorial.","La empresa planifica y ejecuta programas de inversión social con indicadores de alcance y efectividad.","La empresa consolida una estrategia de inversión social integrada al negocio, con evaluación de impacto y comunicación de resultados."],"a":["Diseñar y formalizar la Política de Donaciones y Patrocinios (incorporando con claridad los criterios de alineación con el propósito de la empresa) y estructurar el registro de las iniciativas seleccionadas y su vinculación territorial para garantizar el orden, la trazabilidad y la justificación técnica de los fondos asignados.","Desarrollar y formalizar el Manual de Diseño e Implementación de Programas de ISP para estandarizar la planificación y ejecución de las intervenciones, y consolidar de forma operativa el registro de los indicadores de efectividad de los proyectos para garantizar la trazabilidad, la medición de resultados y la transparencia en la rendición de cuentas de los recursos asignados.","Desarrollar de manera estructurada el Informe de Evaluación de Impacto (SROI) de los programas socioeconómicos clave y coordinar la comunicación pública de los resultados y el valor generado para consolidar un posicionamiento transparente, auditable y de alto valor estratégico ante los grupos de interés.","Incentivar que los proveedores y contratistas críticos adopten criterios alineados de inversión social estratégica en sus respectivas zonas de influencia, y habilitar un ecosistema digital de libre acceso que comparta de manera transparente las metodologías de impacto desarrolladas, los aprendizajes clave y los modelos de valor compartido para potenciar el desarrollo sistémico de la industria."],"s":"ODS 8, ODS 11, ODS 17, Sistema B, UE ESRS S3"},{"id":"comunidad-5","sub":"","t":"Alianzas interinstitucionales","d":"El indicador evalúa el nivel de articulación y colaboración de la empresa con actores clave del entorno (gobierno, sector social, academia), buscando potenciar el impacto de sus acciones y el desarrollo sostenible regional, lo cual es parte fundamental de la Gestión de Acciones Sociales.","l":["No existen vínculos con instituciones del entorno.","La empresa participa en mesas, redes o proyectos colaborativos con otras organizaciones.","La empresa desarrolla alianzas formales con instituciones académicas, gubernamentales o sociales.","La empresa consolida alianzas estratégicas de largo plazo que potencian la innovación y el desarrollo sostenible regional."],"a":["Consolidar el listado de las redes en las que participa la empresa para mapear estratégicamente los espacios de influencia en la región, e instrumentar el registro de asistencia del representante a las mesas/redes para garantizar la continuidad de la participación, la transferencia interna de las oportunidades detectadas y la trazabilidad del compromiso institucional en el territorio.","Gestionar la firma y resguardo del Convenio o Acuerdo de Cooperación formal con las instituciones aliadas y estructurar de manera operativa el registro de los proyectos ejecutados bajo estos acuerdos para asegurar la trazabilidad, el cumplimiento de los hitos fijados y la transparencia en el desarrollo de las iniciativas conjuntas.","Instrumentar de forma operativa el registro de los Indicadores de Impacto Regional de las alianzas para evaluar con precisión el retorno social y de mercado en el entorno, y consolidar el Informe Anual de Alianzas que detalla su contribución a la innovación para transparentar el avance estratégico, justificar el despliegue de las soluciones conjuntas y robustecer la rendición de cuentas ante los grupos de interés.","Integrar activamente a los proveedores y contratistas clave en las mesas de innovación y proyectos de desarrollo tecnológico ejecutados junto con las universidades (como la UTN o la UNC) y el sector público, y habilitar una plataforma digital de acceso libre que difunda de manera transparente los casos de éxito, metodologías de gobernanza y soluciones de triple impacto validadas en conjunto para impulsar el aprendizaje colectivo en todo el entramado productivo local."],"s":"ODS 11, ODS 17, Sistema B, UE ESRS S3"},{"id":"comunidad-6","sub":"","t":"Inclusión económica","d":"El indicador evalúa el rol de la empresa como agente de desarrollo socioeconómico local, promoviendo oportunidades para grupos vulnerables o en desventaja económica, lo cual es fundamental para el Trabajo Decente y la Reducción de las Desigualdades a través de la inversión social estratégica.","l":["No se promueven oportunidades económicas para grupos vulnerables.","La empresa colabora con emprendimientos sociales o productivos del entorno.","La empresa desarrolla programas de inclusión económica con enfoque de género, juventud o diversidad.","La empresa consolida iniciativas sostenibles de inclusión económica, con resultados medibles y alianzas multisectoriales."],"a":["Formalizar el Registro de la colaboración con emprendimiento local mediante la firma de actas de acuerdo que establezcan el alcance y las condiciones del soporte no financiero brindado, y estructurar de manera operativa el listado de las horas de asesoramiento brindadas por el personal para medir la transferencia de capacidades y asegurar la trazabilidad del impacto socioeconómico generado en el entorno cercano.","Formalizar y aprobar el Documento del Programa de Inclusión Económica (delimitando con claridad los enfoques de género y juventud, las metodologías de formación y el mapa de aliados) y estructurar de manera operativa el registro de Indicadores de Resultado para auditar de forma continua las tasas de inserción laboral y el incremento de ingresos en las comunidades impactadas.","Instrumentar de manera operativa el Informe de Medición de Resultados de Inclusión para evaluar de forma rigurosa los indicadores de impacto social y auditar el Retorno Social de la Inversión (SROI) de los programas implementados, y gestionar la formalización del convenio de alianza multisectorial para el escalamiento de los programas con el fin de asegurar el respaldo institucional, cofinanciar el crecimiento de las iniciativas y garantizar su viabilidad financiera a largo plazo.","Extender los criterios de compras inclusivas y desarrollo de proveedores vulnerables a los contratistas principales de la compañía para multiplicar el derrame económico en el territorio, e institucionalizar un portal público de datos abiertos sobre innovación social que difunda de manera transparente las metodologías de medición (SROI), las lecciones aprendidas y los casos de éxito para dinamizar el ecosistema de la economía popular en toda la región."],"s":"ODS 5, ODS 8, ODS 10, Sistema B, UE ESRS S3"},{"id":"comunidad-7","sub":"","t":"Comunicación y transparencia hacia la comunidad","d":"El indicador evalúa el nivel de transparencia y rendición de cuentas (Accountability) de la empresa hacia la sociedad y sus grupos de interés externos, asegurando que la información sobre sus programas e impactos sea accesible y periódica.","l":["No se comunica información sobre la empresa ni sus impactos.","La empresa comunica avances y resultados sociales a través de medios locales o propios.","La empresa publica información sobre sus programas e impactos de manera accesible y periódica.","La empresa garantiza la transparencia y rendición de cuentas, reportando públicamente sus impactos sociales con verificación externa."],"a":["Consolidar el listado de los medios utilizados para mapear estratégicamente los canales de difusión y alcance en Córdoba capital e interior, e instrumentar de manera operativa el registro de las publicaciones externas (capturas de pantalla, notas de prensa) para garantizar la trazabilidad de la comunicación, auditar la frecuencia de las difusiones y salvaguardar la transparencia de la rendición de cuentas ante la comunidad de influencia.","Coordinar la elaboración y publicación del Informe Anual de Programas Sociales en una sección fija y de libre acceso del sitio web de la compañía para institucionalizar la transparencia corporativa, e instrumentar de manera operativa el registro de los Indicadores de Alcance para garantizar la trazabilidad de los montos invertidos, el volumen de beneficiarios alcanzados y el impacto real transferido a la sociedad.","Gestionar la obtención del Certificado de Verificación Externa del Reporte Social mediante la articulación con una entidad auditora independiente que valide la confiabilidad de las métricas recopiladas, y coordinar la publicación del Reporte que detalla la gestión de impactos (positivos y negativos) en plataformas de acceso público para asegurar una rendición de cuentas genuina, fortalecer la reputación institucional y activar canales formales de escucha y mejora continua con el entorno.","Institucionalizar paneles sectoriales y mesas de diálogo continuas con líderes comunitarios, académicos y referentes de sustentabilidad para co-evaluar los resultados del Reporte Social y receptar retroalimentación directa, e implementar un portal digital de datos abiertos donde se compartan en tiempo real los avances de los indicadores de impacto y las metodologías de mitigación de externalidades negativas, impulsando un estándar de gobernanza abierta para todo el ecosistema empresarial local."],"s":"ODS 12, ODS 16, ODS 17, Sistema B, UE ESRS S3"},{"id":"comunidad-8","sub":"","t":"Gestión de reclamos y expectativas de la comunidad","d":"El indicador evalúa la existencia de mecanismos y canales de diálogo para recibir, registrar y gestionar las inquietudes y reclamos de la comunidad del entorno, lo cual es fundamental para el Gerenciamiento del Impacto de la empresa y la mejora de la conducta.","l":["No existen mecanismos para recibir reclamos o sugerencias del entorno.","La empresa establece mecanismos formales para registrar y dar respuesta a reclamos comunitarios.","La empresa analiza los reclamos y los integra como insumo para la mejora continua.","La empresa mantiene un sistema transparente de gestión de reclamos con seguimiento, respuesta y comunicación pública de resultados."],"a":["Oficializar y aprobar el Procedimiento Documentado de Recepción y Respuesta de Reclamos para estandarizar las ventanas de tiempo de resolución, los flujos de escalamiento internos y las pautas de atención con enfoque ético, e instrumentar de manera operativa el registro de la comunicación de los canales para certificar que las vías de contacto han sido debidamente difundidas ante los grupos de interés de la comunidad y asegurar la transparencia del sistema de escucha activa.","Coordinar la elaboración periódica del Informe de Análisis de Reclamos para tipificar las inquietudes del entorno, identificar con precisión sus causas raíz y proveer a la organización de un diagnóstico claro sobre sus externalidades, e instrumentar de manera operativa el registro de los Planes de Acción Correctivos implementados para asegurar el seguimiento técnico de las soluciones adoptadas, auditar la efectividad de las medidas de mitigación y garantizar el cierre efectivo de cada caso reportado por la comunidad.","Formalizar y aplicar la política de confidencialidad del sistema para salvaguardar la identidad de los reclamantes, asegurar la neutralidad en el tratamiento de los datos y mitigar cualquier riesgo de represalias, y coordinar la publicación del Informe Anual de Gestión de Reclamos en los canales institucionales para transparentar ante el público general y los grupos de interés la efectividad, los tiempos de respuesta y las soluciones comunitarias adoptadas por la empresa.","Extender la obligatoriedad de los canales de escucha y los estándares de resolución de quejas a los contratistas y subcontratistas críticos que operan en el territorio de influencia para asegurar una gestión de impactos homogénea y libre de desatenciones, e institucionalizar un consejo comunitario permanente de co-diseño relacional, donde representantes vecinales y directivos de la empresa evalúen de forma conjunta la efectividad del sistema, compartan lecciones aprendidas y diseñen preventivamente mejoras en los procesos operativos del negocio."],"s":"ODS 11, ODS 16, Sistema B, UE ESRS S3, ISO 26000"},{"id":"comunidad-9","sub":"","t":"Educaci
