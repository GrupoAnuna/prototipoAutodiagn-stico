:root{
  --ink:#333333; --ink-2:#4a4a4a; --muted:#706F6F; --teal:#336666; --teal-d:#264d4d; --mint:#33CC99; --lime:#99FF66;
  --bg:#F2F4F3; --surface:#FFFFFF; --line:#E0E4E2; --line-2:#C9D0CD; --side:#333333;
  --m0:#FF0098; --m1:#33CCFF; --m2:#33CC99; --m3:#336666;
  --ok:#1f8f63; --bad:#c4006f;
  --fd:'Poppins','Helvetica Neue',Helvetica,Arial,sans-serif;
  --fb:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --r-s:6px; --r-m:12px;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
#app{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.2;color:var(--ink)}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:#fff;padding:8px 12px;border-radius:6px}
.skip:focus{left:8px}

/* ---------- Buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;font-family:var(--fd);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:rgba(51,102,102,.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);border-radius:var(--r-s);padding:9px 11px;background:#fff;color:var(--ink);font-size:14px}
.input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(51,204,153,.25)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}

/* ---------- Login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,1fr)}
.login-art{position:relative;background:var(--side);color:#fff;overflow:hidden;padding:56px;display:flex;flex-direction:column;gap:clamp(40px,14vh,140px)}
.login-art .iso{position:absolute;right:-12%;bottom:-18%;width:min(56%,520px)}
.login-art .product{font-family:var(--fd);font-size:15px;font-weight:500;color:rgba(255,255,255,.75)}
.claim{font-family:var(--fd);font-weight:300;font-size:clamp(34px,4.4vw,60px);line-height:1.08;letter-spacing:-.02em;max-width:11ch;position:relative;z-index:1}
.claim b{font-weight:700;display:block}
.login-side{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,6vw,80px);background:var(--surface);gap:40px}
.login-form{display:flex;flex-direction:column;gap:16px;max-width:400px;width:100%}
.login-form h1{font-size:26px}
.login-form .lead{color:var(--muted);margin-top:-6px}
.form-error{color:var(--bad);font-size:14px;min-height:1.2em}
.demo{border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--muted)}
.demo summary{cursor:pointer;font-weight:500;color:var(--ink)}
.demo ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.demo button{all:unset;cursor:pointer;color:var(--teal);text-decoration:underline}
.login-side .pb{width:220px;max-width:70%}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:#fff;display:flex;flex-direction:column;padding:28px 18px 22px;position:sticky;top:0;height:100vh;height:100dvh}
.side .product{font-family:var(--fd);font-size:15px;line-height:1.25;padding:0 10px 26px;font-weight:300}
.side .product b{font-weight:600;display:block;font-size:17px}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.side nav .grp{font-size:12px;color:rgba(255,255,255,.5);padding:16px 10px 6px}
.side nav a{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.82);text-decoration:none;padding:10px;border-radius:8px;font-family:var(--fd);font-size:14px}
.side nav a svg{width:18px;height:18px;flex:none;opacity:.8}
.side nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.side nav a[aria-current="page"]{background:rgba(51,204,153,.16);color:#fff}
.side nav a[aria-current="page"] svg{color:var(--mint);opacity:1}
.side-foot{border-top:1px solid rgba(255,255,255,.12);padding:16px 10px 0;display:flex;flex-direction:column;gap:14px}
.who{font-size:13px;line-height:1.35}
.who small{color:rgba(255,255,255,.55)}
.side-foot .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25);align-self:flex-start}
.side-foot .pb{width:150px;opacity:.9}
.topbar{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.viewing{background:var(--lime);color:var(--ink);padding:10px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.viewing .btn{background:transparent;border-color:rgba(0,0,0,.25)}
.page{padding:36px 40px 64px;max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.page-head .sub{color:var(--muted);margin-top:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;color:var(--muted);font-size:12px;flex-wrap:wrap}

/* ---------- Panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:24px}
.panel + .panel{margin-top:20px}
.cols > .panel{margin-top:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.panel-head p{color:var(--muted);font-size:13px}
.cols{display:grid;gap:20px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.stack{display:flex;flex-direction:column;gap:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;background:#EEF1F0;color:var(--ink-2);font-family:var(--fd);white-space:nowrap}
.chip.done{background:rgba(51,204,153,.16);color:#1d6b52}
.chip.prog{background:rgba(51,204,255,.16);color:#1b6b87}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.delta{font-family:var(--fd);font-weight:600;font-size:13px}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}.delta.eq{color:var(--muted)}
.bar{height:8px;background:#E8ECEA;border-radius:99px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--mint);border-radius:99px}
.empty{text-align:left;padding:48px;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;position:relative;overflow:hidden}
.empty .iso{width:180px;opacity:.95}
.empty h2{font-size:24px;margin-bottom:8px}
.empty p{color:var(--muted);max-width:52ch;margin-bottom:20px}

/* ---------- Score hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0;padding:0;overflow:hidden}
.hero-score{padding:32px;background:var(--side);color:#fff;display:flex;flex-direction:column;gap:18px;position:relative}
.hero-score .lbl{font-family:var(--fd);font-size:14px;color:rgba(255,255,255,.7)}
.big{font-family:var(--fd);font-weight:300;font-size:96px;line-height:.9;letter-spacing:-.04em}
.big small{font-size:36px;font-weight:300;margin-left:4px;color:rgba(255,255,255,.6)}
.band{font-family:var(--fd);font-size:22px;font-weight:600;color:var(--lime)}
.hero-score .msg{color:rgba(255,255,255,.85);max-width:46ch}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.scale span{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.scale span.on{background:var(--lime)}
.scale-l{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:rgba(255,255,255,.55)}
.hero-stats{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:28px;margin-top:auto}
.hero-stats b{display:block;font-family:var(--fd);font-size:22px;font-weight:600;color:#fff}
.hero-stats span{font-size:12px;color:rgba(255,255,255,.6)}
.hero-chart{padding:20px 24px;display:flex;flex-direction:column;justify-content:center}

.hero-score .delta.up{color:var(--lime)}.hero-score .delta.down{color:#ff7ac8}.hero-score .delta.eq{color:#fff}
.hero-stats b .delta{font-size:22px}
/* ---------- Charts ---------- */
.radar{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.radar text{font-family:var(--fd);font-size:12px;fill:var(--ink-2)}
.radar .ring{fill:none;stroke:var(--line)}
.radar .axis{stroke:var(--line)}
.radar .tick{font-size:10px;fill:#9a9a9a}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.line-chart{width:100%;height:auto;display:block}
.line-chart text{font-family:var(--fd);font-size:12px;fill:var(--muted)}
.cb{display:grid;gap:14px}
.cb-row{display:grid;grid-template-columns:170px minmax(0,1fr) 64px;gap:14px;align-items:center;font-size:14px}
.cb-name{font-family:var(--fd);font-size:13px;font-weight:500}
.cb-track{position:relative;height:22px;background:#EEF1F0;border-radius:4px}
.cb-cur{position:absolute;left:0;top:4px;bottom:4px;background:var(--mint);border-radius:3px}
.cb-base{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--teal)}
.cb-val{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-family:var(--fd);color:var(--ink)}
.cb-row .delta{text-align:right}
.ejes-list{display:grid;gap:16px}
.ej{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:6px 14px;align-items:center}
.ej h4{font-size:14px;font-weight:500}
.ej .pct{font-family:var(--fd);font-weight:600;text-align:right}
.ej .bar{grid-column:1/-1}
.ej .meta{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}

/* heatmap */
.heat{display:grid;gap:10px}
.heat-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;align-items:center}
.heat-row b{font-family:var(--fd);font-size:13px;font-weight:500}
.cells{display:flex;flex-wrap:wrap;gap:4px}
.cell{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-family:var(--fd);font-weight:600;color:#fff;cursor:default;border:0;padding:0}
.cell.na{background:#E6EAE8;color:#9aa3a0}
.l0{background:var(--m0)}.l1{background:var(--m1);color:#0d3b4a}.l2{background:var(--m2);color:#0e3d2e}.l3{background:var(--m3)}
.lv-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.lv-legend span{display:inline-flex;gap:6px;align-items:center}
.lv-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:6px 0 10px}
.dist span{display:block;height:100%}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--fd);font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:var(--fd);white-space:nowrap}
.tbl .name{font-weight:600;font-family:var(--fd)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:20px 22px}
.kpi b{display:block;font-family:var(--fd);font-weight:500;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}

/* cycles */
.cycles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.cycle{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:22px;display:flex;flex-direction:column;gap:14px}
.cycle .yr{font-family:var(--fd);font-size:40px;font-weight:300;letter-spacing:-.03em;line-height:1}
.cycle .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cycle .actions{margin-top:auto}

/* ---------- Questionnaire ---------- */
.qhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 0 12px;margin:-18px 0 18px;border-bottom:1px solid var(--line)}
.qprog{display:flex;align-items:center;gap:14px;margin:12px 0 14px;font-size:13px;color:var(--muted)}
.qprog .bar{flex:1;max-width:420px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;background:var(--surface);text-decoration:none;color:var(--ink);font-family:var(--fd);font-size:13px;white-space:nowrap}
.tab .cnt{color:var(--muted);font-size:12px}
.tab[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab[aria-current="page"] .cnt{color:rgba(255,255,255,.7)}
.tab.full .cnt{color:var(--ok)}
.tab[aria-current="page"].full .cnt{color:var(--lime)}
.eje-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.eje-intro h2{font-size:24px}
.eje-intro p{color:var(--muted);max-width:62ch;margin-top:6px}
.qlist{display:flex;flex-direction:column;gap:18px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:24px}
.q.answered{border-color:var(--line-2)}
.q header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.q-num{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--teal);background:rgba(51,102,102,.08);border-radius:6px;padding:3px 8px;margin-top:1px}
.q h3{font-size:17px}
.q-sub{font-size:12px;color:var(--muted);margin-top:2px}
.q-desc{color:var(--ink-2);margin:12px 0 18px;max-width:80ch;font-size:14px}
.ladder{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.step{position:relative;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:14px 14px 16px;cursor:pointer;background:#FAFBFB;transition:border-color .15s,background .15s;font-size:13.5px;line-height:1.45}
.step::before{content:"";height:4px;border-radius:2px;background:#E1E6E4;width:calc(25% * (var(--n) + 1))}
.step input{position:absolute;opacity:0;pointer-events:none}
.step:hover{border-color:var(--line-2);background:#fff}
.step-head{display:flex;justify-content:space-between;gap:8px;font-family:var(--fd);font-size:12px}
.step-n{font-weight:600}
.step-name{color:var(--muted)}
.step.sel{background:#fff;border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.step.sel::before{background:var(--c)}
.step:has(input:focus-visible){outline:3px solid var(--mint);outline-offset:2px}
.step.disabled{cursor:default}
.s0{--c:var(--m0);--n:0}.s1{--c:var(--m1);--n:1}.s2{--c:var(--m2);--n:2}.s3{--c:var(--m3);--n:3}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.std{font-size:13px;color:var(--muted)}
.std summary{cursor:pointer}
.std p{margin-top:6px}
.q-state{font-size:12px;font-family:var(--fd)}
.q-state.ok{color:var(--ok)}
.q-state.pend{color:var(--muted)}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap;align-items:center}
.notice{border-radius:var(--r-m);padding:14px 18px;background:rgba(51,204,255,.12);color:#16596f;font-size:14px;margin-bottom:20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.lock{background:#EEF1F0;color:var(--ink-2)}

/* ---------- Plan ---------- */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:#fff}
.seg a{padding:7px 16px;border-radius:999px;text-decoration:none;color:var(--ink);font-family:var(--fd);font-size:13px}
.seg a[aria-current="page"]{background:var(--ink);color:#fff}
.prio-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.prio-card{text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--c)}
.prio-card b{font-family:var(--fd);font-size:26px;font-weight:500;line-height:1.1}
.prio-card span{font-size:13px;color:var(--muted)}
.prio-card[aria-current="true"]{background:#fff;box-shadow:inset 0 0 0 2px var(--c)}
.p0{--c:var(--m0)}.p1{--c:var(--m1)}.p2{--c:var(--m2)}.p3{--c:var(--m3)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filters .input{width:auto;min-width:160px}
.filters input.input{min-width:220px}
.pgroup{margin-top:26px}
.pgroup h3{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pgroup h3 .dot{width:12px;height:12px}
.pitem{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:18px 20px;display:grid;gap:12px}
.pitem + .pitem{margin-top:10px}
.pitem .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.pitem h4{font-size:15px;font-weight:600}
.pitem .eje-tag{font-size:12px;color:var(--muted)}
.pitem .act{color:var(--ink-2);font-size:14px;max-width:90ch}
.pfields{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:10px}
.pfields label.f{font-size:12px}
.pfields .input{padding:7px 9px;font-size:13px}

/* gantt */
.gantt-wrap{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);overflow:auto;max-height:72vh;position:relative}
.g{--cw:26px;--lw:300px;min-width:calc(var(--lw) + var(--cw) * 48)}
.g-row{display:flex;min-height:44px;border-bottom:1px solid #EEF1F0}
.g-label{position:sticky;left:0;z-index:2;width:var(--lw);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:8px 14px;display:flex;flex-direction:column;justify-content:center;font-size:13px;line-height:1.3;cursor:pointer}
.g-label:hover b{color:var(--teal)}
.g-label b{font-weight:500;font-family:var(--fd);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-label small{color:var(--muted);font-size:11px}
.g-track{position:relative;flex:1;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--cw) - 1px),#F1F3F2 calc(var(--cw) - 1px),#F1F3F2 var(--cw)),repeating-linear-gradient(to right,transparent 0,transparent calc(var(--cw)*12 - 1px),#DCE1DF calc(var(--cw)*12 - 1px),#DCE1DF calc(var(--cw)*12))}
.g-head{position:sticky;top:0;z-index:4;background:var(--surface)}
.g-head .g-row{min-height:0;border-bottom:1px solid var(--line)}
.g-head .g-label{z-index:5;cursor:default;font-family:var(--fd);font-size:12px;color:var(--muted)}
.g-years,.g-months{display:flex}
.g-years div{width:calc(var(--cw)*12);flex:none;font-family:var(--fd);font-weight:600;font-size:13px;padding:8px 10px;border-right:1px solid #DCE1DF}
.g-months div{width:var(--cw);flex:none;text-align:center;font-size:10.5px;color:var(--muted);padding:5px 0}
.g-group .g-label{background:#F6F8F7;cursor:default;font-family:var(--fd);font-weight:600;font-size:13px;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px}
.g-group .g-track{background:#F6F8F7}
.g-group{min-height:36px}
.g-bar{position:absolute;top:9px;bottom:9px;border-radius:6px;background:var(--c);cursor:grab;touch-action:none;display:flex;align-items:center;padding:0 10px;color:#fff;font-size:11px;font-family:var(--fd);font-weight:500;white-space:nowrap;overflow:hidden;min-width:var(--cw);user-select:none}
.g-bar.p1,.g-bar.p2{color:#103d33}
.g-bar.dragging{cursor:grabbing;opacity:.85;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.g-bar.st-completada{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px)}
.g-handle{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize}
.g-handle::after{content:"";position:absolute;right:3px;top:30%;bottom:30%;border-right:2px solid rgba(255,255,255,.7)}
.g-empty{position:absolute;top:9px;bottom:9px;left:8px;border:1px dashed var(--line-2);border-radius:6px;padding:0 12px;display:flex;align-items:center;font-size:12px;color:var(--muted);background:#fff;cursor:pointer}
.g-empty:hover{border-color:var(--teal);color:var(--teal)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--m0);z-index:1;pointer-events:none}
.g-hint{font-size:13px;color:var(--muted);margin:0 0 12px}

/* ---------- Dialog & toast ---------- */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));color:var(--ink);box-shadow:0 24px 64px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(30,35,34,.55)}
.dlg{padding:28px;display:flex;flex-direction:column;gap:16px}
.dlg h2{font-size:20px}
.dlg .dlg-sub{color:var(--muted);font-size:14px;margin-top:-8px}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;padding-bottom:env(safe-area-inset-bottom,0px)}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s ease-out}
.toast.err{background:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.print-only{display:none}


/* ---------- v2: cuestionario de a una ---------- */
.q-ask{font-family:var(--fd);font-size:13px;font-weight:500;color:var(--teal);margin:-6px 0 10px}
.qfocus{max-width:880px}
.qdots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.qdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-size:12px;text-decoration:none;color:var(--muted);background:#fff;border:1px solid var(--line-2)}
.qdot.on{color:#fff;border-color:transparent}
.qdot.on.l0{background:var(--m0)}.qdot.on.l1{background:var(--m1)}.qdot.on.l2{background:var(--m2)}.qdot.on.l3{background:var(--m3)}
.qdot.on.l1,.qdot.on.l2{color:#0e3d2e}
.qdot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.q-focus{padding:28px}
.q-focus h3{font-size:20px}
.q-focus .q-desc{font-size:15px}
.ladder.vertical{grid-template-columns:1fr;gap:8px}
.ladder.vertical .step{flex-direction:row;align-items:center;gap:16px;padding:14px 16px;font-size:14.5px}
.ladder.vertical .step::before{display:none}
.ladder.vertical .step-head{flex-direction:column;align-items:flex-start;gap:2px;min-width:118px;flex:none}
.ladder.vertical .step{border-left:5px solid #E1E6E4}
.ladder.vertical .step.sel{border-left-color:var(--c)}
kbd{font-family:var(--fd);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 6px;color:var(--muted);background:#fff;margin-bottom:4px}
.step.sel kbd{border-color:var(--c);color:var(--ink)}
.done-eje{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;padding:36px;max-width:880px}
.done-mark{width:64px;height:64px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:30px;font-weight:700;color:var(--ink)}
/* ---------- v2: plan ---------- */
.kpis3{grid-template-columns:repeat(3,minmax(0,1fr))}
.step-card{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px}
.sc-n{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:600}
.sc-meta{font-size:12px;color:var(--muted);font-family:var(--fd)}
.step-card h4{font-size:16px;margin:2px 0 6px}
.step-card .act{color:var(--ink-2);font-size:14px;max-width:80ch}
.sc-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.sc-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.eje-acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.eje-acc summary{list-style:none;display:grid;grid-template-columns:36px minmax(0,1fr) 220px;gap:14px;align-items:center;padding:16px 20px;cursor:pointer}
.eje-acc summary::-webkit-details-marker{display:none}
.ea-n{width:32px;height:32px;border-radius:8px;background:rgba(51,102,102,.1);color:var(--teal);display:grid;place-items:center;font-family:var(--fd);font-weight:600}
.ea-name{font-family:var(--fd);font-weight:600;font-size:15px}
.ea-prog{display:flex;flex-direction:column;gap:6px}
.eje-acc[open] summary{border-bottom:1px solid var(--line)}
.ea-body{padding:6px 12px 12px}
.ea-sub{font-family:var(--fd);font-size:12px;color:var(--muted);margin:14px 8px 4px}
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) 170px 140px auto;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid #EEF1F0}
.prow:last-child{border-bottom:0}
.prow-n{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--teal);text-align:center}
.prow-main{display:flex;flex-direction:column;min-width:0}
.prow-main b{font-family:var(--fd);font-weight:500;font-size:14px}
.prow-act{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow.st-completada .prow-main b{text-decoration:line-through;color:var(--muted)}
.prow.maint .prow-n{color:var(--muted)}
.input.sm{padding:6px 8px;font-size:13px}
.mini-step{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid #EEF1F0}
.mini-step .dot{margin-top:6px}
.mini-step b{display:block;font-family:var(--fd);font-weight:500;font-size:14px}
.g-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
button.g-label{border:0;border-right:1px solid var(--line);text-align:left;font:inherit;color:inherit;width:var(--lw)}
.caret{display:inline-block;width:14px;color:var(--muted)}
.g-span{position:absolute;top:50%;height:6px;transform:translateY(-50%);border-radius:3px;background:rgba(51,102,102,.28)}
.g-bar.l0{--c:var(--m0)}.g-bar.l1{--c:var(--m1);color:#0d3b4a}.g-bar.l2{--c:var(--m2);color:#0e3d2e}.g-bar.l3{--c:#C9D6D3;color:#264d4d}
.g-maint .g-bar{top:15px;bottom:15px;font-size:10px}
.g-bar.st-completada{opacity:.55}
@media (max-width:860px){
  .kpis3{grid-template-columns:1fr}
  .step-card{grid-template-columns:36px minmax(0,1fr)}
  .sc-actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
  .eje-acc summary{grid-template-columns:32px minmax(0,1fr)}
  .ea-prog{grid-column:1/-1}
  .prow{grid-template-columns:26px minmax(0,1fr);row-gap:6px}
  .prow-when,.prow select,.prow .btn{grid-column:2}
  .ladder.vertical .step{flex-direction:column;align-items:flex-start;gap:6px}
  .done-eje{grid-template-columns:1fr;padding:24px}
  .qfocus .qnav .small{display:none}
}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .hero{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pfields{grid-template-columns:1fr 1fr}
  .pfields label.f:first-child{grid-column:1/-1}
}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-art{min-height:300px;padding:32px;gap:40px}
  .login-art .iso{width:150px;right:-30px;bottom:-36px}
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:50;transform:translateX(-100%);transition:transform .2s;padding-top:calc(28px + env(safe-area-inset-top,0px))}
  .app.nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--side);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:20}
  .topbar .product{font-family:var(--fd);font-size:14px;font-weight:500}
  .topbar button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px}
  .page{padding:24px 18px 48px}
  .viewing{padding:10px 18px}
  .ladder{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .prio-sum{grid-template-columns:1fr 1fr}
  .cb-row{grid-template-columns:110px minmax(0,1fr) 56px}
  .heat-row{grid-template-columns:1fr}
  .empty{grid-template-columns:1fr}
  .empty .iso{display:none}
  .g{--lw:200px}
  .qhead{position:static}
}
@media (max-width:520px){
  .ladder{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .big{font-size:72px}
  .hero-stats{grid-template-columns:repeat(2,auto)}
  .pfields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Print ---------- */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:12px}
  .side,.topbar,.viewing,.no-print,.toasts,.filters,.seg{display:none!important}
  .app{display:block}
  .page{padding:0;max-width:none}
  .print-only{display:flex!important;justify-content:space-between;align-items:center;border-bottom:1px solid #ccc;padding-bottom:10px;margin-bottom:18px}
  .print-only img{height:34px}
  .panel,.q,.pitem,.kpi{break-inside:avoid;border-color:#ddd}
  .hero-score{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cell,.bar span,.cb-cur,.dist span,.g-bar,.prio-card{text-decoration:none;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .gantt-wrap{max-height:none;overflow:visible}
}

<script>
'use strict';
/* =====================================================================
   Autodiagnóstico de Sostenibilidad · Aero Regenerativo
   Prototipo funcional. Todos los datos viven en el navegador (localStorage)
   a través del objeto DB, que es el único punto a reemplazar para conectar
   un backend real (ver README).
   ===================================================================== */

const EJES = [{"id":"estrategia","name":"Estrategia sostenible","dim":"Institucional","foco":"Integración estratégica, propósito, planificación y monitoreo.","ind":[{"id":"estrategia-1","sub":"","t":"Propósito y compromiso con la sostenibilidad","d":"El indicador evalúa el grado en que la sostenibilidad se encuentra arraigada en la misión y estrategia de la empresa, un aspecto crucial para la Integración Estratégica de la RS&S.","l":["No existe una declaración de propósito ni compromiso explícito con la sostenibilidad.","La empresa comunica públicamente su compromiso con la sostenibilidad y promueve su cumplimiento en la gestión interna.","La empresa integra la sostenibilidad en su misión, visión y valores, vinculándola a objetivos estratégicos.","La empresa consolida un propósito corporativo alineado con la sostenibilidad, que guía decisiones, relaciones y el impacto global de su negocio."],"a":["Formalización institucional y difusión pública del compromiso inicial de sostenibilidad de la empresa.","Integración formal de la sostenibilidad en la identidad estratégica básica y en las políticas internas de la organización.","Integración cultural profunda de la sostenibilidad como eje rector de las decisiones estratégicas y la gobernanza corporativa.","Consolidación de un desempeño sostenible maduro con ventajas competitivas y comerciales en el mercado internacional."],"s":"ODS 8, ODS 12, Sistema B, UE ESRS G1"},{"id":"estrategia-2","sub":"","t":"Gestión de partes interesadas","d":"El indicador se enfoca en la capacidad de la empresa para identificar, comprender y gestionar activamente sus relaciones con los grupos de interés (stakeholders), un proceso vital para la mejora continua de la conducta y la obtención de valor para el negocio.","l":["No se identifican los grupos de interés.","La empresa mantiene comunicación activa con grupos de interés clave para conocer sus expectativas.","La empresa gestiona las relaciones con todos sus grupos de interés de manera estructurada, documentando resultados.","La empresa aplica un proceso formal y continuo de diálogo, respuesta y evaluación de satisfacción de las partes interesadas."],"a":["Identificación y consulta directa con clientes y empleados para definir qué temas de sostenibilidad le importan al negocio.","Oficialización de los temas socioambientales críticos para el negocio mediante una metodología técnica y validada con los públicos clave.","Actualización sistemática de la matriz de impacto para dirigir la estrategia financiera, la gestión de riesgos y los reportes públicos del negocio.","Empresa referente del mercado que utiliza su transparencia y madurez socioambiental como su mayor ventaja comercial."],"s":"ODS 12, ODS 16, ODS 17, Sistema B, UE ESRS G1, ISO 9001"},{"id":"estrategia-3","sub":"","t":"Análisis de materialidad","d":"El indicador evalúa la capacidad de la empresa para identificar los asuntos más relevantes de la sostenibilidad que son cruciales tanto para su desempeño operativo como para sus grupos de interés, sirviendo de base para la planificación estratégica y la asignación de recursos.","l":["No se identifican los temas relevantes de sostenibilidad.","La empresa consulta informalmente a sus grupos de interés para validar temas prioritarios.","La empresa realiza un análisis de materialidad formal, documentado y alineado a estándares internacionales.","La empresa actualiza periódicamente su análisis de materialidad e integra los resultados en la toma de decisiones estratégicas."],"a":["Uso de criterios de sostenibilidad como requisito obligatorio para planificar el negocio y tomar decisiones comerciales clave.","Estructuración de un plan de sostenibilidad independiente con metas medibles, presupuesto propio y responsables asignados.","Fusión de la sostenibilidad con el presupuesto financiero, la operación diaria del negocio y los incentivos económicos de la dirección.","Empresa referente con triple impacto maduro, transparente y con alto valor reputacional en el mercado."],"s":"ODS 12, ODS 16, Sistema B, UE ESRS G1"},{"id":"estrategia-4","sub":"","t":"Plan de sostenibilidad o plan ESG","d":"El indicador se centra en la existencia y el nivel de formalización de la planificación de la sostenibilidad o ESG (Environmental, Social, and Governance), lo cual es fundamental para el monitoreo y el control de las acciones empresariales. Un plan estructurado asegura la continuidad del compromiso más allá de acciones puntuales.","l":["No existe planificación en materia de sostenibilidad.","La empresa define un plan de sostenibilidad con metas específicas y plazos de ejecución.","La empresa implementa un plan ESG con responsables, presupuesto y seguimiento de resultados.","La empresa actualiza periódicamente su plan ESG e integra su cumplimiento en los objetivos estratégicos de toda la organización."],"a":["Diseñar un taller directivo para estructurar el Plan de Sostenibilidad (ESG) inicial basado en el Análisis de Materialidad. Definir metas claras y ambiciosas por cada eje alineadas con los ODS 12 y 13. Formalizar el documento final y las actas del taller para asegurar el control institucional.","Asignar formalmente responsables, presupuesto específico y KPIs trimestrales para la ejecución del Plan ESG. Integrar las metas operativas al Sistema de Gestión de Calidad (ISO 9001) para asegurar su soporte. Implementar un Tablero de Control de Sostenibilidad para registrar y monitorear el avance institucional.","Programar la revisión periódica del Plan ESG e integrar sus metas a los objetivos comerciales de la empresa. Vincular los resultados a los incentivos de la alta dirección y realizar benchmarking sectorial. Documentar el proceso con Actas de Revisión Anual.","Medir y publicar los resultados del Plan ESG con transparencia para mantener la mejora continua. Colaborar con aliados estratégicos en innovación y extender las exigencias de impacto a la cadena de valor. Consolidar el desempeño maduro como una ventaja competitiva de mercado duradera."],"s":"ODS 12, ODS 13, Sistema B, UE ESRS G1, ISO 9001, ISO 14001"},{"id":"estrategia-5","sub":"","t":"Asignación de responsabilidades y recursos","d":"El indicador se orienta a evaluar el nivel de compromiso institucional para la ejecución efectiva de la estrategia de sostenibilidad, analizando la asignación de recursos financieros y humanos, un aspecto esencial de la Gobernanza.","l":["No hay responsables ni presupuesto asignado para sostenibilidad.","La empresa asigna recursos básicos (tiempo, presupuesto, capacitación) a las acciones del plan de sostenibilidad.","La empresa define responsabilidades claras, roles y recursos específicos para la ejecución de su estrategia ESG.","La empresa cuenta con una estructura formal y multidisciplinaria de sostenibilidad, con presupuesto, autoridad y rendición de cuentas."],"a":["Designar un referente de sostenibilidad con presupuesto básico y del 10% al 20% de su jornada laboral. Capacitar al líder en RSE&S (ODS 8) y promover un grupo de trabajo voluntario. Formalizar el rol mediante resolución interna y registrar las capacitaciones para dar soporte inicial.","Asignar roles por eje ESG con un presupuesto detallado por proyecto. Crear un Comité de Sostenibilidad formal en un organigrama funcional (ISO 9001) y evaluar las competencias del equipo.","Consolidar el Comité o Gerencia de Sostenibilidad con presupuesto estable, autoridad operativa y rendición de cuentas directa a la Junta. Vincular las metas ESG a los incentivos económicos de los líderes clave y publicar el informe anual de gestión.","Medir y publicar los resultados del Plan ESG con transparencia para mantener la mejora continua. Innovar en colaboración con aliados estratégicos y extender las exigencias de impacto a toda la cadena de valor. Consolidar este desempeño como una ventaja competitiva duradera."],"s":"ODS 8, Sistema B, UE ESRS G1, ISO 9001"},{"id":"estrategia-6","sub":"","t":"Gestión de riesgos y oportunidades de sostenibilidad","d":"El indicador mide la capacidad de la empresa para realizar una Gestión de Riesgos proactiva, identificando y evaluando cómo los factores ambientales, sociales y de gobernanza (ESG) pueden afectar su desempeño, su valor y la toma de decisiones de inversión.","l":["No se consideran los riesgos o oportunidades vinculados a la sostenibilidad.","La empresa evalúa la probabilidad e impacto de los principales riesgos de sostenibilidad.","La empresa implementa medidas preventivas y planes de acción para gestionar sus riesgos y oportunidades ESG.","La empresa integra la gestión de riesgos y oportunidades de sostenibilidad dentro de su planificación estratégica y de inversión."],"a":["Realizar un análisis cualitativo para estructurar una matriz inicial de riesgos y oportunidades ESG del negocio. Evaluar en un taller directivo la probabilidad e impacto potencial de estos factores de transición y reputación (ODS 13). Formalizar el registro mediante un acta de validación de la dirección.","Implementar planes de acción y medidas preventivas con responsables asignados para los riesgos ESG priorizados. Integrar este control en la cadena de suministro, monitorear periódicamente su efectividad (UE ESRS G1) y documentar el seguimiento.","Integrar los riesgos ESG en la planificación estratégica y el presupuesto CAPEX. Priorizar inversiones de mitigación, divulgar la estrategia bajo el marco TCFD en el Reporte de Sostenibilidad y vincular las metas a la remuneración directiva.","Medir y publicar con transparencia los resultados ESG para asegurar la mejora continua. Innovar junto a aliados estratégicos y extender el impacto a la cadena de valor, consolidando el desempeño como una ventaja competitiva de mercado duradera."],"s":"ODS 12, ODS 13, Sistema B, UE ESRS G1, ISO 9001, ISO 14001"},{"id":"estrategia-7","sub":"","t":"Integración de la sostenibilidad en la estrategia","d":"El indicador se orienta a evaluar si la empresa ha logrado la Integración Estratégica de la sostenibilidad, es decir, el grado en que la Responsabilidad Social y Sustentabilidad (RS&S) forma parte de su planeamiento y procesos decisorios, trascendiendo las acciones puntuales.","l":["No se considera la sostenibilidad en la planificación del negocio.","La empresa incluye objetivos ambientales, sociales o de gobernanza dentro de sus planes estratégicos.","La empresa desarrolla una estrategia de sostenibilidad con metas, indicadores y recursos definidos.","La empresa integra plenamente la sostenibilidad a su estrategia global, garantizando su coherencia con la planificación financiera y operativa."],"a":["Modificar los procesos de presupuesto anual, selección de proveedores y lanzamiento de productos para exigir un filtro obligatorio de impacto ambiental o social antes de darles aprobación final.","Diseñar el plan de sostenibilidad de la empresa fijando metas numéricas (ambientales, sociales y de gobernanza), asignando presupuesto específico y armando un comité de equipo interno para controlar los resultados mensualmente.","Unificar los presupuestos de inversión (Capex y Opex) con las metas de impacto y condicionar los bonos comerciales de los gerentes al cumplimiento de los objetivos de sostenibilidad de su área.","Auditar ambiental y socialmente a la cadena de proveedores clave y publicar un reporte anual de resultados de impacto para blindar la confianza comercial ante clientes y aliados estratégicos."],"s":"ODS 8, ODS 12, Sistema B, UE ESRS G1, ISO 9001"},{"id":"estrategia-8","sub":"","t":"Monitoreo y evaluación de desempeño","d":"El indicador evalúa la implementación de mecanismos formales para el Monitoreo y Control de la estrategia de sostenibilidad, lo cual es esencial para el aprendizaje continuo y la rendición de cuentas (accountability).","l":["No se realiza seguimiento de las acciones sostenibles.","La empresa establece indicadores de desempeño y evalúa periódicamente los resultados.","La empresa analiza los resultados frente a metas definidas e identifica áreas de mejora.","La empresa consolida un sistema de gestión basado en indicadores ESG, con revisión periódica, auditoría y comunicación de resultados."],"a":["Establecer un listado de KPIs de los ejes ESG alineados a las metas del Plan de Sostenibilidad. Capacitar a los líderes de área en rendición de cuentas, implementar una plantilla estandarizada de recopilación y emitir el primer informe semestral de evaluación de resultados","Analizar los KPIs frente a las metas ESG para identificar las causas raíz de los desvíos. Diseñar planes de acción correctivos (ISO 9001), integrar las métricas en el tablero de control directivo y reportar el desempeño a la alta gerencia (ODS 8).","Consolidar el sistema de gestión ESG con revisión periódica de la alta dirección y someter el desempeño a una verificación externa (UE ESRS G1). Publicar los resultados en el Reporte de Sostenibilidad (ODS 12) y aplicar herramientas de Sistema B para la mejora continua del impacto.","Medir y publicar con transparencia los resultados ESG para asegurar la mejora continua. Innovar junto a aliados estratégicos y escalar el impacto en toda la cadena de valor, consolidando el desempeño como una ventaja competitiva y social duradera."],"s":"ODS 8, ODS 12, Sistema B, UE ESRS G1, ISO 9001"},{"id":"estrategia-9","sub":"","t":"Reporte de sostenibilidad","d":"El indicador se orienta a medir el nivel de Rendición de Cuentas (Accountability) de la empresa, evaluando la transparencia y la precisión con la que comunica su desempeño ambiental, social y económico a sus grupos de interés.","l":["No se comunica información sobre sostenibilidad.","La empresa pública un resumen o reporte interno con avances y buenas prácticas.","La empresa elabora un informe de sostenibilidad anual con indicadores clave alineados a los ODS sin una metodología de estándares internacionales.","La empresa emite un reporte de sostenibilidad anual bajo metodologías de estándares validados internacionalmente (GRI, UE ESRS, u otro)."],"a":["Compilar anualmente los avances y buenas prácticas de sostenibilidad en un resumen o reporte interno. Mapear los datos actuales (IARSE & Ethos, 2017) para incluirlos en el informe, comunicarlo a colaboradores y socios clave, e implementar una sección de sostenibilidad en la web corporativa.","Elaborar y publicar un Informe de Prácticas e Impactos detallando su naturaleza (directo/indirecto; positivo/negativo) y su vínculo con los ODS. Definir alcances, capacitar al equipo en taxonomías de impacto, asignar líderes por área y estandarizar la recolección de evidencias para asegurar la trazabilidad.","Elaborar y publicar un Reporte de Sostenibilidad anual bajo un estándar reconocido (GRI o UE ESRS G1) utilizando el análisis de materialidad como guía. Integrar KPIs cuantificables en los tres ejes, capacitar al equipo responsable en la metodología elegida (ODS 12) y estructurar la matriz de alineación técnica.","Medir y publicar con transparencia los resultados ESG para asegurar la mejora continua. Profundizar la innovación, colaborar con aliados y escalar el impacto en toda la cadena de valor, consolidando el desempeño como una ventaja competitiva y social duradera."],"s":"ODS 12, ODS 16, Sistema B, UE ESRS G1, GRI"},{"id":"estrategia-10","sub":"","t":"Innovación y sostenibilidad","d":"El indicador se enfoca en el grado en que la innovación es utilizada como un motor para el desempeño sostenible de la empresa, vinculando la creatividad y el desarrollo a la generación de valor económico, social y ambiental.","l":["No se asocia la innovación con la sostenibilidad.","La empresa implementa proyectos piloto de innovación sostenible en procesos o productos.","La empresa gestiona la innovación con criterios de sostenibilidad, medible en eficiencia o impacto.","La empresa integra la innovación sostenible en su estrategia, impulsando soluciones que generen valor económico, social y ambiental."],"a":["Establecer criterios socioambientales para evaluar proyectos y ejecutar un piloto de innovación sostenible (ODS 9). Capacitar al equipo de I+D en ecodiseño o ciclo de vida y documentar el informe de impacto del piloto junto a sus recursos asignados.","Formalizar en el proceso de innovación la evaluación previa de criterios ESG medibles para todo nuevo proyecto. Medir el impacto de los proyectos implementados en un tablero de control, asignar presupuesto a I+D sostenible (ODS 12) e implementar incentivos internos de triple impacto.","Integrar la innovación de triple impacto en la estrategia de negocio y formar alianzas para la co-creación (Sistema B). Auditar anualmente el portafolio de innovación para asegurar su alineación con las metas ESG (UE ESRS G1) y formalizar los informes y convenios.","Medir y publicar con transparencia los resultados ESG para asegurar la mejora continua. Profundizar la innovación, colaborar con aliados y escalar el impacto en toda la cadena de valor, consolidando una ventaja competitiva y social duradera."],"s":"ODS 9, ODS 12, Sistema B, UE ESRS G1"}]},{"id":"ambiente","name":"Ambiente","dim":"Ambiental","foco":"Reducción de impactos, transición energética, circularidad y gestión de recursos.","ind":[{"id":"ambiente-1","sub":"Acción Climática","t":"Política y metas climáticas","d":"El indicador se centra en evaluar la existencia y el nivel de formalización del compromiso de la empresa con la Acción Climática, lo cual requiere la adopción de medidas que promuevan la gestión de riesgos y oportunidades relacionados con el cambio climático.","l":["La empresa no cuenta con una política ni metas relacionadas con el cambio climático.","La empresa define objetivos ambientales generales que incluyen la reducción de emisiones o el uso eficiente de recursos.","La empresa cuenta con una política climática formal con metas específicas de reducción y responsables asignados.","La empresa integra su política climática a la estrategia organizacional, revisa sus metas periódicamente y comunica resultados de manera transparente."],"a":["Redactar y firmar la Política Ambiental General, realizar una jornada de sensibilización directiva sobre el ODS 13 y confeccionar el inventario inicial de combustibles y energía de la planta.","Establecer objetivos numéricos específicos de reducción para los Alcances 1 y 2, estructurar un Plan de Mitigación con cronograma y presupuesto asignado, y comenzar a alinear la gestión de riesgos climáticos con los requisitos de la norma ISO 9001.","Actualizar la política de remuneración variable de la alta dirección para incluir indicadores climáticos obligatorios y someter las metas de descarbonización de la empresa a la validación de la iniciativa SBTi.","Mantener la revisión periódica de las metas de impacto, profundizar la innovación abierta con socios estratégicos y extender las mejores prácticas de mitigación a toda la cadena de valor."],"s":"ODS 13, Sistema B, UE ESRS E1, ISO 14001:2026"},{"id":"ambiente-2","sub":"Acción Climática","t":"Gestión de riesgos y adaptación climática","d":"El indicador evalúa la capacidad de la empresa para prepararse, a través de acciones y medidas, a fin de conferir flexibilidad a su negocio ante las alteraciones productivas y de mercado que son consecuencia del cambio climático, integrando la prevención en sus procesos.","l":["No se analizan los riesgos climáticos ni los impactos potenciales.","La empresa evalúa su exposición a riesgos físicos y de transición y define medidas de mitigación.","La empresa desarrolla planes de adaptación y continuidad operativa frente a escenarios climáticos.","La empresa gestiona los riesgos climáticos dentro de su sistema de gestión integral, con revisión y actualización periódica."],"a":["Diseñar una Matriz de Identificación de Riesgos Climáticos cualitativa para evaluar variables físicas y de transición, asignar el liderazgo del proceso al equipo de Riesgos o Sostenibilidad mediante un análisis FODA ampliado, y enriquecer el diagnóstico con informes climáticos e hídricos regionales de Córdoba para elaborar el informe de exposición preliminar.","Documentar formalmente el Plan de Adaptación y Mitigación de Riesgos junto al PCO para Escenarios Climáticos, incorporar la evaluación de vulnerabilidades en la toma de decisiones para nuevas inversiones y realizar un simulacro de emergencia corporativo basado en una amenaza climática priorizada.","Integrar las variables climáticas en el SGI corporativo (ISO), monitorear KPIs de resiliencia (tiempos de recuperación y costos) y publicar la estrategia en el Reporte de Sostenibilidad bajo los lineamientos TCFD.","Optimizar continuamente el modelo de resiliencia del SGI, co-crear soluciones de innovación climática con aliados estratégicos y escalar las prácticas de adaptación a toda la cadena de valor."],"s":"ODS 13, Sistema B, UE ESRS E1, ISO 14001:2026"},{"id":"ambiente-3","sub":"Acción Climática","t":"Medición de la huella de carbono","d":"El indicador se centra en el nivel de transparencia y rigor técnico con el que la empresa cuantifica sus Gases de Efecto Invernadero (GEI) para la gestión de la acción climática, incluyendo la medición de las emisiones directas e indirectas.","l":["No se miden las emisiones ni se identifican las principales fuentes.","La empresa realiza una estimación anual de su huella de carbono considerando los alcances 1 y 2.","La empresa calcula su huella de carbono incluyendo los alcances 1, 2 y parte del 3, aplicando metodologías reconocidas.","La empresa mantiene un inventario completo de emisiones, verificado externamente y actualizado, que utiliza para planificar reducciones."],"a":["Designar un responsable técnico interno para recopilar mensualmente facturas eléctricas y remitos de combustible, estandarizar los factores de emisión de la red eléctrica local y estructurar la planilla de cálculo para consolidar el Informe Anual de Huella de Carbono.","Evaluar las 15 categorías de Alcance 3 para identificar las más significativas (como logística o materias primas), solicitar datos primarios de emisión a los proveedores clave y estructurar un indicador de intensidad de huella por unidad de producto fabricado.","Contratar a un ente auditor independiente calificado para certificar el inventario de GEI, establecer objetivos de reducción a largo plazo basados en la ciencia (SBTi) y divulgar los resultados públicamente en el Reporte de Sostenibilidad.","Mantener la optimización de los sistemas de medición de emisiones, implementar proyectos colaborativos de mitigación con socios de la cadena de valor y capitalizar la eficiencia climática como una ventaja competitiva duradera."],"s":"ODS 13, Sistema B, UE ESRS E1, ISO 14001:2026"},{"id":"ambiente-4","sub":"Acción Climática","t":"Plan de transición hacia bajas emisiones","d":"El indicador evalúa la visión estratégica y operativa de la empresa respecto a la reducción de su dependencia de combustibles fósiles y la implementación de acciones concretas para una gestión más limpia, mitigando el impacto del cambio climático.","l":["No existe un plan de acción para reducir emisiones.","La empresa implementa acciones planificadas con responsables, cronograma y seguimiento básico.","La empresa aplica un plan estructurado con metas anuales, presupuesto y medición de avances.","La empresa integra su plan de transición al planeamiento estratégico, con metas multianuales y evaluación de impacto."],"a":["Mapear e implementar mejoras operativas de baja inversión (como migración a LED o mantenimiento preventivo), designar un referente energético interno para coordinar las iniciativas y lanzar una campaña de sensibilización en ahorro de energía.","Estructurar el documento del Plan de Descarbonización detallando cronograma, responsables y presupuesto asignado, incorporar líneas de investigación (I+D) en tecnologías eficientes de mitigación y realizar análisis de costo-beneficio (ROI) para las inversiones clave.","Incorporar de forma nativa las partidas de descarbonización en el presupuesto general del negocio, actualizar la política de remuneración variable ligándola a los KPIs de transición y transparentar los avances públicamente en el Reporte de Sostenibilidad.","Evaluar y optimizar de forma continua los resultados del plan de transición, profundizar la innovación tecnológica junto a aliados estratégicos y escalar el impacto de la descarbonización a toda la cadena de valor."],"s":"ODS 13, Sistema B, UE ESRS E1, ISO 14001:2026"},{"id":"ambiente-5","sub":"Acción Climática","t":"Gestión de energía y eficiencia operativa","d":"El indicador se enfoca en el desarrollo de programas de eficiencia en el uso de la energía por parte de la empresa, lo cual es crucial para la reducción del impacto ambiental que dicho uso provoca, orientándose a un enfoque más avanzado de energías limpias y renovables.","l":["No se realiza seguimiento del consumo energético.","La empresa implementa medidas de eficiencia (iluminación, mantenimiento, optimización de equipos).","La empresa monitorea el consumo por área y aplica indicadores de intensidad energética.","La empresa gestiona la energía bajo un sistema estructurado con metas de eficiencia y mejora continua."],"a":["Ejecutar el recambio a iluminación LED en áreas de mayor consumo, establecer el programa de mantenimiento preventivo para motores, compresores y calderas, lanzar la campaña interna de sensibilización sobre ahorro de energía e iniciar el registro mensual centralizado de los consumos de electricidad y gas.","Instalar medidores secundarios en los equipos y líneas de producción de alto consumo, realizar un análisis de costo-beneficio (ROI) para un proyecto de reconversión tecnológica y estructurar un tablero de control para monitorear KPIs energéticos sectorizados (como kWh/unidad producida).","Estructurar el Manual del SGE adoptando el ciclo PHVA (Planificar-Hacer-Verificar-Actuar), monitorear de forma estratégica los indicadores de intensidad energética para la toma de decisiones de inversión y vincular el cumplimiento de las metas de eficiencia a los objetivos de desempeño de la gerencia de operaciones.","Asegurar el ciclo evolutivo y optimización del Sistema de Gestión Energética (SGE), fomentar la innovación tecnológica en el uso de la energía junto a aliados estratégicos y expandir los estándares de eficiencia a toda la cadena de valor."],"s":"ODS 7, ODS 13, Sistema B, UE ESRS E1, ISO 14001:2026"},{"id":"ambiente-6","sub":"Acción Climática","t":"Energía renovable y fuentes limpias","d":"El indicador evalúa el compromiso de la empresa con la transición energética, incentivando el desarrollo y la inversión en el uso de fuentes de energía limpias y renovables, en contraste con el consumo de combustibles fósiles.","l":["Toda la energía proviene de fuentes fósiles.","La empresa incorpora parcialmente energía proveniente de fuentes limpias o instala equipos de generación.","La empresa aumenta progresivamente su proporción de energía renovable contratada o autogenerada.","La empresa opera con un alto porcentaje de energía renovable y mantiene un plan de transición hacia la neutralidad energética."],"a":["Analizar formalmente el origen del suministro eléctrico provisto por la distribuidora local, solicitar cotizaciones de sistemas renovables a proveedores certificados, desarrollar un estudio de pre-factibilidad para la instalación de paneles solares en las instalaciones y capacitar a un referente interno en el marco regulatorio de la Ley de Generación Distribuida (N° 27.424).","Ejecutar la transición energética inicial (vía contrato con proveedor de energía limpia o instalación de paneles solares), implementar un tablero de control para monitorear el KPI de porcentaje renovable sobre el consumo total y comunicar estratégicamente este hito ambiental a los grupos de interés.","Formalizar el documento del Plan de Transición Energética con cronogramas y objetivos ambiciosos, elaborar un informe de viabilidad para la firma de un Acuerdo de Compra de Energía (PPA) con un parque generador y analizar tecnologías de almacenamiento a base de baterías para optimizar el autoconsumo y la resiliencia operativa.","Optimizar continuamente los acuerdos de suministro (PPAs) y sistemas de autogeneración, co-crear soluciones de vanguardia en almacenamiento energético con socios estratégicos y traccionar la transición hacia fuentes limpias en toda la cadena de valor."],"s":"ODS 7, ODS 13, Sistema B, UE ESRS E1, ISO 14001:2026"},{"id":"ambiente-7","sub":"Economía Circular","t":"Política y objetivos de economía circular","d":"El indicador evalúa el grado de compromiso de la empresa con los principios de la Economía Circular, trascendiendo el modelo lineal de \"tomar, hacer, desechar\", y priorizando la eficiencia en el uso de materiales para la reducción de impactos ambientales negativos.","l":["La empresa no tiene lineamientos ni compromisos vinculados a la economía circular.","La empresa establece objetivos para mejorar la eficiencia de materiales o aumentar la recuperación de recursos.","La empresa cuenta con una política formal con metas de circularidad y responsables asignados.","La empresa integra la economía circular en su estrategia de sostenibilidad, con resultados medibles y seguimiento anual."],"a":["Elaborar el mapeo del flujo de materiales para registrar los residuos por tipo y definir los primeros objetivos cuantitativos de eficiencia y reciclaje interno de la operación.","Redactar y obtener la aprobación directiva de la Política de Economía Circular, formalizando la matriz de seguimiento con metas cuantitativas y responsables asignados.","Incorporar formalmente los indicadores clave de circularidad (tasa de circularidad e índice de contenido reciclado) en el tablero de control principal de la alta dirección para su monitoreo estratégico anual.","Co-diseñar un programa de innovación en ecodiseño y circularidad junto a proveedores estratégicos para reincorporar los residuos del proceso al ciclo productivo de la cadena de valor."],"s":"ODS 12, Sistema B, UE ESRS E5, ISO 14001:2026"},{"id":"ambiente-8","sub":"Economía Circular","t":"Diseño de productos y servicios circulares","d":"El indicador evalúa la aplicación de los principios de Economía Circular y Ecodiseño en la concepción y reformulación de los productos y servicios de la empresa, lo cual es esencial para reducir el impacto ambiental y facilitar el reúso y el reciclaje.","l":["Los productos o servicios no consideran criterios de circularidad.","La empresa aplica principios de ecodiseño para optimizar materiales, desmontaje o reparación.","La empresa implementa procesos formales de diseño circular con validación y pruebas.","La empresa gestiona la innovación desde la circularidad, asegurando métricas de desempeño ambiental y social."],"a":["Ejecutar un análisis de ciclo de vida simplificado sobre un producto clave para identificar sus impactos y actualizar su ficha técnica aplicando un criterio de ecodiseño, como la sustitución de un componente por material reciclado.","Formalizar y aprobar el Documento del Proceso de Diseño Circular, integrando obligatoriamente las fichas de métricas de circularidad (desmontaje y reparabilidad) en el flujo de desarrollo de nuevos productos.","Diseñar e implementar una matriz de evaluación de triple impacto para auditar los productos rediseñados, midiendo sus indicadores ambientales y sociales para consolidar el informe de desempeño final.","Crear un comité de innovación abierta junto a proveedores estratégicos y centros tecnológicos para co diseñar componentes circulares que eliminen por completo los residuos en el ciclo de vida final del producto."],"s":"ODS 9, ODS 12, Sistema B, UE ESRS E5, ISO 14001:2026"},{"id":"ambiente-9","sub":"Economía Circular","t":"Uso eficiente de materiales y recursos","d":"El indicador se orienta a la gestión de la eficiencia en el uso de materiales y recursos, lo cual es fundamental para reducir los impactos ambientales negativos que dicho consumo provoca, en línea con los principios de la Economía Circular.","l":["No se monitorea el consumo de materiales o recursos.","La empresa mide la eficiencia de uso de materiales e identifica oportunidades de mejora.","La empresa establece indicadores de productividad de recursos y metas de reducción.","La empresa optimiza el uso de recursos mediante gestión integral, control de intensidad y evaluación de impacto."],"a":["Implementar un registro mensual estructurado del consumo de materiales por unidad de producto terminado y elaborar un informe de balance de masa para identificar formalmente los puntos de mayor desperdicio en la operación.","Diseñar y oficializar el documento formal de metas de reducción de materiales junto a su matriz de seguimiento, incorporando indicadores específicos de intensidad (como kg por unidad producida) en los procesos de control de calidad.","Integrar el indicador de intensidad de uso de recursos en el tablero de control principal de la dirección para su monitoreo estratégico de alta frecuencia y la toma de decisiones en tiempo real.","Implementar un programa colaborativo de optimización de recursos con los proveedores críticos de la cadena de suministro para estandarizar metodologías de reducción de mermas y co-reportar resultados ambientales de forma conjunta."],"s":"ODS 12, Sistema B, UE ESRS E5, ISO 14001:2026"},{"id":"ambiente-10","sub":"Economía Circular","t":"Contenido reciclado y materiales renovables","d":"El indicador evalúa la prioridad que la empresa otorga al uso de materiales renovables e insumos reciclados en sus procesos, un aspecto clave de la Economía Circular y de la reducción de la dependencia de recursos no renovables.","l":["No se utiliza contenido reciclado ni materiales renovables.","La empresa incorpora parcialmente materiales reciclados o de origen renovable en su producción o empaques.","La empresa establece metas de contenido reciclado y certifica la trazabilidad del origen de sus materiales.","La empresa asegura un alto porcentaje de materiales reciclados o renovables, auditado externamente, e impulsa la innovación junto a sus proveedores."],"a":["Ejecutar la sustitución de al menos un 10% del insumo principal o empaque en una línea de producto específica, asegurando la actualización de su ficha técnica y el registro formal de la compra alternativa.","Formalizar el documento de metas obligatorias de contenido reciclado/renovable por tipo de producto e implementar un protocolo de trazabilidad que exija a los proveedores la documentación técnica que certifique el origen de los insumos.","Someter la cartera de productos a una auditoría anual por parte de un organismo independiente para obtener el Certificado de Verificación Externa del porcentaje de contenido sostenible, formalizando en paralelo el registro de los proyectos de innovación conjunta en I+D con proveedores estratégicos.","Crear un programa de co-innovación y desarrollo tecnológico junto a los proveedores clave para sustituir de manera definitiva los materiales vírgenes remanentes por alternativas 100% circulares o de base biológica en toda la cartera de productos."],"s":"ODS 12, Sistema B, UE ESRS E5, ISO 14001:2026"},{"id":"ambiente-11","sub":"Economía Circular","t":"Gestión y valorización de residuos","d":"El indicador se orienta a evaluar el nivel de compromiso y la capacidad operativa de la empresa para la gestión responsable de los residuos, priorizando la valorización (reúso y reciclaje) e implementando un plan de gerenciamiento que reduzca el impacto ambiental.","l":["Los residuos no se separan ni gestionan adecuadamente.","Se realiza separación básica (orgánicos, reciclables) en algunos sectores.","Se gestionan las corrientes de residuos con registros y control de destino final.","Se aplica una estrategia integral de residuos con trazabilidad completa y mejora continua."],"a":["Diseñar e implementar el mapa de puntos de separación interna mediante la instalación de contenedores diferenciados en la operación, asegurando de forma paralela la obtención y archivo de los certificados de disposición final de los residuos peligrosos.","Implementar el registro mensual detallado de generación de residuos por tipo y destino final, y formalizar el procedimiento documentado para la homologación, auditoría y control de los gestores ambientales contratados.","Formalizar y oficializar el documento de la Estrategia Integral de Residuos, consolidando el informe anual que certifique los porcentajes de valorización alcanzados y documente la trazabilidad de extremo a extremo de las corrientes de desecho críticas.","Escalar el modelo de logística inversa mediante la co-creación de una plataforma o alianza sectorial colaborativa que masifique la recuperación de residuos posconsumo, reincorporándolos como insumos secundarios de alta calidad en el mercado."],"s":"ODS 12, Sistema B, UE ESRS E5, ISO 14001:2026"},{"id":"ambiente-12","sub":"Economía Circular","t":"Reutilización y logística inversa","d":"El indicador evalúa el grado de implementación de la Logística Reversa y la reutilización de materiales, lo cual es esencial para reducir la dependencia de nuevos recursos y avanzar hacia los objetivos de la Economía Circular y la Producción y Consumo Responsables.","l":["No existen prácticas de recuperación ni devolución de productos o materiales.","La empresa implementa procesos básicos de reutilización o devolución con clientes o proveedores.","La empresa gestiona un sistema de logística inversa con seguimiento y control de materiales.","La empresa integra la logística inversa en su modelo de negocio, maximizando la recuperación y evitando residuos."],"a":["Diseñar y oficializar el procedimiento documentado de reutilización interna de embalajes, y ejecutar un circuito piloto de devolución con al menos un proveedor o cliente estratégico, garantizando el archivo de los primeros registros formales de retorno.","Desarrollar y oficializar el Manual del Sistema de Logística Inversa, e implementar la matriz de registro continuo para medir de forma sistemática la tasa de recuperación de productos y los materiales reincorporados.","Desarrollar el informe de análisis de rentabilidad del sistema de logística inversa y establecer el protocolo de transferencia e integración de los datos de recuperación dentro del proceso de Diseño y Desarrollo para guiar las mejoras de ecodiseño.","Diseñar y liderar una red de colaboración interempresarial o sectorial para compartir infraestructura logística y centros de consolidación de materiales post-consumo, maximizando la eficiencia de las rutas de retorno a gran escala y reduciendo la huella de carbono asociada al transporte inverso."],"s":"ODS 12, Sistema B, UE ESRS E5, ISO 14001:2026"},{"id":"ambiente-13","sub":"Economía Circular","t":"Envases y embalajes sostenibles","d":"El indicador se orienta a la aplicación de criterios de Economía Circular y Ecodiseño en los envases y embalajes, buscando la reducción del impacto ambiental de los productos post-consumo y la facilitación de la logística inversa.","l":["Los envases y embalajes no se gestionan desde criterios ambientales.","La empresa rediseña envases y embalajes para facilitar su reciclabilidad o reutilización.","La empresa incorpora materiales reciclados y certifica la sostenibilidad de sus envases.","La empresa elimina materiales problemáticos y aplica soluciones innovadoras de embalaje circular certificadas."],"a":["Elaborar el informe de rediseño de envases bajo criterios de ecodiseño y actualizar las fichas técnicas de los embalajes principales para documentar formalmente la mejora en su reciclabilidad o su capacidad de reutilización.","Formalizar la actualización de la política de compras para priorizar de manera vinculante a proveedores de materiales certificados e implementar el sistema de control para recopilar y archivar los Certificados de Sostenibilidad del Material de los envases.","Elaborar y oficializar el informe de eliminación total de materiales problemáticos en los embalajes y compilar la documentación técnica o certificaciones externas que validen las innovaciones de packaging circular aplicadas en la organización.","Establecer un ecosistema de innovación abierta y colaboración sectorial con proveedores de insumos y canales de distribución para co-diseñar y estandarizar formatos de empaque circulares de uso común, implementando a la vez un panel público de rendición de cuentas que reporte de manera transparente la huella material y el ciclo de vida del packaging de la empresa."],"s":"ODS 12, Sistema B, UE ESRS E5, ISO 14001:2026"},{"id":"ambiente-14","sub":"Economía Circular","t":"Monitoreo y gestión del consumo de agua","d":"El indicador se orienta a la gestión de la eficiencia en el uso del agua por parte de la empresa, incentivando la reducción del impacto ambiental que este recurso provoca y promoviendo el reúso y la recirculación para la sustentabilidad hídrica.","l":["No se mide el consumo ni se promueve el reuso de agua.","La empresa analiza los resultados de consumo para detectar fugas o ineficiencias e implementa acciones de reducción.","La empresa establece metas de eficiencia hídrica y aplica tecnologías de reutilización o recirculación.","La empresa cuenta con un sistema integral de gestión hídrica con indicadores de eficiencia, monitoreo en tiempo real y certificaciones o reconocimientos vigentes."],"a":["Implementar el registro mensual de consumo total de agua mediante la lectura de medidores y formalizar el informe de detección y reparación de fugas para asegurar la contención inmediata de pérdidas visibles en la operación.","Formalizar el Plan de Metas de Eficiencia Hídrica con objetivos cuantitativos de reducción por unidad de producto y consolidar los expedientes técnicos y financieros que documenten la inversión en tecnologías de reúso o recirculación implementadas en la operación.","Desarrollar y formalizar el Manual del Sistema de Gestión Hídrica vinculado a sistemas de telemetría para la medición en tiempo real por proceso, gestionando en paralelo la documentación y auditorías necesarias para obtener la certificación bajo el estándar AWS (Alliance for Water Stewardship) o el reconocimiento oficial de la autoridad hídrica local.","Diseñar y liderar un programa de gobernanza colaborativa del agua junto a actores clave de la cuenca hídrica local, implementando en paralelo un panel público de datos que reporte de manera transparente la huella hídrica corporativa y el impacto neto de los proyectos de regeneración ambiental colectiva."],"s":"ODS 6, ODS 12, Sistema B, UE ESRS E3, ISO 14001:2026"},{"id":"ambiente-15","sub":"Economía Circular","t":"Indicadores de productividad de recursos","d":"El indicador evalúa la eficiencia operativa de la empresa en el uso de insumos clave (materiales, agua, energía) en relación con su producción, lo cual es fundamental para el gerenciamiento del impacto ambiental y la minimización de entradas y salidas de insumos.","l":["No se registran datos sobre el uso de materiales o energía por unidad de producto.","La empresa calcula indicadores simples de productividad de recursos (por unidad de producto o servicio).","La empresa mide de forma sistemática la eficiencia en el uso de materiales, agua y energía, estableciendo metas de reducción.","La empresa gestiona los indicadores de productividad de recursos dentro de su sistema de mejora continua, analizando causas y comunicando resultados."],"a":["Formalizar el documento con el criterio de la unidad de producción definida por la organización e implementar la tabla de registro de indicadores simples de productividad, consolidando la recopilación de los datos brutos iniciales de materiales, agua, energía y residuos.","Elaborar y oficializar el Documento de Metas de Productividad de Recursos que fije los objetivos cuantitativos de reducción por indicador de intensidad, e implementar la matriz de asignación de responsables por área para institucionalizar el monitoreo continuo y el análisis sistemático de desviaciones.","Institucionalizar la evaluación periódica de los KPIs de productividad mediante la emisión formal del Acta de Revisión por la Dirección, y diseñar la sección técnica correspondiente dentro del Reporte de Sostenibilidad corporativo para comunicar públicamente el balance de los resultados obtenidos frente a las metas planteadas.","Diseñar y desplegar un ecosistema digital e interempresarial de datos abiertos (Open Data) para el monitoreo de la productividad de recursos que facilite el benchmarking sectorial, implementando en paralelo un programa corporativo de transferencia metodológica para capacite y estandarizar los sistemas de medición de intensidad material y energética en los principales proveedores de la cadena de suministro."],"s":"ODS 12, Sistema B, UE ESRS E5, ISO 14001:2026"},{"id":"ambiente-16","sub":"Economía Circular","t":"Modelos de negocio circulares","d":"El indicador evalúa la transformación del modelo de negocio de la empresa para alinearse con la Economía Circular, lo que implica ir más allá de la venta tradicional y buscar la conciliación del lucro con la inclusión social y el impacto ambiental decreciente.","l":["El modelo de negocio se basa solo en la venta de productos.","La empresa prueba esquemas de alquiler, reparación o recompra.","La empresa implementa modelos de servitización o reuso en líneas de negocio específicas.","La empresa opera bajo un modelo de negocio circular consolidado, con resultados económicos, ambientales y sociales positivos."],"a":["Desarrollar el informe de análisis de viabilidad del piloto y estructurar el sistema de registro operativo para documentar y monitorear de forma continua las primeras transacciones comerciales derivadas del esquema de alquiler o recompra implementado.","Formalizar la documentación técnica y operativa del modelo de servitización implementado en el segmento comercial clave, y estructurar el sistema de registro para el seguimiento continuo de los KPIs de triple impacto, monitoreando específicamente la evolución de la relación entre los ingresos por servicio/alquiler frente a las ventas tradicionales.","Institucionalizar la emisión del Reporte de Impacto Anual del Modelo de Negocio Circular integrando los balances económicos, ambientales y sociales consolidados, y gestionar las auditorías correspondientes ante organismos internacionales para obtener y mantener la Certificación de Empresa B u otra validación de terceros que acredite la integridad del modelo.","Establecer un comité o laboratorio permanente de innovación abierta en conjunto con centros tecnológicos y aliados del sector para co-diseñar la próxima generación de servicios circulares, implementando en paralelo un panel de transferencia de conocimiento industrial que comparta de manera transparente las métricas y aprendizajes del modelo para traccionar la transición comercial de la región."],"s":"ODS 8, ODS 12, Sistema B, UE ESRS E5, ISO 14001:2026"},{"id":"ambiente-17","sub":"Acción Climática","t":"Compensación de la huella de carbono","d":"El indicador se orienta a evaluar el nivel de compromiso de la empresa con la neutralidad de carbono, analizando si, además de la reducción de emisiones, se implementan acciones de compensación certificada que contribuyan a la mitigación del cambio climático.","l":["La empresa no compensa ni reduce sus emisiones a la atmósfera.","La empresa desarrolla acciones puntuales de compensación, como forestaciones o apoyo a proyectos ambientales locales.","La empresa implementa programas de compensación certificados (p. ej., créditos de carbono o proyectos de captura verificados).","La empresa gestiona integralmente la compensación de su huella mediante programas validados, priorizando la reducción en origen y reportando resultados públicamente."],"a":["Destinar un presupuesto inicial para ejecutar una acción de compensación —como la participación en programas de reforestación en las Sierras de Córdoba— y difundir formalmente la iniciativa de manera interna para consolidar la cultura de sustentabilidad en el equipo.","Realizar un análi
