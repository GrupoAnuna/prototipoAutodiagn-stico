/* =====================================================================
   Cuestionario
   · Modo foco (predeterminado): un indicador por vez, avance automático,
     atajos de teclado 1–4 y flechas.
   · Modo lista: todo el eje en una página, para revisar.
   · Pantalla de eje completo con resultado provisorio del eje.
   ===================================================================== */
const MIN_PER_IND = 0.8; // minutos estimados por indicador
function viewQuestionnaire(c, ei, sub) {
  const e = EJES[ei], s = score(c), locked = c.status === 'finalizado';
  const mode = sub === 'lista' ? 'list' : sub === 'fin' ? 'done' : 'focus';
  let k = Number(sub);
  if (mode === 'focus' && (sub === undefined || sub === '' || isNaN(k))) {
    const p = e.ind.findIndex(i => c.answers[i.id] === undefined); k = p >= 0 ? p : 0;
  }
  k = Math.max(0, Math.min(e.ind.length - 1, k || 0));
  AFTER.push(() => bindQuestionnaire(c, ei, mode, k));
  const tabs = EJES.map((x, i) => { const p = s.per[i]; return `<a class="tab ${p.complete ? 'full' : ''}" href="#/diagnostico/${c.id}/${i}" ${i === ei ? 'aria-current="page"' : ''} data-tab="${i}">${i + 1}. ${esc(x.short)} <span class="cnt">${p.ans}/${p.total}</span></a>`; }).join('');
  const head = `
  <div class="qhead">
    <div class="page-head" style="margin:0;align-items:center"><div><h1 style="font-size:24px">Diagnóstico ${c.year}</h1></div>
      <div class="actions"><a class="btn sm" href="#/resultados/${c.id}">Ver resultados</a></div></div>
    <div class="qprog"><span id="qcount">${s.ans} de ${TOTAL} indicadores</span><div class="bar"><span id="qbar" style="width:${s.progress}%"></span></div><span id="qpct">${r0(s.progress)}%</span></div>
    <nav class="tabs" aria-label="Ejes del diagnóstico">${tabs}</nav>
  </div>
  ${locked ? `<div class="notice lock"><span>Este diagnóstico está finalizado y se muestra en modo lectura.${CTX.user.role === 'admin' ? ' Podés reabrirlo desde Diagnósticos.' : ' Para modificarlo, solicitá a la consultora que lo reabra.'}</span></div>` : ''}`;
  if (mode === 'done') return head + ejeDone(c, ei, s);
  const pe = s.per[ei], left = e.ind.length - pe.ans;
  const intro = `<div class="eje-intro">
    <div><span class="chip">Eje ${ei + 1} de ${EJES.length} · ${esc(e.dim)}</span><h2 style="margin-top:10px">${esc(e.name)}</h2>
      <p>${esc(e.foco)} ${left ? `Quedan ${left} de ${e.ind.length} indicadores, unos ${Math.max(1, Math.round(left * MIN_PER_IND))} minutos.` : 'Todos los indicadores de este eje están respondidos.'}</p></div>
    <nav class="seg" aria-label="Forma de responder"><a href="#/diagnostico/${c.id}/${ei}/${mode === 'focus' ? k : ''}" ${mode === 'focus' ? 'aria-current="page"' : ''}>De a una</a><a href="#/diagnostico/${c.id}/${ei}/lista" ${mode === 'list' ? 'aria-current="page"' : ''}>Ver todas</a></nav>
  </div>`;
  if (mode === 'list') {
    return head + intro + `<div class="qlist">${e.ind.map(i => qCard(c, i, locked, false)).join('')}</div>
    <div class="qnav">${ei > 0 ? `<a class="btn" href="#/diagnostico/${c.id}/${ei - 1}">Eje anterior</a>` : '<span></span>'}<div class="actions" id="qfinish">${finishBlock(c, ei)}</div></div>`;
  }
  const i = e.ind[k];
  const dots = e.ind.map((x, j) => `<a href="#/diagnostico/${c.id}/${ei}/${j}" class="qdot ${c.answers[x.id] !== undefined ? 'on l' + c.answers[x.id] : ''} ${j === k ? 'cur' : ''}" aria-label="Indicador ${x.code}${c.answers[x.id] !== undefined ? ', respondido' : ', pendiente'}" title="${esc(x.code + ' ' + x.t)}">${j + 1}</a>`).join('');
  return head + intro + `
  <div class="qfocus">
    <div class="qdots" aria-label="Indicadores del eje">${dots}</div>
    ${qCard(c, i, locked, true)}
    <div class="qnav" style="margin-top:16px">
      ${k > 0 ? `<a class="btn" href="#/diagnostico/${c.id}/${ei}/${k - 1}">Anterior</a>` : ei > 0 ? `<a class="btn" href="#/diagnostico/${c.id}/${ei - 1}/${EJES[ei - 1].ind.length - 1}">Eje anterior</a>` : '<span></span>'}
      <span class="small muted no-print">${locked ? '' : 'Atajos: teclas 1 a 4 para elegir, flechas para moverte.'}</span>
      ${k < e.ind.length - 1 ? `<a class="btn ${c.answers[i.id] !== undefined ? 'primary' : ''}" href="#/diagnostico/${c.id}/${ei}/${k + 1}">Siguiente</a>` : `<a class="btn primary" href="#/diagnostico/${c.id}/${ei}/fin">Terminar eje</a>`}
    </div>
  </div>`;
}
function qCard(c, i, locked, focus) {
  const v = c.answers[i.id];
  return `<article class="q ${focus ? 'q-focus' : ''} ${v !== undefined ? 'answered' : ''}" id="q-${i.id}">
    <header><span class="q-num">${i.code}</span><div><h3>${esc(i.t)}</h3>${i.sub ? `<p class="q-sub">${esc(i.sub)}</p>` : ''}</div>
      <span class="q-state ${v !== undefined ? 'ok' : 'pend'}">${v !== undefined ? 'Respondido' : 'Pendiente'}</span></header>
    <p class="q-desc">${esc(i.d)}</p>
    <p class="q-ask">¿Qué situación describe mejor a la empresa hoy?</p>
    <fieldset class="ladder ${focus ? 'vertical' : ''}"><legend class="sr">Nivel actual para ${esc(i.t)}</legend>
      ${i.l.map((t, j) => `<label class="step s${j} ${v === j ? 'sel' : ''} ${locked ? 'disabled' : ''}"><input type="radio" name="r-${i.id}" value="${j}" ${v === j ? 'checked' : ''} ${locked ? 'disabled' : ''} data-ind="${i.id}">
        <span class="step-head">${focus ? `<kbd>${j + 1}</kbd>` : ''}<span class="step-n">Nivel ${j + 1}</span><span class="step-name">${LEVELS[j]}</span></span><span class="step-text">${esc(t)}</span></label>`).join('')}
    </fieldset>
    <div class="q-foot"><details class="std"><summary>Estándares alineados</summary><p>${esc(i.s)}</p></details></div>
  </article>`;
}
function ejeDone(c, ei, s) {
  const e = EJES[ei], p = s.per[ei], next = EJES[ei + 1];
  const pendingAll = IND.find(x => c.answers[x.id] === undefined);
  const dist = [0, 0, 0, 0]; e.ind.forEach(i => { const v = c.answers[i.id]; if (v !== undefined) dist[v]++; });
  AFTER.push(() => bindFinish(c));
  return `<section class="panel done-eje">
    <div class="done-mark" aria-hidden="true">✓</div>
    <div>
      <span class="chip done">Eje ${ei + 1} de ${EJES.length}${p.complete ? ' completo' : ''}</span>
      <h2 style="margin:10px 0 6px;font-size:24px">${esc(e.name)}</h2>
      ${p.complete ? `<p class="muted">Resultado provisorio del eje: <b style="color:var(--ink)">${r0(p.pct)}%</b> · ${band(p.pct).name}. ${dist[0] ? `${dist[0]} práctica${dist[0] > 1 ? 's' : ''} por implementar desde cero.` : ''}</p>`
        : `<p class="muted">Quedan ${p.total - p.ans} indicadores sin responder en este eje.</p>`}
      <div class="dist" style="max-width:420px">${dist.map((n, j) => n ? `<span style="width:${n / e.ind.length * 100}%;background:${MCOL[j]}" title="${LEVELS[j]}: ${n}"></span>` : '').join('')}</div>
      <div class="actions" style="margin-top:18px">
        ${!p.complete ? `<a class="btn primary" href="#/diagnostico/${c.id}/${ei}">Responder pendientes</a>` : ''}
        ${p.complete && next ? `<a class="btn primary" href="#/diagnostico/${c.id}/${ei + 1}">Continuar con ${esc(next.name)}</a>` : ''}
        ${p.complete && !next && pendingAll ? `<a class="btn primary" href="#/diagnostico/${c.id}/${pendingAll.ei}">Ir al primer pendiente</a>` : ''}
        ${!pendingAll && c.status !== 'finalizado' ? `<button class="btn primary" type="button" id="finishBtn">Finalizar diagnóstico</button>` : ''}
        <a class="btn" href="#/diagnostico/${c.id}/${ei}/lista">Revisar respuestas del eje</a>
      </div>
    </div>
  </section>`;
}
function finishBlock(c, ei) {
  const s = score(c);
  if (c.status === 'finalizado') return ei < EJES.length - 1 ? `<a class="btn primary" href="#/diagnostico/${c.id}/${ei + 1}/lista">Siguiente eje</a>` : `<a class="btn primary" href="#/resultados/${c.id}">Ver resultados</a>`;
  const next = ei < EJES.length - 1 ? `<a class="btn ${s.complete ? '' : 'primary'}" href="#/diagnostico/${c.id}/${ei + 1}">Siguiente eje</a>` : '';
  if (s.complete) return next + `<button class="btn primary" type="button" id="finishBtn">Finalizar diagnóstico</button>`;
  if (ei === EJES.length - 1) { const p = IND.find(x => c.answers[x.id] === undefined); return `<span class="small muted">Faltan ${TOTAL - s.ans} indicadores para finalizar.</span><a class="btn primary" href="#/diagnostico/${c.id}/${p.ei}">Ir al primer pendiente</a>`; }
  return next;
}
let qKeyHandler = null;
function bindQuestionnaire(c, ei, mode, k) {
  const e = EJES[ei];
  if (qKeyHandler) { document.removeEventListener('keydown', qKeyHandler); qKeyHandler = null; }
  const updateHead = () => {
    const s = score(c);
    $('#qcount').textContent = `${s.ans} de ${TOTAL} indicadores`; $('#qbar').style.width = s.progress + '%'; $('#qpct').textContent = r0(s.progress) + '%';
    $$('[data-tab]').forEach(t => { const p = s.per[t.dataset.tab]; $('.cnt', t).textContent = `${p.ans}/${p.total}`; t.classList.toggle('full', p.complete); });
  };
  const answer = (id, val, inp) => {
    if (c.status === 'finalizado') return;
    const was = c.answers[id];
    c.answers[id] = val; DB.persist(); savedToast();
    const card = $('#q-' + id);
    if (card) {
      card.classList.add('answered');
      $$('.step', card).forEach(l => l.classList.toggle('sel', Number($('input', l).value) === val));
      if (inp === undefined) { const r = $(`input[value="${val}"]`, card); if (r) r.checked = true; }
      const st = $('.q-state', card); st.className = 'q-state ok'; st.textContent = 'Respondido';
    }
    updateHead();
    if (mode === 'list') { const f = $('#qfinish'); if (f) { f.innerHTML = finishBlock(c, ei); bindFinish(c); } return; }
    // modo foco: avanzar solo si era una respuesta nueva
    const dot = $$('.qdot')[k]; if (dot) dot.className = `qdot on l${val} cur`;
    if (was !== undefined) return;
    let nk = -1;
    for (let j = k + 1; j < e.ind.length; j++) if (c.answers[e.ind[j].id] === undefined) { nk = j; break; }
    if (nk < 0) nk = e.ind.findIndex(x => c.answers[x.id] === undefined);
    setTimeout(() => go(`#/diagnostico/${c.id}/${ei}/${nk >= 0 ? nk : 'fin'}`), 380);
  };
  $$('.ladder input').forEach(inp => inp.onchange = () => answer(inp.dataset.ind, Number(inp.value), inp));
  if (mode === 'focus') {
    const id = e.ind[k].id;
    qKeyHandler = ev => {
      if (ev.target.closest && ev.target.closest('input[type=text],input[type=search],textarea,select,dialog')) return;
      if (!$('#q-' + id)) { document.removeEventListener('keydown', qKeyHandler); qKeyHandler = null; return; }
      if (['1', '2', '3', '4'].includes(ev.key) && c.status !== 'finalizado') { ev.preventDefault(); answer(id, Number(ev.key) - 1); }
      else if (ev.key === 'ArrowRight') { ev.preventDefault(); go(`#/diagnostico/${c.id}/${ei}/${k < e.ind.length - 1 ? k + 1 : 'fin'}`); }
      else if (ev.key === 'ArrowLeft' && k > 0) { ev.preventDefault(); go(`#/diagnostico/${c.id}/${ei}/${k - 1}`); }
    };
    document.addEventListener('keydown', qKeyHandler);
  }
  bindFinish(c);
}

      bar.setPointerCapture(e.pointerId); bar.classList.add('dragging');
      bar.onpointermove = ev => {
        const dm = Math.round((ev.clientX - x0) / w);
        if (Math.abs(ev.clientX - x0) > 3) moved = true;
        if (mode === 'move') { ns = Math.max(0, Math.min(47 - (e0 - s0), s0 + dm)); ne = ns + (e0 - s0); }
        else { ne = Math.max(s0, Math.min(47, e0 + dm)); }
        bar.style.left = `calc(var(--cw) * ${ns})`; bar.style.width = `calc(var(--cw) * ${ne - ns + 1})`;
      };
      bar.onpointerup = () => {
        bar.onpointermove = bar.onpointerup = null; bar.classList.remove('dragging');
        if (!moved) { editPlanDialog(c, bar.dataset.bar); return; }
        const pl = c.plan[bar.dataset.bar]; const y0 = c.year + 1;
        pl.start = mFromIdx(ns, y0); pl.end = mFromIdx(ne, y0); DB.persist();
        toast(`${mLabel(pl.start)} a ${mLabel(pl.end)}`);
        keepGanttScroll(render);
      };
    };
  });
}
function keepGanttScroll(fn) {
  const gw = $('.gantt-wrap'); const sl = gw ? gw.scrollLeft : 0, st = gw ? gw.scrollTop : 0;
  fn();
  const n = $('.gantt-wrap'); if (n) { n.scrollLeft = sl; n.scrollTop = st; }
}

/* =====================================================================
   Evolución
   ===================================================================== */
function viewEvolution() {
  const co = CTX.company, f = finals(co.id);
  if (!f.length) return `<div class="page-head"><div><h1>Evolución</h1></div></div><section class="panel empty"><div><h2>La evolución empieza con el primer diagnóstico</h2><p>Al finalizar el primer diagnóstico se establece el año base. Cada nuevo diagnóstico anual se compara contra ese punto de partida.</p><a class="btn primary" href="#/diagnosticos">Ir a diagnósticos</a></div><img class="iso" src="${LOGOS.isoDark}" alt=""></section>`;
  const base = baseCycle(co), last = f[f.length - 1], bs = score(base), ls = score(last);
  const scores = f.map(c => ({c, s: score(c)}));
  AFTER.push(() => { $('#baseSel').onchange = e => { co.baseYear = Number(e.target.value); DB.persist(); toast(`Año base: ${co.baseYear}`); render(); }; });
  const deltas = EJES.map((e, i) => ({e, d: ls.per[i].pct - bs.per[i].pct}));
  const best = [...deltas].sort((a, b) => b.d - a.d)[0], worst = [...deltas].sort((a, b) => a.d - b.d)[0];
  const multi = f.length > 1 && base.id !== last.id;
  return `<div class="page-head"><div><h1>Evolución</h1><p class="sub">Comparación de los diagnósticos finalizados frente al año base.</p></div>
    <div class="actions"><label class="f" style="flex-direction:row;align-items:center;gap:10px">Año base<select class="input" id="baseSel" style="width:auto">${f.map(c => `<option value="${c.year}" ${c.id === base.id ? 'selected' : ''}>${c.year}</option>`).join('')}</select></label></div></div>
  ${multi ? `<div class="kpis">
    <div class="kpi"><b>${r0(bs.pct)}%</b><span>Año base ${base.year}</span></div>
    <div class="kpi"><b>${r0(ls.pct)}%</b><span>Último diagnóstico ${last.year}</span></div>
    <div class="kpi"><b>${deltaHTML(ls.pct - bs.pct).replace('class="delta', 'style="font-size:inherit" class="delta')}</b><span>Variación acumulada</span></div>
    <div class="kpi"><b style="font-size:22px;line-height:1.5">${esc(best.e.short)}</b><span>Mayor avance (${deltaHTML(best.d)})</span></div>
  </div>` : `<div class="notice"><span>Hay un único diagnóstico finalizado. La comparación se habilita con el diagnóstico del próximo año.</span></div>`}
  <div class="cols">
    <section class="panel c7"><div class="panel-head"><h2>Puntaje global por año</h2><p>Franjas según nivel de madurez</p></div>${lineChart(scores.map(x => ({year: x.c.year, pct: x.s.pct, base: x.c.id === base.id})))}</section>
    <section class="panel c5"><div class="panel-head"><h2>Año base frente a ${last.year}</h2></div>${radar(radarSeries(last, base))}</section>
  </div>
  <section class="panel" style="margin-top:20px"><div class="panel-head"><h2>Avance por eje</h2>${multi ? `<p>Menor avance: ${esc(worst.e.short)} (${deltaHTML(worst.d)})</p>` : ''}</div>
    ${compareBars(EJES.map((e, i) => ({name: e.short, cur: ls.per[i].pct, base: multi ? bs.per[i].pct : null})), {baseName: `Año base ${base.year}`, curName: `${last.year}`})}
  </section>
  <section class="panel"><div class="panel-head"><h2>Detalle histórico</h2><p>Puntaje por eje en cada diagnóstico finalizado</p></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Eje</th>${scores.map(x => `<th class="num">${x.c.year}${x.c.id === base.id ? ' (base)' : ''}</th>`).join('')}<th class="num">Vs. base</th></tr></thead>
    <tbody>${EJES.map((e, i) => `<tr><td class="name">${esc(e.name)}</td>${scores.map(x => `<td class="num">${r0(x.s.per[i].pct)}%</td>`).join('')}<td class="num">${multi ? deltaHTML(ls.per[i].pct - bs.per[i].pct) : '—'}</td></tr>`).join('')}
    <tr><td class="name">Puntaje global</td>${scores.map(x => `<td class="num"><b>${r0(x.s.pct)}%</b></td>`).join('')}<td class="num">${multi ? deltaHTML(ls.pct - bs.pct) : '—'}</td></tr></tbody></table></div>
  </section>`;
}

/* =====================================================================
   Empresa (perfil)
   ===================================================================== */
function viewCompany() {
  const co = CTX.company, u = CTX.user, f = finals(co.id), isAdmin = u.role === 'admin';
  AFTER.push(() => {
    bindForm($('#coForm'), fd => {
      const name = fd.get('name').trim(); if (!name) { toast('La razón social es obligatoria.', 'err'); return; }
      Object.assign(co, {name, sector: fd.get('sector').trim(), city: fd.get('city').trim(), size: fd.get('size')});
      if (fd.get('baseYear')) co.baseYear = Number(fd.get('baseYear'));
      DB.persist(); toast('Datos de la empresa guardados'); render(); });
    const pf = $('#pwForm'); if (pf) bindForm(pf, async fd => {
      if ((await hash(fd.get('cur'), u.salt)) !== u.pass) { toast('La contraseña actual no es correcta.', 'err'); return; }
      if (String(fd.get('n1')).length < 6) { toast('La nueva contraseña debe tener al menos 6 caracteres.', 'err'); return; }
      if (fd.get('n1') !== fd.get('n2')) { toast('Las contraseñas nuevas no coinciden.', 'err'); return; }
      u.salt = uid(); u.pass = await hash(fd.get('n1'), u.salt); DB.persist(); pf.reset(); toast('Contraseña actualizada'); });
  });
  return `<div class="page-head"><div><h1>Empresa</h1><p class="sub">Datos de la organización y configuración del seguimiento.</p></div></div>
  <div class="cols">
    <section class="panel c7"><h2 style="margin-bottom:18px">Datos de la organización</h2>
      <form id="coForm" class="stack" style="gap:14px" novalidate>
        <label class="f">Razón social<input class="input" name="name" value="${esc(co.name)}" required></label>
        <div class="grid2"><label class="f">Sector<input class="input" name="sector" value="${esc(co.sector || '')}"></label>
        <label class="f">Tamaño<select class="input" name="size">${['Micro (hasta 9 personas)', 'Pequeña (10 a 49 personas)', 'Mediana (50 a 250 personas)', 'Grande (más de 250 personas)'].map(s => `<option ${co.size === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div>
        <div class="grid2"><label class="f">Localidad<input class="input" name="city" value="${esc(co.city || '')}"></label>
        <label class="f">Año base<select class="input" name="baseYear" ${f.length ? '' : 'disabled'}>${f.length ? f.map(c => `<option ${Number(co.baseYear) === c.year ? 'selected' : ''}>${c.year}</option>`).join('') : '<option value="">Se define con el primer diagnóstico</option>'}</select></label></div>
        <div><button class="btn primary">Guardar datos</button></div>
      </form></section>
    ${isAdmin ? `<section class="panel c5"><h2 style="margin-bottom:12px">Usuarios</h2>${DB.companyUsers(co.id).map(x => `<p><b>${esc(x.name)}</b><br><span class="muted small">${esc(x.email)}</span></p>`).join('') || '<p class="muted">Sin usuarios</p>'}<p class="small muted" style="margin-top:12px">El acceso se gestiona desde el panel de empresas.</p></section>`
    : `<section class="panel c5"><h2 style="margin-bottom:18px">Cambiar contraseña</h2>
      <form id="pwForm" class="stack" style="gap:14px" novalidate>
        <label class="f">Contraseña actual<input class="input" type="password" name="cur" required autocomplete="current-password"></label>
        <label class="f">Nueva contraseña<input class="input" type="password" name="n1" required minlength="6" autocomplete="new-password"></label>
        <label class="f">Repetir nueva contraseña<input class="input" type="password" name="n2" required minlength="6" autocomplete="new-password"></label>
        <div><button class="btn primary">Actualizar contraseña</button></div>
      </form></section>`}
  </div>`;
}

/* =====================================================================
   Boot
   ===================================================================== */
(async function boot() {
  if (!DB.load() || !DB.d.users) await seed();
  // v2: el cronograma pasa a respetar el orden de ejes e indicadores
  if ((DB.d.version || 1) < 2) { DB.d.cycles.forEach(c => { if (c.plan && Object.keys(c.plan).length) autoSchedule(c, 'all'); }); DB.d.version = 2; DB.persist(); }
  render();
})();

</script>
</body>
